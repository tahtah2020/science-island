<!-- Math Grade 4 · Unit 1 (mg4u1) adventure «العبّارة المائلة / The Tilting Ferry», lesson 7 (ordering big numbers ascending and descending,
     ordering numbers written in different forms, finding the mistake in an ordering).
     LOAD: the loading order (ascending ⬆ / descending ⬇) is fixed on screen; trucks wait on the dock, each with a number (standard form, words
           or expanded form); tap them in order, each tap drives one truck onto the ferry. A wrong truck tilts the ferry and the water rises.
     FOX (from tunnel… ferry rounds of races 4-6): the fox loaded a full ferry but swapped two trucks; tap two trucks on the deck to swap them back.
     Excitement: a storm; the water rises one mark on a wrong truck or when the ferry's timer runs out; 5 marks = the dock floods (lost).
     Three right in a row = the ferry's horn, the water goes down a mark. Each full ferry sails to the other bank (water −1).
     Pictures: the owner's Gemini sheets (28 Oct 2026) cut out into math/assets/: ferry, truck (its white panel is painted with the truck's
     colour), reesho_captain_point / _worried, fox_swap (mirrored so the truck faces right), bg_nile_side.jpg; Reesho happy reused.
     Progress: SI.chProf('mg4u1').ferry = { lvl, best, stars[] }. Test hooks window.__ferry, window.__ferryApi. -->
<style>
:root{--navy:#1f3d57;--ink:#3a5c75;--card:rgba(255,250,240,.97);--pri:#23799f;--coral:#e2603f;--ok:#2e9e6b;--gold:#f2b134}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:Nunito,Cairo,sans-serif;background:linear-gradient(#a9d8ee,#d6eef6 32%,#7fbad6 32.1%,#4f8fb3);color:var(--navy);min-height:100svh}
.wrap{max-width:600px;margin:0 auto;padding:10px 12px 30px}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.top h1{font-size:21px;margin:0}
.pills{display:flex;gap:6px}
.pill{background:#ffffffaa;border-radius:99px;padding:3px 12px;font-weight:800;font-size:14px}
#scene{width:100%;height:auto;display:block;margin-top:6px;border-radius:16px;background:#bfe3f2}
.say{margin:8px 0}
.bubble{background:#fff;border-radius:16px;padding:8px 12px;font-size:15px;min-height:44px;box-shadow:0 3px 10px #0002;line-height:1.6}
.panel{background:var(--card);border-radius:20px;padding:10px;box-shadow:0 6px 20px #0003}
bdi{font-weight:900;color:var(--pri)}
.sign{border-radius:14px;padding:7px 10px;margin-bottom:8px;color:#fff;font-weight:900;font-size:17px;text-align:center;background:var(--pri)}
.sign.desc{background:#8e5bd0}
.sign.fox{background:var(--coral)}
.sign small{display:block;font-size:12.5px;font-weight:800;opacity:.92}
.timer{height:8px;border-radius:8px;background:#ffffff55;overflow:hidden;margin-top:5px}
.timer i{display:block;height:100%;width:100%;background:#fff;border-radius:8px}
.timer.low i{background:#ffd34a;animation:blink .5s infinite}
@keyframes blink{50%{opacity:.4}}
.lab{font-weight:900;font-size:13px;color:var(--ink);margin:2px 2px 4px}
.deck{display:grid;gap:4px;background:#d9e6ee;border-radius:12px;padding:5px;margin-bottom:8px}
.slot{min-height:44px;border-radius:9px;border:2px dashed #a9bfcc;background:#f3f8fb;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:2px;font:900 12.5px/1.15 Nunito,Cairo,sans-serif;color:var(--navy);text-align:center;cursor:default;position:relative}
.slot.full{border:2px solid var(--c);background:#fff}

.tk{border:2px solid #e8dcc0;border-radius:12px;background:#fff;display:flex;align-items:center;gap:6px;padding:4px 6px;cursor:pointer;min-height:54px;text-align:start;font:inherit;color:var(--navy);box-shadow:0 3px 0 #e2d4b2}

.tk .pic{position:relative;flex:none;width:52px}

.tk .num.exp{direction:ltr;unicode-bidi:isolate;font:900 12.5px/1.35 Nunito,sans-serif}

.btn{border:0;border-radius:14px;padding:11px 20px;font:900 17px Nunito,Cairo;background:var(--gold);color:var(--navy);cursor:pointer;box-shadow:0 4px 0 #c88f1c}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #c88f1c}
.btn.alt{background:#fff;box-shadow:0 4px 0 #c9d6dc}
.horn{display:flex;align-items:center;gap:4px;font-weight:900;font-size:13px;color:var(--ink)}
.horn i{width:14px;height:14px;border-radius:50%;background:#e6dccb;display:inline-block;transition:.2s}
.horn i.on{background:var(--gold);box-shadow:0 0 6px var(--gold)}
.veil{position:fixed;inset:0;background:#1f3d57cc;display:flex;align-items:center;justify-content:center;padding:16px;z-index:9}
.veil[hidden]{display:none}
.box{background:#fff;border-radius:20px;padding:20px;max-width:390px;text-align:center}
.box h2{margin:4px 0 8px}
.box ol{text-align:start;padding-inline-start:20px;line-height:1.8;margin:6px 0 12px}
.introart{direction:ltr;display:flex;justify-content:center;align-items:flex-end;gap:8px}.introart img{height:80px}
#endArt img{height:110px}
.stars{font-size:34px;letter-spacing:4px}
.home{display:inline-flex;align-items:center;justify-content:center;text-decoration:none;background:#ffffffaa;border-radius:99px;color:var(--navy);font-size:16px;width:34px;height:30px}
.snd{background:#ffffffaa;border:0;border-radius:99px;font-size:16px;width:34px;height:30px;cursor:pointer}
.banner{position:fixed;left:50%;top:36%;transform:translate(-50%,-50%) scale(.6);background:var(--coral);color:#fff;font:900 24px Nunito,Cairo;padding:12px 24px;border-radius:18px;box-shadow:0 8px 24px #0006;opacity:0;pointer-events:none;z-index:8;transition:.3s;text-align:center;white-space:nowrap}
.banner.show{opacity:1;transform:translate(-50%,-50%) scale(1)}
.banner.good{background:var(--ok)}
#scene .rain{animation:rain .5s linear infinite}
@keyframes rain{to{transform:translate(-8px,22px)}}
#scene .bob{animation:bob 2.4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(1.5px)}}
#scene .shake{animation:shk .14s infinite;transform-box:fill-box}
@keyframes shk{50%{transform:translate(1px,-1px)}}
@media (prefers-reduced-motion:reduce){#scene .rain,#scene .bob,#scene .shake,.timer.low i{animation:none}}
@media (max-width:420px){.tk .num.std{font-size:15.5px}.tk .pic,.tk .pic img{width:44px}.sign{font-size:15.5px}}
</style>

<div class="wrap">
  <div class="top"><h1 data-ar="⛴️ العبّارة المائلة">⛴️ The Tilting Ferry</h1><div class="pills"><span class="pill"><span data-ar="الرحلة">Trip</span> <b id="lvl">1</b>/6</span><span class="pill">⭐ <b id="score">0</b></span><button class="snd" id="snd" type="button" aria-label="Sound" data-ar-label="الصوت">🔊</button><a class="home" href="adventures.html" aria-label="Back to the adventures" data-ar-label="رجوع للمغامرات">⌂</a></div></div>

<script>
(() => {
'use strict';
const me = SI.requirePlayer(); if (!me) return;
const CH = SI.requireChapter('mg4u1'); if (!CH) return;
const T = SI.T, AR = SI.isAr(), GAME = 'math-ferry.html';
const $ = s => document.querySelector(s);
const sleep = ms => new Promise(r => setTimeout(r, ms));
const n = s => `<bdi dir="ltr">${s}</bdi>`;
const rnd = k => Math.floor(Math.random() * k);
const pick = a => a[rnd(a.length)];
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = rnd(i + 1); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const fmt = x => Number(x).toLocaleString('en-US');
const P10 = e => 10 ** e;
document.title = T('The Tilting Ferry · Ordering Numbers', 'العبّارة المائلة · ترتيب الأعداد');
$('#rules').innerHTML = [
  T('The sign says how to load: <b>ascending ⬆</b> (smallest first) or <b>descending ⬇</b> (biggest first).', 'اللافتة بتقولك تحمّل إزاي: <b>تصاعديًا ⬆</b> (الأصغر الأول) أو <b>تنازليًا ⬇</b> (الأكبر الأول).'),
  T('Tap the trucks on the dock in that order. Some numbers are written in words or expanded form!', 'اضغط على الشاحنات اللي على الرصيف بالترتيب ده. فيه أعداد مكتوبة بالكلمات أو بالصيغة الممتدة!'),
  T('A wrong truck or a slow ferry = the water rises 🌊. <b>5 marks</b> and the dock floods!', 'شاحنة غلط أو عبّارة متأخرة = الميه تعلى 🌊. <b>5 علامات</b> والرصيف يغرق!'),
  T('3 right in a row = the horn 📯: the water goes down.', '3 صح ورا بعض = البوق 📯: الميه تنزل.')].map(x => `<li>${x}</li>`).join('');
$('#start').textContent = T('Cast off! ⛴️', 'يلا نبحر ⛴️');

/* ---------- number words (the books' style, same code as math-train.html) ---------- */
const EN1 = ['', 'one', 'two', 'three', 'four', 'five', 'six', 'seven', 'eight', 'nine', 'ten', 'eleven', 'twelve', 'thirteen', 'fourteen', 'fifteen', 'sixteen', 'seventeen', 'eighteen', 'nineteen'];
const EN10 = ['', '', 'twenty', 'thirty', 'forty', 'fifty', 'sixty', 'seventy', 'eighty', 'ninety'];
function en3(x) { const h = Math.floor(x / 100), r = x % 100, out = []; if (h) out.push(EN1[h] + ' hundred'); if (r) out.push(r < 20 ? EN1[r] : EN10[Math.floor(r / 10)] + (r % 10 ? '-' + EN1[r % 10] : '')); return out.join(' '); }
function enWords(x) { const P = ['', ' thousand', ' million', ' milliard'], out = []; for (let p = 3; p >= 0; p--) { const c = Math.floor(x / 1000 ** p) % 1000; if (c) out.push(en3(c) + P[p]); } return out.join(', '); }
const AR1 = ['', 'واحد', 'اثنان', 'ثلاثة', 'أربعة', 'خمسة', 'ستة', 'سبعة', 'ثمانية', 'تسعة', 'عشرة', 'أحد عشر', 'اثنا عشر', 'ثلاثة عشر', 'أربعة عشر', 'خمسة عشر', 'ستة عشر', 'سبعة عشر', 'ثمانية عشر', 'تسعة عشر'];
const AR10 = ['', '', 'عشرون', 'ثلاثون', 'أربعون', 'خمسون', 'ستون', 'سبعون', 'ثمانون', 'تسعون'];
const ARH = ['', 'مائة', 'مائتان', 'ثلاثمائة', 'أربعمائة', 'خمسمائة', 'ستمائة', 'سبعمائة', 'ثمانمائة', 'تسعمائة'];
const ar2 = r => r < 20 ? AR1[r] : (r % 10 ? AR1[r % 10] + ' و' : '') + AR10[Math.floor(r / 10)];
function ar3(x) { const h = Math.floor(x / 100), r = x % 100, out = []; if (h) out.push(ARH[h]); if (r) out.push(ar2(r)); return out.join(' و'); }
/* a count of thousands / millions / milliards with its noun (العدد والمعدود) */
const NOUN = { 1: ['ألف', 'ألفان', 'آلاف', 'ألفًا'], 2: ['مليون', 'مليونان', 'ملايين', 'مليونًا'], 3: ['مليار', 'ملياران', 'مليارات', 'مليارًا'] };
function arCount(c, p) {
  const [one, two, many, acc] = NOUN[p], h = Math.floor(c / 100), r = c % 100;
  if (c === 1) return one; if (c === 2) return two;
  if (c <= 10) return AR1[c] + ' ' + many;
  if (r === 0) return (h === 2 ? 'مائتا' : ARH[h]) + ' ' + one;
  if (r <= 10) return ARH[h] + ' و' + AR1[r] + ' ' + many;
  return (h ? ARH[h] + ' و' : '') + ar2(r) + ' ' + acc;
}
function arWords(x) { const out = []; for (let p = 3; p >= 0; p--) { const c = Math.floor(x / 1000 ** p) % 1000; if (c) out.push(p ? arCount(c, p) : ar3(c)); } return out.join(' و'); }
function wordsOk(x) { for (let p = 1; p <= 3; p++) { const c = Math.floor(x / 1000 ** p) % 1000; if (c > 100 && (c % 100 === 1 || c % 100 === 2)) return false; } return true; }
const expanded = x => String(x).split('').map((d, i, a) => +d ? fmt(+d * P10(a.length - 1 - i)) : null).filter(Boolean).join(' + ');
const COLORS = ['#e2603f', '#23799f', '#2e9e6b', '#8e5bd0', '#f2b134', '#d94f8a'];

/* six trips; n = trucks; dg = digits; close = share of numbers made by changing one or two digits of the same base (the book's hard pairs);
   plan = the ferries of the trip (asc / desc / fox); sec = seconds per truck on the timer */
const LEVELS = [
  { n: 4, dg: [4, 5], forms: ['std'], close: 0, plan: ['asc', 'desc', 'asc'], sec: 10 },
  { n: 5, dg: [5, 6], forms: ['std'], close: .4, plan: ['desc', 'asc', 'desc'], sec: 9 },
  { n: 5, dg: [6, 7], forms: ['std', 'std', 'words'], close: .5, plan: ['asc', 'desc', 'asc'], sec: 10 },
  { n: 5, dg: [6, 7], forms: ['std', 'expanded', 'words'], close: .6, plan: ['asc', 'fox', 'desc'], sec: 10 },
  { n: 6, dg: [6, 8], forms: ['std', 'expanded', 'words'], close: .7, plan: ['desc', 'fox', 'asc'], sec: 9 },
  { n: 6, dg: [7, 9], forms: ['std', 'expanded', 'words'], close: .85, plan: ['asc', 'fox', 'desc', 'fox'], sec: 8, boss: true }];
const MAXW = 5;
const S = { t0: Date.now(), lvl: Math.min(5, ((SI.chProf(CH.id).ferry || {}).lvl) || 0), score: 0, water: 0, misses: 0, streak: 0, fi: 0, busy: true, started: false,
  dir: 'asc', fox: false, trucks: [], deck: [], sel: -1, deadline: 0, hintN: 0, x: 0 };
const L = () => LEVELS[S.lvl];

function randNum(d) { let s = String(1 + rnd(9)); for (let i = 1; i < d; i++) s += rnd(10); return +s; }
function makeTrucks() {
  const lv = L(), out = new Set();
  const base = randNum(lv.dg[0] + rnd(lv.dg[1] - lv.dg[0] + 1));
  let guard = 0;
  while (out.size < lv.n && guard++ < 500) {
    let x;
    if (Math.random() < lv.close) {           // same digits as the base except one or two (often near the left)
      const s = String(base).split(''), k = 1 + rnd(2);
      for (let j = 0; j < k; j++) { const p = Math.min(s.length - 1, rnd(Math.min(4, s.length))); s[p] = String(p === 0 ? 1 + rnd(9) : rnd(10)); }
      x = +s.join('');
    } else x = randNum(lv.dg[0] + rnd(lv.dg[1] - lv.dg[0] + 1));
    out.add(x);
  }
  const colors = shuffle(COLORS);
  return [...out].map((x, i) => { let form = pick(lv.forms); if (form === 'words' && !wordsOk(x)) form = 'expanded'; return { x, form, c: colors[i], id: i }; });
}
const sorted = (arr, dir) => arr.slice().sort((a, b) => dir === 'asc' ? a.x - b.x : b.x - a.x);
const inOrder = (arr, dir) => arr.every((t, i) => !i || (dir === 'asc' ? arr[i - 1].x < t.x : arr[i - 1].x > t.x));

/* ---------- panel ---------- */
function numHTML(t) {
  if (t.form === 'words') return `<span class="num words">${T(enWords(t.x), arWords(t.x))}</span>`;
  if (t.form === 'expanded') return `<span class="num exp">${expanded(t.x)}</span>`;
  return `<span class="num std">${fmt(t.x)}</span>`;
}
function drawSign() {
  const lv = L(), cls = S.fox ? 'fox' : S.dir;
  const main = S.fox ? T('🦊 The fox swapped two trucks!', '🦊 الثعلب بدّل شاحنتين!') : S.dir === 'asc' ? T('Load in ASCENDING order ⬆', 'حمّل تصاعديًا ⬆') : T('Load in DESCENDING order ⬇', 'حمّل تنازليًا ⬇');
  const sub = S.fox ? (S.dir === 'asc' ? T('The ferry must be ascending: tap the two wrong trucks to swap them.', 'العبّارة لازم تكون تصاعدي: اضغط على الشاحنتين الغلط عشان تبدّلهم.') : T('The ferry must be descending: tap the two wrong trucks to swap them.', 'العبّارة لازم تكون تنازلي: اضغط على الشاحنتين الغلط عشان تبدّلهم.'))
    : S.dir === 'asc' ? T('from the smallest to the biggest', 'من الأصغر إلى الأكبر') : T('from the biggest to the smallest', 'من الأكبر إلى الأصغر');
  $('#sign').className = 'sign ' + cls;
  $('#sign').innerHTML = `${main}<small>${sub}</small><div class="timer" id="timer"><i></i></div>`;
  void lv;
}
function drawDeck(flash = -1) {
  const k = L().n;
  const cols = innerWidth < 480 && k > 4 ? 3 : k;
  $('#deck').style.gridTemplateColumns = `repeat(${cols},minmax(0,1fr))`;
  let h = '';
  for (let i = 0; i < k; i++) {
    const t = S.deck[i];
    h += t ? `<div class="slot full${S.fox ? ' pick' : ''}${S.sel === i ? ' sel' : ''}${flash === i ? ' new' : ''}" style="--c:${t.c}" data-i="${i}" ${S.fox ? 'role="button" tabindex="0"' : ''}><span class="k" style="color:${t.c}">■ ${i + 1}</span><span class="v">${fmt(t.x)}</span></div>`
      : `<div class="slot" data-i="${i}"><span class="k">${i + 1}</span></div>`;
  }
  $('#deck').innerHTML = h;
  $('#ends').innerHTML = S.dir === 'asc' ? `<span>${T('1 = smallest', '1 = الأصغر')}</span><span>${T('biggest', 'الأكبر')}</span>` : `<span>${T('1 = biggest', '1 = الأكبر')}</span><span>${T('smallest', 'الأصغر')}</span>`;
  if (S.fox) $('#deck').querySelectorAll('.slot.full').forEach(b => b.onclick = () => pickSwap(+b.dataset.i));
}
function drawQueue() {
  $('#qlab').hidden = S.fox; $('#queue').hidden = S.fox;
  if (S.fox) { $('#queue').innerHTML = ''; return; }
  $('#queue').innerHTML = S.trucks.map(t => `<button type="button" class="tk${t.on ? ' gone' : ''}" style="--c:${t.c}" data-id="${t.id}" aria-label="${T('Truck', 'شاحنة')} ${fmt(t.x)}"><span class="pic"><img src="math/assets/truck.webp" alt=""><i class="pan"></i></span>${numHTML(t)}</button>`).join('');

/* ---------- scene ----------

/* ---------- music and sound (Web Audio, no files): a rolling river tune; faster as the water rises ---------- */
const A = { ctx: null, on: !SI.isMuted(), timer: null, beat: 0, next: 0, mode: 'off' };

function musicTick() {

  horn() { if (!ac()) return; const t = A.ctx.currentTime; tone(43, t, .9, { type: 'sawtooth', vol: .1, cut: 700 }); tone(50, t, .9, { type: 'sawtooth', vol: .07, cut: 700 }); },
  sneak() { if (!ac()) return; const t = A.ctx.currentTime; [76, 72, 76, 72].forEach((m, i) => tone(m, t + i * .14, .1, { type: 'sine', vol: .07 })); },
