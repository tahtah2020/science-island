<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hope Trail · Work and Hope</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@700;800;900&family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="game_kit.css?v=20261127t122501">
</head>
<body>
<noscript>Please turn on JavaScript to play Hope Trail.</noscript>
<script src="firebase-config.js?v=20261127t122501"></script>
<script src="chapters.js?v=20261127t122501"></script>
<script src="common.js?v=20261127t122501"></script>
<script src="game_kit.js?v=20261127t122501"></script>
<script>
(() => {
'use strict';
/* Hope Trail · the game of Work and Hope (Arabic g3, book pages 7-43). Built on the shared game kit (game_kit.js).
   Stage 1 (Warm Up): question words من / ما / هل / لماذا (lesson 2, pp. 9-21)
   Stage 2 (Missions): 1 caring for a plant (lesson 1) · 2 Heba keeps trying (lesson 2) · 3 the hidden hero (lesson 3) · 4 secrets of success (lesson 4)
   Stage 3 (Speed Round): near or far demonstrative (lesson 3, pp. 22-33)
   Every T('English', 'عربي') has both languages. The Arabic sentences follow the Arabic school book. No picture ever shows the answer. */
const T = SI.T, G = SI.G;
const P = (m, f) => G(m, f || m);   // Arabic for a boy / for a girl
const sc = { mode: 'start' };       // what the scene shows
const VW = 420, VH = 280;
const K = '#1f3d57';
const ground = `<rect y="214" width="${VW}" height="66" fill="#bfe3a0"/>`;
const sun = (x, y) => `<circle cx="${x}" cy="${y}" r="26" fill="#f6c453" stroke="#d99a12" stroke-width="3"/>`;
const potSvg = (x, y, k) => `<g transform="translate(${x} ${y}) scale(${k})"><path d="M-26 0h52l-8 34h-36z" fill="#e2603f" stroke="${K}" stroke-width="3" stroke-linejoin="round"/><rect x="-30" y="-8" width="60" height="12" rx="4" fill="#ee7a57" stroke="${K}" stroke-width="3"/><path d="M0 -8v-44" stroke="#3f8f4c" stroke-width="5" stroke-linecap="round"/><path d="M0 -34q-30 -4 -32 -28q28 -2 32 28zM0 -46q30 -4 32 -28q-28 -2 -32 28z" fill="#7cc86e" stroke="#3f8f4c" stroke-width="3" stroke-linejoin="round"/></g>`;
const person = (x, y, c) => `<g transform="translate(${x} ${y})"><circle cy="-30" r="14" fill="#e7b98f" stroke="${K}" stroke-width="2"/><path d="M-14 -34q14 -24 28 0q-4 -9 -14 -9t-14 9Z" fill="#3a5c75"/><path d="M-18 14q0 -42 18 -42t18 42Z" fill="${c}" stroke="${K}" stroke-width="2"/></g>`;
function render() {
  const m = sc.mode;
  let s = `<rect width="${VW}" height="${VH}" fill="#eef6fb"/>`;
  if (m === 'start') {
    s += ground + sun(340, 56) + potSvg(120, 190, 1.3)
      + `<g transform="translate(270 190)"><path d="M-46 -26q23 -10 46 4q23 -14 46 -4v52q-23 -10 -46 4q-23 -14 -46 -4z" fill="#fffaf0" stroke="${K}" stroke-width="3" stroke-linejoin="round"/><path d="M0 -22v52" stroke="${K}" stroke-width="3"/></g>`;
  } else if (m === 'plant') {
    s += `<rect y="180" width="${VW}" height="100" fill="#d9b88a"/><rect x="30" y="40" width="130" height="110" rx="6" fill="#cfe8f6" stroke="${K}" stroke-width="3"/><path d="M95 40v110M30 95h130" stroke="${K}" stroke-width="3"/>`
      + potSvg(260, 170, 1.8);
  } else if (m === 'paper') {
    s += `<rect y="200" width="${VW}" height="80" fill="#e8d3b0"/><rect x="60" y="60" width="150" height="120" fill="#fffaf0" stroke="${K}" stroke-width="3" transform="rotate(-4 135 120)"/><path d="M80 150q30 -50 50 -10t60 -30" fill="none" stroke="#9fb7c6" stroke-width="5" stroke-linecap="round"/>`
      + person(300, 200, '#ee7a57');
  } else if (m === 'school') {
    s += ground + sun(60, 50) + `<rect x="120" y="100" width="180" height="114" rx="6" fill="#fde0bd" stroke="${K}" stroke-width="3"/><path d="M104 100l106 -52l106 52z" fill="#e2603f" stroke="${K}" stroke-width="3" stroke-linejoin="round"/><path d="M190 214v-44a20 20 0 0 1 40 0v44z" fill="#7cc86e" stroke="${K}" stroke-width="3"/><rect x="140" y="124" width="30" height="30" fill="#cfe8f6" stroke="${K}" stroke-width="2.6"/><rect x="250" y="124" width="30" height="30" fill="#cfe8f6" stroke="${K}" stroke-width="2.6"/>`
      + (sc.who ? person(340, 214, '#7e57c2') : '') + `<text x="210" y="82" text-anchor="middle" font-family="Cairo, sans-serif" font-size="20" font-weight="900" fill="#fff">${sc.note || ''}</text>`;
  } else if (m === 'bee') {
    s += ground + sun(350, 50) + `<g transform="translate(110 190)"><path d="M-34 24q-6 -52 34 -62q40 10 34 62z" fill="#f6c453" stroke="${K}" stroke-width="3.4" stroke-linejoin="round"/><path d="M-30 4h60M-33 -14h66" stroke="#d99a12" stroke-width="3.4"/><ellipse cx="0" cy="14" rx="9" ry="11" fill="${K}"/></g>`
      + `<g transform="translate(270 110)"><ellipse rx="26" ry="18" fill="#f6c453" stroke="${K}" stroke-width="3"/><path d="M-8 -17v34M6 -17v34" stroke="${K}" stroke-width="5"/><ellipse cx="-4" cy="-22" rx="14" ry="9" fill="#e8f3fa" stroke="${K}" stroke-width="2"/><ellipse cx="10" cy="-22" rx="14" ry="9" fill="#e8f3fa" stroke="${K}" stroke-width="2"/><circle cx="18" cy="-3" r="3" fill="${K}"/></g>`;
  } else if (m === 'trophy') {
    s += ground + sun(70, 54) + `<g transform="translate(210 150) scale(2)"><path d="M-24 -40h48v22q0 22 -24 26q-24 -4 -24 -26z" fill="#f2b134" stroke="${K}" stroke-width="3" stroke-linejoin="round"/><path d="M-24 -34q-18 0 -16 14q2 12 18 14M24 -34q18 0 16 14q-2 12 -18 14" fill="none" stroke="${K}" stroke-width="3" stroke-linecap="round"/><rect x="-6" y="8" width="12" height="14" fill="#f2b134" stroke="${K}" stroke-width="3"/><rect x="-20" y="22" width="40" height="10" rx="3" fill="#d99a12" stroke="${K}" stroke-width="3"/></g>`;
  } else if (m === 'demo') {
    s += ground + sun(60, 48)
      + person(90, 214, '#7e57c2') + person(140, 214, '#ee7a57')
      + `<path d="M250 214l60 -90l60 90z" fill="#c9d3dc" stroke="${K}" stroke-width="3" stroke-linejoin="round"/><path d="M290 150l20 -26l20 26z" fill="#fff" stroke="${K}" stroke-width="2"/>`;
  } else if (m === 'photo') {
    s += `<defs><clipPath id="phc"><rect x="70" y="0" width="280" height="280" rx="18"/></clipPath></defs><image href="arabic/assets/${sc.img}.webp" x="70" y="0" width="280" height="280" preserveAspectRatio="xMidYMid slice" clip-path="url(#phc)"/><rect x="70" y="0" width="280" height="280" rx="18" fill="none" stroke="${K}" stroke-width="3"/>`;
  } else if (m === 'ask') {
    s += ground + sun(350, 54) + `<g transform="translate(210 150)"><ellipse rx="86" ry="62" fill="#fffaf0" stroke="${K}" stroke-width="4"/><text y="38" text-anchor="middle" font-family="Cairo, sans-serif" font-size="110" font-weight="900" fill="#e2603f">؟</text></g>`;
  } else if (m === 'blank') {
    s += ground + sun(350, 54);
  }
  return s;
}
const g = G4Game({ ch: 'ag3u1', logo: '🌱', title: ["Hope Trail", "رحلة الأمل"], sub: ['Chapter 1 · Work and Hope', 'الفصل 1 · العمل والأمل'],
  bg: 'arabic/assets/bg_ag3u1.svg', bgc: '#fbe3e3', label: ["Hope Trail", "رحلة الأمل"], render });
const set = (mode, o) => { Object.assign(sc, { mode, who: false, note: '' }, o || {}); g.paint(); };
const kw = w => `<b>${w}</b>`;

async function stage1() {
  set('ask');
  g.say(T('Welcome to the Hope Trail! First, question words. Which word asks about a <b>person</b>?', P('أهلًا في رحلة الأمل! نبدأ بأدوات الاستفهام. أي أداة نسأل بها عن <b>إنسان</b>؟')), 'point');
  await g.choice({ options: ['من', 'ما', 'هل', 'لماذا'], correct: 'من', hint: T('Think of "Who won the contest?"', 'فكّر في سؤال: ... فاز في المسابقة؟'),
    ok: T('Right! We ask about a person with من.', `صح! نسأل عن الإنسان بـ ${kw('من')}.`) });
  g.say(T('Which word asks about something that is <b>not a person</b>?', 'وأي أداة نسأل بها عن <b>غير الإنسان</b>؟'), 'think');
  await g.choice({ options: ['ما', 'من', 'هل', 'لماذا'], correct: 'ما', hint: T('Think of "What is this? This is a penguin."', 'فكّر في سؤال: ... هذا؟ – هذا بطريق.'),
    ok: T('Right!', `برافو! نسأل عن غير الإنسان بـ ${kw('ما')}.`) });
  g.say(T('Which word has the answer <b>yes or no</b>?', 'وأي أداة جوابها <b>نعم أو لا</b>؟'), 'think');
  await g.choice({ options: ['هل', 'ما', 'من', 'لماذا'], correct: 'هل', hint: T('"___ you like stories? Yes."', '... تحب القصص؟ – نعم.'),
    ok: T('Right!', `صح! جواب ${kw('هل')} يكون نعم أو لا.`) });
  g.say(T('Which word asks about the <b>reason</b>?', 'وأي أداة نسأل بها عن <b>السبب</b>؟'), 'think');
  await g.choice({ options: ['لماذا', 'هل', 'من', 'ما'], correct: 'لماذا', hint: T('The answer starts with "because".', 'الجواب يبدأ بـ (لأن).'),
    ok: T('Right!', `برافو! نسأل عن السبب بـ ${kw('لماذا')}.`) });
}
async function stage2() {
  /* Mission 1 · plant */
  set('plant');
  g.say(T('Mission 1: you have a plant. Where is the best place for it?', P('المهمة ١: معك نبتة. ما أنسب مكان لها؟')), 'point');
  await g.choice({ options: ['مكان مشمس حسب حاجتها', 'تحت السرير دائمًا', 'في غرفة مظلمة'], correct: 'مكان مشمس حسب حاجتها', hint: T('Plants need light.', 'النبتة تحتاج إلى ضوء.'),
    ok: T('Right.', 'صح! النبتة تحتاج إلى ضوء، فنضعها في مكان مشمس حسب حاجتها.') });
  g.say(T('How do we water the plant?', 'وكيف نسقي النبتة؟'), 'think');
  await g.choice({ options: ['بانتظام وبقدر حاجتها', 'مرة في الشهر', 'بكمية كبيرة أكثر من حاجتها'], correct: 'بانتظام وبقدر حاجتها', hint: T('Not too little, not too much.', 'لا قليلًا جدًّا ولا كثيرًا جدًّا.'),
    ok: T('Right.', 'برافو! نسقيها بانتظام وبقدر حاجتها.') });
  g.say(T('And the pot?', 'والإناء الذي زرعناها فيه؟'), 'think');
  await g.choice({ options: ['ننظفه', 'نتركه متسخًا'], correct: 'ننظفه', hint: T('We care for everything around the plant.', 'نهتم بكل ما حول النبتة.'),
    ok: T('Right.', 'صح! ننظف الإناء.') });

  /* Mission 2 · Heba */
  set('photo', { img: 'a3_heba_tear' });
  g.say(T('Mission 2: Heba loves drawing. Her first painting did not please her, and she tore it up. How does she feel?', P('المهمة ٢: تحب هبة الرسم. لم تُعجبها لوحتها الأولى فمزّقتها. بماذا تشعر؟')), 'point');
  await g.choice({ options: ['إحباط', 'سعادة', 'أمل'], correct: 'إحباط', hint: T('She wants to give up.', 'تريد أن تتوقف عن الرسم.'),
    ok: T('Right.', 'صح! تشعر بالإحباط.') });
  set('photo', { img: 'a3_heba_father' });
  g.say(T('Her father gave her a new notebook and wrote on it: "Please, try again." What did he want her to do?', 'أبوها أعطاها كراسة جديدة وكتب عليها: «من فضلك كرري محاولاتك». ماذا يريد منها؟'), 'think');
  await g.choice({ options: ['تكرر المحاولة وتتعلم من أخطائها', 'تترك الرسم', 'تمزق كل لوحاتها'], correct: 'تكرر المحاولة وتتعلم من أخطائها', hint: T('The lesson title says it.', 'عنوان الدرس بيقول.'),
    ok: T('Right.', 'برافو! كرّرت المحاولة وتعلّمت من أخطائها.') });
  set('photo', { img: 'a3_heba_paint' });
  g.say(T('She drew every evening and got better. What happened at the end?', 'رسمت كل مساء فتحسّنت. ماذا حدث في النهاية؟'), 'think');
  await g.choice({ options: ['فازت لوحتها وعُلّقت على جدار المدرسة', 'تركت المسابقة', 'مزّقت اللوحة'], correct: 'فازت لوحتها وعُلّقت على جدار المدرسة', hint: T('Hope and practice work.', 'الأمل والتدريب بيجيبوا نتيجة.'),
    ok: T('Right.', 'صح! فازت لوحتها.'), reveal: () => set('photo', { img: 'a3_heba_win' }) });

  /* Mission 3 · hidden hero */
  set('photo', { img: 'a3_riddle_class' });
  g.say(T('Mission 3: a riddle! He is the first to arrive at school and the last to leave. Who is the hidden hero?', 'المهمة ٣: لغز! هو أول من يصل إلى المدرسة وآخر من يغادرها. من هو البطل الخفي؟'), 'point');
  await g.choice({ options: ['العم أمين، حارس المدرسة', 'الأستاذ أحمد', 'مدير المدرسة'], correct: 'العم أمين، حارس المدرسة', hint: T('He guards the school.', 'هو بيحرس المدرسة.'),
    ok: T('Right.', 'برافو! هو حارس المدرسة، العم أمين.'), reveal: () => set('photo', { img: 'a3_guard_gate' }) });
  g.say(T('According to Mr. Ahmed, who is a hero?', 'حسب الأستاذ أحمد، من هو البطل؟'), 'think');
  await g.choice({ options: ['من يساعد الآخرين ويكون له دور في حياتهم', 'الأقوى في المدرسة', 'من يحصل على أعلى الدرجات'], correct: 'من يساعد الآخرين ويكون له دور في حياتهم', hint: T('Remember what the teacher said at the end.', 'افتكر كلام المعلم في الآخر.'),
    ok: T('Right.', 'صح! كل من يساعد الآخرين بطل.') });
  set('photo', { img: 'a3_friends_near' });
  g.say(T('Near friends are next to me. Which word points to near <b>people</b>?', 'أصدقاء بجانبي. أي كلمة نشير بها إلى <b>جمع قريب</b>؟'), 'think');
  await g.choice({ options: ['هؤلاء', 'أولئك'], correct: 'هؤلاء', hint: T('They are close to me.', 'هم قريبون مني.'),
    ok: T('Right.', `صح! ${kw('هؤلاء')} للجمع القريب و${kw('أولئك')} للجمع البعيد.`) });
  set('photo', { img: 'a3_climbers_far' });
  g.say(T('The climbers on the far mountain. Which word?', 'المتسلقون فوق قمة الجبل البعيد. أي كلمة؟'), 'think');
  await g.choice({ options: ['أولئك', 'هؤلاء'], correct: 'أولئك', hint: T('They are far away.', 'هم بعيدون.'),
    ok: T('Right.', 'برافو!') });

  /* Mission 4 · poem */
  set('bee');
  g.say(T('Mission 4: the poem says the successful person lives the day like a honey bee. What does that show?', 'المهمة ٤: النشيد يقول إن الناجح يعيش يومه كنحلة العسل. ماذا يدل ذلك؟'), 'point');
  await g.choice({ options: ['النشاط', 'الراحة', 'النوم'], correct: 'النشاط', hint: T('What does a bee do all day?', 'ماذا تفعل النحلة طوال اليوم؟'),
    ok: T('Right.', 'صح! يدل على النشاط.') });
  g.say(T('What is the first reason for success in the poem?', 'ما أول سبب للنجاح في النشيد؟'), 'think');
  await g.choice({ options: ['الشعور الدائم بالأمل', 'الحظ', 'كثرة النوم'], correct: 'الشعور الدائم بالأمل', hint: T('His companion is hope.', 'رفيقه الأمل.'),
    ok: T('Right.', 'برافو! أول سبب هو الأمل.') });
  g.say(T('Which trait does <b>not</b> suit a successful person?', 'أي صفة <b>لا</b> تناسب الناجح؟'), 'think');
  await g.choice({ options: ['كسول', 'متفائل', 'حريص على وقته'], correct: 'كسول', hint: T('A successful person works hard.', 'الناجح يعمل بجد.'),
    ok: T('Right.', 'صح! الكسول لا يتقن عمله.') });
}
const DM = [['هذا', 'n'], ['هذه', 'n'], ['ذلك', 'f'], ['تلك', 'f'], ['هؤلاء', 'n'], ['أولئك', 'f'], ['ذلك', 'f'], ['هذا', 'n'], ['تلك', 'f'], ['هؤلاء', 'n']];
async function stage3() {
  /* near boy, far climbers: fits near / far (owner photo, 20 Nov 2026) */
  set('photo', { img: 'a3_climbers_far' });
  await g.speedRound({ items: DM.map(([w, r]) => ({ t: `<span dir="rtl" lang="ar">${w}</span>`, ans: r,
      why: r === 'n' ? T('For things that are near.', 'للقريب.') : T('For things that are far.', 'للبعيد.') })), rounds: 10,
    buttons: [{ label: T('Near', 'للقريب'), value: 'n', c: 0 }, { label: T('Far', 'للبعيد'), value: 'f', c: 2 }],
    ask: T('Near or far?', 'للقريب أم للبعيد؟'),
    intro: T('Speed Round! A demonstrative word comes in. Press Near or Far.', 'جولة السرعة! ستظهر كلمة إشارة. اضغط للقريب أو للبعيد.'),
    think: T('Near or far?', 'قريب أم بعيد؟') });
}

g.run({
  intro: T(`Hi, <b>${g.name()}</b>! Follow the Hope Trail: question words, caring for a plant, Heba who never gives up, the hidden hero and the secrets of success.`, `أهلًا يا <b>${g.name()}</b>! سِر في رحلة الأمل: أدوات الاستفهام، ورعاية النبتة، وهبة التي لا تيأس، والبطل الخفي، وأسرار النجاح. ٣ مراحل: التسخين والمهمات وجولة السرعة.`),
  stages: [{ name: T('Warm Up', 'التسخين'), fn: stage1 }, { name: T('Missions', 'المهمات'), fn: stage2 }, { name: T('Speed Round', 'جولة السرعة'), fn: stage3 }],
  done: { title: T('Well done!', P('برافو عليك!', 'برافو عليكي!')), text: T('You know the question words, how to care for a plant, who a hero is, and the secrets of success. Next, try the questions of this unit.', 'أصبحت تعرف أدوات الاستفهام، وكيف ترعى نبتة، ومن البطل، وأسرار النجاح. جرّب الآن أسئلة الوحدة.') }
}).catch(err => console.error(err));
})();
</script>
</body>
</html>
