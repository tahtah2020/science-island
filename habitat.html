<body>

<script src="game_kit.js?v=20261026e"></script>
<script>
(() => {
'use strict';
/* Habitat Explorer · the game of Grade 4, Chapter 1 "Nature in Our Surroundings".
   Stage 1 (Warm Up): find where living organisms are in a dry place: in the grass, under the stone, on the sunny rock.
   Stage 2 (Missions): 1) two habitats: who lives along the Nile River and who lives in the desert;
                       2) desert secrets: the fennec fox's ears and feet, the jerboa's back legs, the day in a cool hole and the night outside.
   Stage 3 (Speed Round): Nile River or desert?
   Every T('English', 'عربي') has both languages. The Arabic science sentences follow the Arabic school book (pages 6-23). */
const A = window.G4ART, at = A.at, T = SI.T, G = SI.G;
const P = (m, f) => G(m, f || m);   // Arabic for a boy / for a girl
const ring = (cx, cy, rx, ry) => `<ellipse class="ring" cx="${cx}" cy="${cy}" rx="${rx}" ry="${ry}"/>`;

/* ---------- the scene: everything is drawn from this one state ---------- */
const sc = { mode: 'yard', found: {}, lift: 0, placed: [], card: null, hi: null, hop: 0, night: 0, out: 0 };

/* the six living organisms of the book's table (page 17) */
const ORG = {
  frog: { name: T('frog', 'الضفدع'), side: 'nile', card: () => at(0, 28, 1.15, A.frog()), put: () => at(58, 238, .85, A.frog()) },
  lotus: { name: T('lotus', 'اللوتس'), side: 'nile', card: () => at(0, 22, 1.05, A.lotus()), put: () => at(128, 150, .75, A.lotus()) },
  bird: { name: T('water bird', 'الطائر المائي'), side: 'nile', card: () => at(-4, 32, .62, A.waterBird()), put: () => at(164, 240, .72, A.waterBird()) },
  fennec: { name: T('fennec fox', 'ثعلب الفنك'), side: 'desert', card: () => at(-6, 32, .5, A.fox()), put: () => at(262, 244, .58, A.fox()) },
  acacia: { name: T('acacia', 'السنط'), side: 'desert', card: () => at(0, 32, .62, A.acacia()), put: () => at(366, 190, .7, A.acacia()) },
  jerboa: { name: T('jerboa', 'اليربوع'), side: 'desert', card: () => at(4, 30, .74, A.jerboa()), put: () => at(336, 250, .62, A.jerboa()) }
};
const SIDE = { nile: T('Along the Nile River', 'ضفاف نهر النيل'), desert: T('Desert', 'الصحراء') };

function yard() {
  const f = sc.found, L = sc.lift;
  return `<rect width="420" height="280" fill="#cdeaf7"/>${at(372, 44, 1, A.sun(22))}
    <path d="M0 176h420v104H0z" fill="#f1d9a0"/><rect y="176" width="420" height="7" fill="#e3c583"/>
    <path d="M0 232q52 -12 105 0t105 0t105 0t105 0M20 262q40 -8 80 0t80 0t80 0t80 0t80 0" fill="none" stroke="#e3c583" stroke-width="3" opacity=".7"/>
    ${at(44, 180, 1, A.grassTuft())}${at(74, 186, 1.3, A.grassTuft())}${at(104, 180, .95, A.grassTuft())}
    ${f.grass ? at(84, 190, .82, A.grasshopper()) : ''}
    ${f.stone ? `<ellipse cx="204" cy="196" rx="40" ry="9" fill="#b98f5c" opacity=".7"/>${at(204, 199, .78, A.pillbug())}` : ''}
    <g transform="translate(${204 - L * 40} ${196 - L * 30}) rotate(${-L * 28})">${at(0, 0, 1.2, A.stone())}</g>
    ${at(334, 186, 1.08, A.rock())}${f.rock ? at(330, 102, .72, A.lizard()) : ''}`;
}
function two() {
  const hi = side => sc.hi === side ? `<rect x="${side === 'nile' ? 5 : 215}" y="5" width="200" height="270" rx="14" fill="none" stroke="#2e9e6b" stroke-width="7"/>` : '';
  const label = (x, s) => `<g><rect x="${x - 88}" y="9" width="176" height="28" rx="14" fill="#fff" opacity=".88"/><text x="${x}" y="29" text-anchor="middle" font-size="16" font-weight="900" fill="#1f3d57">${s}</text></g>`;
  const c = sc.card && ORG[sc.card];
  return `<defs><clipPath id="hL"><rect width="206" height="280"/></clipPath><clipPath id="hR"><rect x="214" width="206" height="280"/></clipPath></defs>
    <g clip-path="url(#hL)"><rect width="210" height="280" fill="#cdeaf7"/><rect y="118" width="210" height="80" fill="#8fd3ee"/>
      <path d="M0 136q16 -7 32 0t32 0t32 0t32 0t32 0t32 0t32 0M0 168q16 -7 32 0t32 0t32 0t32 0t32 0t32 0t32 0" fill="none" stroke="#fff" stroke-width="2.6" opacity=".7"/>
      <path d="M0 196C50 182 140 184 210 198V280H0Z" fill="#a8dc86"/><path d="M0 250C60 240 150 244 210 252V280H0Z" fill="#8a5f38" opacity=".5"/>
      ${at(26, 214, 1, A.palm())}${at(100, 222, .6, A.grassTuft())}${at(126, 262, .7, A.grassTuft())}${at(196, 216, .55, A.grassTuft())}</g>
    <g clip-path="url(#hR)"><rect x="214" width="210" height="280" fill="#fbe9c6"/>${at(388, 66, 1, A.sun(18))}
      <path d="M214 190C260 150 306 152 350 178C376 190 400 188 420 178V280H214Z" fill="#f1d9a0"/><path d="M214 232C262 206 320 214 366 236C390 246 408 244 420 240V280H214Z" fill="#e9c583"/>
      <path d="M232 262q24 -9 48 0t48 0t48 0" fill="none" stroke="#d9b06a" stroke-width="2.6" opacity=".7"/>${at(392, 266, .55, A.colocynth())}</g>
    <rect x="206" width="8" height="280" fill="#fff8ea"/>
    ${sc.placed.map(id => ORG[id].put()).join('')}${label(105, SIDE.nile)}${label(315, SIDE.desert)}${hi('nile')}${hi('desert')}
    ${c ? `<g transform="translate(210 112)"><rect x="-70" y="-58" width="140" height="124" rx="16" fill="#fff8ea" stroke="#23799f" stroke-width="4"/>${c.card()}<text x="0" y="57" text-anchor="middle" font-size="19" font-weight="900" fill="#1f3d57">${c.name}</text></g>` : ''}`;
}
const desertBack = `<rect width="420" height="280" fill="#fbe9c6"/><path d="M0 214C70 178 150 184 220 206C290 228 360 214 420 196V280H0Z" fill="#f1d9a0"/><path d="M0 246C80 232 180 238 260 250C330 260 380 256 420 250V280H0Z" fill="#e9c583"/>
  <path d="M30 266q30 -9 60 0t60 0M260 268q30 -9 60 0t60 0" fill="none" stroke="#d9b06a" stroke-width="2.6" opacity=".7"/>`;
function fennec() { return `${desertBack}${at(60, 54, 1, A.sun(24))}${at(72, 236, .6, A.rock())}${at(210, 250, 1.55, A.fox())}`; }
function jerboa() {
  const k = sc.hop, x = 70 + k * 280, y = 240 - Math.abs(Math.sin(k * Math.PI * 3)) * 62;
  return `${desertBack}${at(350, 54, 1, A.sun(24))}${at(60, 226, .5, A.acacia())}${at(214, 270, .62, A.colocynth())}
    <path d="M70 246q46 -70 93 0q46 -70 93 0q46 -70 94 0" fill="none" stroke="#c99b5a" stroke-width="2.4" stroke-dasharray="3 7" stroke-linecap="round" opacity="${k > 0 ? .8 : 0}"/>${at(x, y, 1.25, A.jerboa())}`;
}
function day() {
  const n = sc.night, o = sc.out, sky = A.mix('#fde7b0', '#27365e', n), sand = A.mix('#f1d9a0', '#8f8a9c', n * .7), under = A.mix('#c9a36a', '#6d5f63', n * .7);
  let stars = '';
  if (n > .5) [[40, 30], [96, 62], [150, 24], [210, 50], [262, 22], [318, 40], [386, 26], [352, 84]].forEach(([x, y]) => { stars += `<circle cx="${x}" cy="${y}" r="1.8" fill="#fff" opacity="${(n - .5) * 2}"/>`; });
  return `<rect width="420" height="280" fill="${sky}"/>${stars}
    <g opacity="${1 - n}">${at(70, 46 + n * 60, 1, A.sun(24))}</g><g opacity="${n}">${at(74, 50, 1, A.moon(20, sky))}</g>
    <path d="M0 142C70 136 140 140 200 136C240 132 262 70 314 66C360 64 386 120 420 128V280H0Z" fill="${sand}"/>
    <path d="M0 172C80 166 150 170 214 166C280 162 360 166 420 162V280H0Z" fill="${under}"/>
    <path d="M62 162C72 186 100 198 126 212" fill="none" stroke="#7a5a3a" stroke-width="20" stroke-linecap="round"/><ellipse cx="170" cy="230" rx="68" ry="34" fill="#7a5a3a"/>
    <path d="M62 162C72 186 100 198 126 212" fill="none" stroke="#5d452c" stroke-width="13" stroke-linecap="round"/><ellipse cx="170" cy="230" rx="61" ry="28" fill="#5d452c"/>
    <g fill="#b98f5c" opacity=".6"><circle cx="290" cy="196" r="3.4"/><circle cx="340" cy="236" r="4.4"/><circle cx="378" cy="186" r="3.4"/><circle cx="30" cy="232" r="4.4"/><circle cx="268" cy="258" r="3.4"/></g>
    <g opacity="${1 - o}">${at(146, 252, .52, A.jerboa())}${at(196, 254, .36, A.fox())}</g>
    <g opacity="${o}">${at(150, 152, .5, A.fox())}${at(236, 150 - Math.abs(Math.sin(o * Math.PI * 2)) * 22, .7, A.jerboa())}</g>`;
}
const render = () => ({ yard, two, fennec, jerboa, day })[sc.mode]();

const g = G4Game({ ch: 'g4c1', logo: '🦊', title: ['Habitat Explorer', 'مستكشف المَواطن'], sub: ['Chapter 1 · Nature in Our Surroundings', 'الفصل ١ · الطبيعة من حولنا'],
  bg: 'science/assets/bg_g4c1.svg', bgc: '#f6e7c4', label: ['The place Reesho is exploring', 'المكان الذي يستكشفه ريشو'], render });
const kw = g.kw;
document.getElementById('tray').dir = 'ltr';   // the Nile is on the left of the picture and the desert on the right, so the two buttons keep that order in Arabic too

/* ---------- Stage 1 · Warm Up: where are the living organisms? ---------- */
const YARD = [
  { id: 'grass', name: T('In the grass', 'بين الحشائش'), ring: ring(74, 150, 58, 46) },
  { id: 'stone', name: T('Under the stone', 'أسفل الحجر'), ring: ring(204, 184, 52, 22) },
  { id: 'rock', name: T('On the sunny rock', 'فوق الصخرة المشمسة'), ring: ring(334, 132, 66, 56) },
  { id: 'sand', name: T('In the middle of the hot sand', 'وسط الرمال الساخنة'), ring: ring(204, 248, 120, 22) }
];
async function stage1() {
  sc.mode = 'yard'; sc.found = {}; sc.lift = 0; g.paint();
  g.say(T(`Living organisms live in ${kw('places that fit them')}. Let’s find three of them in this hot, dry place!`, P(`الكائنات الحية تعيش في ${kw('أماكن تناسبها')}. يلّا ندوّر على ثلاثة منها في المكان الحار الجاف ده!`)), 'point');
  await g.next();
  g.say(T(`First, the <b>grasshopper</b>. Tap the place where a grasshopper is often found.`, P(`الأول: <b>الجراد</b>. اضغط على المكان اللي بيعيش فيه الجراد غالبًا.`, `الأول: <b>الجراد</b>. اضغطي على المكان اللي بيعيش فيه الجراد غالبًا.`)), 'think');
  await g.spot(YARD, 'grass', { reveal: () => { sc.found.grass = true; g.paint(); },
    hint: T('Think: where does it find food, and where is it easy to hide?', P('فكّر: فين يلاقي الغذاء؟ وفين يسهل عليه الاختباء؟', 'فكّري: فين يلاقي الغذاء؟ وفين يسهل عليه الاختباء؟')),
    ok: T(`Grasshoppers are often in the ${kw('grass')}. Near grass or trees there are places with <b>food</b>, or places easy to <b>hide</b>.`, `يعيش الجراد غالبًا في ${kw('العشب')}. بالقرب من الحشائش أو الأشجار أماكن يتوافر فيها <b>الغذاء</b>، أو يسهل <b>الاختباء</b> فيها.`) });
  g.say(T(`Now the <b>pill bug</b>. It likes damp places. Tap where you would look for it.`, P(`دلوقتي <b>قمل الخشب</b>. بيعيش في الأماكن الرطبة. اضغط على المكان اللي تدوّر عليه فيه.`, `دلوقتي <b>قمل الخشب</b>. بيعيش في الأماكن الرطبة. اضغطي على المكان اللي تدوّري عليه فيه.`)), 'think');
  await g.spot(YARD, 'stone', { reveal: () => { sc.found.stone = true; g.tween(700, k => { sc.lift = k; }); },
    hint: T('A damp place is a place with water, away from the sun.', 'المكان الرطب يتوافر فيه الماء، وبعيد عن أشعة الشمس.'),
    ok: T(`Pill bugs are often in ${kw('damp')} places like under stones. Under stones there are places with <b>dampness (water)</b>, or cool places away from the sun.`, `يعيش قمل الخشب غالبًا في أماكن ${kw('رطبة')} أسفل الأحجار. أسفل الأحجار أماكن <b>رطبة (يتوافر فيها الماء)</b>، أو أماكن باردة بعيدة عن أشعة الشمس.`) });
  g.say(T(`Last one: the <b>lizard</b>. Tap the place where lizards are sometimes seen.`, P(`آخر واحد: <b>السحلية</b>. اضغط على المكان اللي بنشوف فيه السحالي أحيانًا.`, `آخر واحد: <b>السحلية</b>. اضغطي على المكان اللي بنشوف فيه السحالي أحيانًا.`)), 'think');
  await g.spot(YARD, 'rock', { reveal: () => { sc.found.rock = true; g.paint(); },
    hint: T('Lizards like a warm place in the sun.', 'السحالي بتحب مكان دافي في الشمس.'),
    ok: T(`Lizards are sometimes seen on sunny ${kw('rocks')}. So the kinds of living organisms you find are different depending on the location.`, `تُشاهد السحالي أحيانًا على ${kw('الصخور')} الساخنة. لذلك تختلف أنواع الكائنات الحية التي تجدها باختلاف المكان.`) });
  g.say(T('It is a hot, dry day. Where is it <b>hardest</b> to find living organisms?', 'اليوم حار وجاف. فين <b>يصعب</b> العثور على الكائنات الحية؟'), 'think');
  await g.choice({
    options: [T('Right in the middle of the hot sand in the sun', 'في وسط الرمال الساخنة تحت أشعة الشمس'), T('Cool places in the shadow of rocks or big stones', 'في الأماكن الباردة في ظلال الصخور أو الأحجار الكبيرة'), T('At the roots where a little bit of grass grows', 'عند الجذور؛ حيث ينمو قليل من العشب')],
    correct: T('Right in the middle of the hot sand in the sun', 'في وسط الرمال الساخنة تحت أشعة الشمس'),
    hint: T('Where is there no shade, no water and no food?', 'فين المكان اللي مفيهوش ظل ولا ماء ولا غذاء؟'),
    ok: T(`Even in hot and dry places like deserts, living organisms can live in the ${kw('shade of rocks')} or ${kw('under the ground')}.`, `حتى في الأماكن الحارة والجافة مثل الصحاري، تستطيع الكائنات الحية العيش في ${kw('ظلال الصخور')} أو ${kw('تحت سطح الأرض')}.`) });
}

/* ---------- Stage 2 · Missions ---------- */
async function mission1() {
  await g.banner(T('Mission 1', 'المهمة ١'), T('Two habitats', 'موطنان مختلفان'));
  sc.mode = 'two'; sc.placed = []; sc.card = null; sc.hi = null; g.paint();
  g.say(T(`The place where a living organism lives is called its ${kw('habitat')}. Along the Nile River there is <b>plenty of water</b> and <b>moist soil</b>. In the desert there is <b>very little water</b> and <b>dry soil</b>.`, `المكان الذي يعيش فيه الكائن الحي يُسمَّى ${kw('الموطن')}. على ضفاف نهر النيل <b>مياه وفيرة وتربة رطبة</b>، وفي الصحراء <b>مياه قليلة جدًّا وتربة جافة</b>.`), 'point');
  await g.next(T('Sort them ▸', P('صنّفهم ◂', 'صنّفيهم ◂')));
  const buttons = [{ label: '🌊 ' + SIDE.nile, value: 'nile' }, { label: '🏜️ ' + SIDE.desert, value: 'desert' }];
  for (const id of g.shuffle(Object.keys(ORG))) {
    const o = ORG[id]; sc.card = id; g.paint();
    g.say(T(`Where does the <b>${o.name}</b> live?`, `فين يعيش <b>${o.name}</b>؟`), 'think');
    const told = T(`The <b>${o.name}</b> lives ${o.side === 'nile' ? 'along the Nile River: plenty of water and moist soil' : 'in the desert: very little water and dry soil'}.`, `<b>${o.name}</b> يعيش ${o.side === 'nile' ? 'على ضفاف نهر النيل: مياه وفيرة وتربة رطبة' : 'في الصحراء: مياه قليلة جدًّا وتربة جافة'}.`);
    await g.pick({ buttons, correct: o.side, ok: T(`Yes! ${told}`, `صح! ${told}`), no: told, reveal: () => { sc.card = null; sc.placed.push(id); g.paint(); } });
  }
  g.setTray(null);
  g.say(T('The <b>acacia</b> lives in the desert. What helps a desert plant keep water?', 'يعيش <b>السنط</b> في الصحراء. ما الذي يساعد نبات الصحراء على الاحتفاظ بالماء؟'), 'think');
  await g.choice({
    options: [T('Small leaves, and roots that grow deep underground', 'أوراق صغيرة، وجذور تنمو عميقًا تحت الأرض'), T('Very big leaves, and roots that grow deep underground', 'أوراق كبيرة جدًّا، وجذور تنمو عميقًا تحت الأرض'), T('Small leaves, and roots that grow shallowly', 'أوراق صغيرة، وجذور تنمو قريبًا من سطح الأرض')],
    correct: T('Small leaves, and roots that grow deep underground', 'أوراق صغيرة، وجذور تنمو عميقًا تحت الأرض'),
    hint: T('Big leaves lose more water. And where is the water in the desert?', 'الأوراق الكبيرة تفقد ماء أكثر. وفين الماء في الصحراء؟'),
    ok: T(`Desert plants (like the acacia) have ${kw('small leaves')} so they don’t lose water, and their roots grow ${kw('deep')} underground.`, `نباتات الصحراء مثل السنط لها ${kw('أوراق صغيرة')}؛ لتقليل فقد الماء، وجذورها تنمو ${kw('عميقًا')} تحت الأرض للوصول إلى الماء.`) });
}
const FOX = [
  { id: 'ears', name: T('The ears', 'الأذنان'), ring: ring(210, 89, 78, 46) },
  { id: 'feet', name: T('The feet', 'القدمان'), ring: ring(210, 248, 44, 16) },
  { id: 'tail', name: T('The tail', 'الذيل'), ring: ring(292, 206, 30, 36) }
];
const DAY = [
  { id: 'dune', name: T('On top of the dune, in the sun', 'فوق الكثيب الرملي في الشمس'), ring: ring(314, 92, 58, 28) },
  { id: 'sand', name: T('On the open sand', 'على الرمال المكشوفة'), ring: ring(150, 154, 56, 13) },
  { id: 'hole', name: T('In the hole under the ground', 'في الجُحر تحت الأرض'), ring: ring(170, 230, 74, 40) }
];
async function mission2() {
  await g.banner(T('Mission 2', 'المهمة ٢'), T('Desert secrets', 'أسرار حيوانات الصحراء'));
  sc.mode = 'fennec'; g.paint();
  g.say(T(`This is the <b>fennec fox</b>. Its body has clever shapes for the hot desert. Tap the part that lets ${kw('body heat')} escape to the outside.`, P(`ده <b>ثعلب الفنك</b>. جسمه فيه خصائص تساعده على العيش في الصحراء الحارة. اضغط على الجزء اللي يساعد على ${kw('خروج الحرارة')} الزائدة من الجسم.`, `ده <b>ثعلب الفنك</b>. جسمه فيه خصائص تساعده على العيش في الصحراء الحارة. اضغطي على الجزء اللي يساعد على ${kw('خروج الحرارة')} الزائدة من الجسم.`)), 'point');
  await g.spot(FOX, 'ears', {
    hint: T('It is the biggest part of its head!', 'ده أكبر جزء في رأسه!'),
    ok: T(`Its big ${kw('ears')} let body heat escape to the outside and keep the body cool.`, `${kw('الأذنان الكبيرتان')} تساعدان على تبريد الجسم عن طريق خروج الحرارة الزائدة.`) });
  g.say(T('Now tap the part that is covered with <b>thick fur</b>, so it does not get burned on hot sand.', P('دلوقتي اضغط على الجزء المُغطَّى <b>بفرو كثيف</b> لحمايته من حرارة الرمال الساخنة.', 'دلوقتي اضغطي على الجزء المُغطَّى <b>بفرو كثيف</b> لحمايته من حرارة الرمال الساخنة.')), 'think');
  await g.spot(FOX, 'feet', {
    hint: T('Which part touches the hot sand when it walks?', 'أي جزء بيلمس الرمال الساخنة وهو ماشي؟'),
    ok: T(`The soles of its ${kw('feet')} are covered with thick fur, so they do not get burned when walking on hot sand.`, `باطن ${kw('القدمين')} مُغطَّى بفرو كثيف؛ لحماية قدميه من حرارة الرمال الساخنة عند المشي عليها.`) });
  sc.mode = 'jerboa'; sc.hop = 0; g.paint();
  g.say(T('And this is the <b>jerboa</b>. Watch how it moves!', P('وده <b>اليربوع</b>. شوف بيتحرك إزاي!', 'وده <b>اليربوع</b>. شوفي بيتحرك إزاي!')), 'point');
  await g.tween(2200, k => { sc.hop = k; });
  g.say(T('The jerboa has long back legs and jumps like a kangaroo. How does this help it in the desert?', 'لليربوع أرجل خلفية طويلة، ويقفز مثل الكنغر. إزاي ده بيساعده في الصحراء؟'), 'think');
  await g.choice({
    options: [T('It moves quickly, so it touches the hot ground for a short time', 'يتحرك بسرعة؛ مما يقلل وقت ملامسته للأرض الساخنة'), T('It can fly over the dunes', 'يطير فوق الكثبان الرملية'), T('It stays on the hot ground for a long time', 'يبقى على الأرض الساخنة وقتًا طويلًا')],
    correct: T('It moves quickly, so it touches the hot ground for a short time', 'يتحرك بسرعة؛ مما يقلل وقت ملامسته للأرض الساخنة'),
    hint: T('The ground is very hot. Does it want to touch it for long?', 'الأرض ساخنة جدًّا. هل يحب يلمسها كتير؟'),
    ok: T(`Long ${kw('back legs')}: it jumps like a kangaroo to move quickly. This keeps the time it touches the hot ground short.`, `${kw('أرجل خلفية')} طويلة: يقفز مثل الكنغر للتحرك بسرعة؛ مما يقلل وقت ملامسته للأرض الساخنة.`) });
  sc.mode = 'day'; sc.night = 0; sc.out = 0; g.paint();
  g.say(T('It is daytime in the desert. The sunlight is strong and it is very hot. Tap where many animals spend the day.', P('الوقت نهار في الصحراء. أشعة الشمس قوية والجو شديد الحرارة. اضغط على المكان اللي بتقضي فيه حيوانات كتير النهار.', 'الوقت نهار في الصحراء. أشعة الشمس قوية والجو شديد الحرارة. اضغطي على المكان اللي بتقضي فيه حيوانات كتير النهار.')), 'think');
  await g.spot(DAY, 'hole', {
    hint: T('Look for a cool place away from the sun.', P('دوّر على مكان بارد بعيد عن أشعة الشمس.', 'دوّري على مكان بارد بعيد عن أشعة الشمس.')),
    ok: T(`During the day, they spend time in cool ${kw('holes')} under the ground.`, `خلال النهار تختبئ في ${kw('جحور')} باردة تحت الأرض.`) });
  g.say(T('Let’s wait for the night…', 'يلّا نستنى الليل…'), 'point');
  await g.next(T('Wait for the night 🌙', P('استنى الليل 🌙', 'استني الليل 🌙')));
  await g.tween(1800, k => { sc.night = k; });
  await g.tween(1200, k => { sc.out = k; });
  g.say(T(`Many animals are active at ${kw('night')}, when the temperature goes down. What do we call changing body parts or behaviors to survive in a place?`, `تنشط العديد من الحيوانات ${kw('ليلًا')} عندما تنخفض درجة الحرارة. ماذا يُسمَّى تغيُّر أجزاء الجسم أو السلوك الذي يساعد الكائن الحي على البقاء في مكانٍ ما؟`), 'think');
  await g.choice({
    options: [T('Adaptation', 'التكيف'), T('Habitat', 'الموطن'), T('Classifying', 'التصنيف')], correct: T('Adaptation', 'التكيف'),
    hint: T('The habitat is the place itself. This word is about the change.', 'الموطن هو المكان نفسه. الكلمة المطلوبة عن التغيُّر.'),
    ok: T(`Changing body parts or behaviors to survive in a place is called ${kw('adaptation')}. The shape of the body hides a “reason” for living in that place!`, `تغيُّر في أجزاء الجسم أو السلوك يساعد الكائن الحي على البقاء في مكانٍ ما يُسمَّى ${kw('التكيف')}. وراء كل شكل من أشكال الجسم سببٌ يساعد الكائن الحي على العيش في بيئته!`) });
}
async function stage2() { await mission1(); await mission2(); }

/* ---------- Stage 3 · Speed Round: Nile River or desert? ---------- */
const N = T('Along the Nile River there is plenty of water, and the soil is moist.', 'على ضفاف نهر النيل مياه وفيرة، وتربة رطبة.'), D = T('In the desert there is very little water, and the soil is dry.', 'في الصحراء مياه قليلة جدًّا، وتربة جافة.');
const SPEED = [
  { t: T('Plenty of water', 'مياه وفيرة'), ans: 'nile', why: N }, { t: T('Moist soil', 'تربة رطبة'), ans: 'nile', why: N },
  { t: T('Very little water', 'مياه قليلة جدًّا'), ans: 'desert', why: D }, { t: T('Dry soil', 'تربة جافة'), ans: 'desert', why: D },
  { t: T('Frog', 'الضفدع'), ans: 'nile', why: N, pic: at(60, 76, 1.25, A.frog()) }, { t: T('Lotus', 'اللوتس'), ans: 'nile', why: N, pic: at(60, 70, 1.15, A.lotus()) },
  { t: T('Water bird', 'الطائر المائي'), ans: 'nile', why: N, pic: at(56, 86, .78, A.waterBird()) }, { t: T('Bee', 'النحل'), ans: 'nile', why: N, pic: at(62, 50, 1.6, A.bee()) },
  { t: T('Orange tree', 'البرتقال'), ans: 'nile', why: N, pic: at(60, 86, .8, A.orangeTree()) },
  { t: T('Fennec fox', 'ثعلب الفنك'), ans: 'desert', why: D, pic: at(54, 88, .64, A.fox()) }, { t: T('Jerboa', 'اليربوع'), ans: 'desert', why: D, pic: at(64, 84, .95, A.jerboa()) },
  { t: T('Acacia', 'السنط'), ans: 'desert', why: D, pic: at(60, 86, .78, A.acacia()) }, { t: T('Colocynth', 'الحنظل'), ans: 'desert', why: D, pic: at(70, 76, 1.4, A.colocynth()) },
  { t: T('Lizard', 'السحلية'), ans: 'desert', why: D, pic: at(62, 60, .95, A.lizard()) }
];
async function stage3() {
  sc.mode = 'two'; sc.card = null; sc.hi = null; sc.placed = Object.keys(ORG); g.paint();
  const nile = SPEED.filter(s => s.ans === 'nile'), des = SPEED.filter(s => s.ans === 'desert');
  await g.speedRound({
    items: g.shuffle(nile).slice(0, 4).concat(g.shuffle(des).slice(0, 4)), rounds: 8,
    buttons: [{ label: '🌊 ' + SIDE.nile, value: 'nile' }, { label: '🏜️ ' + SIDE.desert, value: 'desert' }],
    ask: T('Nile River or desert?', 'ضفاف نهر النيل أم الصحراء؟'),
    intro: T('Speed Round! I will show you a living organism or a fact. Is it <b>along the Nile River</b> or in the <b>desert</b>? Press the right button before time runs out. 8 rounds!', P('جولة السرعة! هعرض عليك كائن حي أو معلومة. هل ده على <b>ضفاف نهر النيل</b> ولا في <b>الصحراء</b>؟ اضغط على الزرار الصح قبل ما الوقت يخلص. ٨ جولات!', 'جولة السرعة! هعرض عليكي كائن حي أو معلومة. هل ده على <b>ضفاف نهر النيل</b> ولا في <b>الصحراء</b>؟ اضغطي على الزرار الصح قبل ما الوقت يخلص. ٨ جولات!')),
    think: T('Think of the water and the soil!', P('افتكر الماء والتربة!', 'افتكري الماء والتربة!')),
    show: () => { sc.hi = null; g.paint(); }, reveal: it => { sc.hi = it.ans; g.paint(); }
  });
}

g.run({
  intro: T(`Hi, <b>${g.name()}</b>! Let’s explore nature together. First we look for living organisms and the places that fit them. Then we visit two habitats: the <b>Nile River</b> and the <b>desert</b>.`, P(`أهلًا يا <b>${g.name()}</b>! يلّا نستكشف الطبيعة سوا. الأول هندوّر على الكائنات الحية والأماكن اللي تناسبها. وبعدين نزور موطنين: <b>ضفاف نهر النيل</b> و<b>الصحراء</b>.`)),
  stages: [{ name: T('Warm Up', 'التسخين'), fn: stage1 }, { name: T('Missions', 'المهمات'), fn: stage2 }, { name: T('Speed Round', 'جولة السرعة'), fn: stage3 }],
  done: { title: T('Explorer badge!', P('بقيت مستكشف شاطر!', 'بقيتي مستكشفة شاطرة!')),
    text: T('Living organisms live in places that fit them. The place where a living organism lives is its <b>habitat</b>, and changing body parts or behaviors to survive there is <b>adaptation</b>.', 'تعيش الكائنات الحية في أماكن تناسبها. المكان الذي يعيش فيه الكائن الحي هو <b>الموطن</b>، وتغيُّر أجزاء الجسم أو السلوك الذي يساعده على البقاء فيه هو <b>التكيف</b>.') }
}).catch(err => console.error(err));
window.__habitat = { sc, render };
})();
</script>
