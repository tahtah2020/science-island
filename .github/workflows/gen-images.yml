name: Generate images
# Runs only on the `images` branch, never on main (main = live site).
on:
  push:
    branches: [images]
    paths: ['imagegen/jobs/**', 'imagegen/gen.py', '.github/workflows/gen-images.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gen-images
  cancel-in-progress: false

jobs:
  gen:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests pillow
      - name: Generate
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_AI_TOKEN: ${{ secrets.CF_AI_TOKEN }}
        run: python imagegen/gen.py
      - name: Commit pictures
        if: always()
        run: |
          git config user.name "image-bot"
          git config user.email "image-bot@users.noreply.github.com"
          git add imagegen/out || true
          if git diff --cached --quiet; then echo "nothing new"; exit 0; fi
          git commit -m "Generated pictures [skip ci]"
          git pull --rebase origin images
          git push origin HEAD:images
