<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Seed Lab · Conditions for Germination</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
:root{
  --navy:#1f3d57; --ink:#3a5c75; --card:rgba(255,250,240,.94);
  --primary:#23799f; --primary-d:#1b6182; --mint:#bfe8d6; --mint-d:#8fd3b8;
  --coral:#e2603f; --ok:#2e9e6b; --ok-bg:#d4f4e1; --bad-bg:#fde0d8;
  --radius:22px;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;min-height:100%}
body{
  font-family:"Nunito",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color:var(--navy);
  background:linear-gradient(rgba(255,255,255,.42),rgba(255,255,255,.42)),url(science/assets/bg_ch3.svg) center/cover fixed #e3f3d0;
  -webkit-tap-highlight-color:transparent;overflow-x:hidden;
}
.app{max-width:1120px;margin:0 auto;padding:12px 14px 24px;display:flex;flex-direction:column;gap:12px}

/* top bar */
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px}
.logo{width:40px;height:40px;border-radius:14px;background:linear-gradient(135deg,#ffe9a8,#9fdcc4);display:grid;place-items:center;box-shadow:0 4px 12px rgba(31,61,87,.18);font-size:21px}
.brand h1{margin:0;font-size:22px;font-weight:900;letter-spacing:.2px}
.brand p{margin:0;font-size:13px;font-weight:700;color:var(--ink)}
.hud{display:flex;align-items:center;gap:8px}
.pill{background:var(--card);border-radius:999px;padding:8px 14px;font-weight:800;font-size:14px;box-shadow:0 3px 10px rgba(31,61,87,.12);position:relative;white-space:nowrap}
.pill b{font-size:18px}
.pill.pop{animation:pop .4s}
.icon{width:40px;height:40px;border-radius:50%;border:0;background:var(--card);color:var(--navy);font-size:18px;font-weight:900;cursor:pointer;box-shadow:0 3px 10px rgba(31,61,87,.12)}
.icon[aria-pressed="true"]{opacity:.55;text-decoration:line-through}
.float{position:absolute;right:10px;top:-6px;color:var(--ok);font-weight:900;animation:rise 1s forwards;pointer-events:none}

/* layout */
.grid{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,.85fr);gap:14px;align-items:start}
.card{background:var(--card);border-radius:var(--radius);box-shadow:0 8px 28px rgba(31,61,87,.14);padding:14px}
.stageCard svg{display:block;width:100%;height:auto;max-height:62vh;touch-action:none;margin:0 auto;border-radius:16px;
  background:linear-gradient(#eaf7fc,#f6fbf4)}
.stageCard svg:focus-visible{outline:3px solid var(--primary);outline-offset:2px}

/* meters + controls */
.meters{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.meter .mhead{display:flex;justify-content:space-between;gap:6px;font-size:13px;font-weight:800;margin-bottom:4px}
.meter small{font-weight:700;color:var(--ink)}
.track{height:12px;border-radius:99px;background:#dbe9f0;overflow:hidden}
.track i{display:block;height:100%;width:0;border-radius:99px;transition:width .05s linear}
.controls{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}

/* buttons */
.btn{font:inherit;font-weight:900;font-size:18px;border:0;border-radius:16px;padding:12px 18px;min-height:52px;cursor:pointer;
  background:var(--mint);color:var(--navy);box-shadow:0 4px 0 var(--mint-d);transition:transform .08s}
.btn:active{transform:translateY(2px);box-shadow:0 2px 0 var(--mint-d)}
.btn.primary{background:var(--primary);color:#fff;box-shadow:0 4px 0 var(--primary-d)}
.btn.big{font-size:22px;padding:14px 34px}
.btn:disabled{opacity:.5;cursor:default}
.btn:focus-visible{outline:3px solid #f7b267;outline-offset:2px}
.btn.choice{background:#fff;border:3px solid #cfe3ee;box-shadow:none;text-align:left;font-size:17px}
.btn.choice.good{background:var(--ok-bg);border-color:var(--ok)}
.btn.choice.bad{background:var(--bad-bg);border-color:var(--coral)}

/* coach */
.coachRow{display:flex;align-items:flex-end;gap:10px}
#robot{height:150px;width:auto;flex:none;transform-origin:50% 100%}
#robot.hop{animation:hop .5s}
.bubble{position:relative;background:#fff;border:3px solid #cfe3ee;border-radius:20px;padding:12px 14px;font-weight:700;font-size:17px;line-height:1.4;flex:1;min-height:92px}
.bubble::before{content:"";position:absolute;left:-12px;bottom:26px;width:18px;height:18px;background:#fff;border-left:3px solid #cfe3ee;border-bottom:3px solid #cfe3ee;transform:rotate(45deg)}
html[dir=rtl] .bubble::before{left:auto;right:-12px;border-left:0;border-bottom:0;border-right:3px solid #cfe3ee;border-top:3px solid #cfe3ee}
.kw{color:#c2410c;background:#fff0d9;border-radius:6px;padding:0 4px}
.actions{margin-top:12px;display:flex;flex-direction:column;gap:10px}
.choices{display:grid;gap:10px}
.dots{display:flex;gap:8px;justify-content:center}
.dots i{width:16px;height:16px;border-radius:50%;background:#dbe9f0}
.dots i.on{background:var(--ok)}
.timer{height:14px;border-radius:99px;background:#dbe9f0;margin-top:12px;overflow:hidden}
.timer i{display:block;height:100%;width:100%;background:var(--primary);border-radius:99px}
.timer i.low{background:var(--coral)}

/* overlays */
.overlay{position:fixed;inset:0;z-index:30;display:grid;place-items:center;padding:16px;background:rgba(143,211,238,.45);backdrop-filter:blur(4px)}
.panel{background:#fff8ea;border-radius:28px;padding:22px 26px;max-width:460px;width:100%;text-align:center;box-shadow:0 14px 40px rgba(31,61,87,.25)}
.panel h2{margin:6px 0 4px;font-size:34px;font-weight:900}
.panel p{margin:6px 0 14px;font-weight:700;font-size:17px;line-height:1.45}
.hero{height:170px;width:auto}
.stats{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin:8px 0 16px}
.stats span{background:#fff;border-radius:999px;padding:6px 14px;font-weight:800;font-size:15px}
.stars{font-size:46px;letter-spacing:6px;color:#f2b134;line-height:1}
.stars .off{color:#e3d9c4}
.banner{position:fixed;inset:0;z-index:40;display:grid;place-items:center;background:rgba(143,211,238,.4);backdrop-filter:blur(3px);animation:fade .25s;pointer-events:none}
.banner.out{opacity:0;transition:opacity .3s}
.banner div{background:#fff8ea;border-radius:28px;padding:20px 44px;text-align:center;box-shadow:0 14px 40px rgba(31,61,87,.25)}
.banner small{display:block;font-weight:800;color:var(--ink);font-size:16px;letter-spacing:1px;text-transform:uppercase}
.banner strong{font-size:36px;font-weight:900}
.confetti{position:fixed;top:-14px;width:9px;height:14px;border-radius:2px;z-index:50;pointer-events:none;animation:fall 2.1s ease-in forwards}

@keyframes pop{50%{transform:scale(1.15)}}
@keyframes rise{to{transform:translateY(-26px);opacity:0}}
@keyframes hop{0%{transform:translateY(0) scale(1,1)}35%{transform:translateY(-14px) scale(.97,1.04)}70%{transform:translateY(0) scale(1.04,.96)}100%{transform:none}}
@keyframes pulse{50%{stroke:#23799f;stroke-width:4}}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
@keyframes fade{from{opacity:0}}
@keyframes fall{to{transform:translate(var(--dx),105vh) rotate(540deg)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

@media (max-width:820px){
  .grid{grid-template-columns:1fr}
  .coach{order:-1}
  #robot{height:104px}
  .bubble{font-size:16px;min-height:84px}
  .stageCard svg{max-height:52vh}
  .brand p{display:none}
}

/* touch screens: a fixed background is unreliable on phones and tablets */
@media (hover:none){body{background-attachment:scroll}}

@media (max-width:820px){
  .app{padding:8px 12px 18px;gap:8px}
  .top{gap:6px}
  .logo{width:34px;height:34px}
  .brand h1{font-size:19px}
  .hud{gap:6px;flex-wrap:wrap}
  .pill{padding:6px 11px;font-size:13px}
  .pill b{font-size:16px}
  .icon{width:36px;height:36px;font-size:16px}
  #stagePill .long{display:none}
  .card{padding:10px}
  #robot{height:70px}
  .bubble{font-size:15px;min-height:0;padding:9px 12px}
  .bubble::before{bottom:18px}
  .stageCard svg{max-height:42vh}
  .meters{gap:8px;margin-top:8px}
  .meter .mhead{flex-direction:column;gap:0;font-size:12.5px}
  .controls{margin-top:8px}
  .btn{min-height:48px;font-size:17px;padding:10px 14px}
  .choices{gap:8px}
}
@media (max-height:520px) and (orientation:landscape){
  .app{padding:6px 12px 12px;gap:6px}
  .brand p{display:none}
  .grid{grid-template-columns:minmax(0,1.25fr) minmax(0,.75fr);gap:10px}
  .coach{order:0}
  .coachRow{align-items:flex-start}
  #robot{height:62px}
  .bubble{font-size:14px;min-height:0;padding:8px 10px}
  .stageCard svg{max-height:56vh}
  .meters{margin-top:4px}
  .meter .mhead{font-size:11px}
  .controls{margin-top:6px}
  .btn{min-height:40px;font-size:15px;padding:7px 12px}
  .panel{padding:14px 18px}
  .hero{height:90px}
  .panel h2{font-size:24px}
}

/* phones: fit the visible screen (svh excludes the browser bars) and keep the buttons above the meters */
@media (max-width:820px){
  .stageCard{display:flex;flex-direction:column}
  .stageCard svg{max-height:max(190px, calc(100vh - 400px));max-height:max(190px, calc(100svh - 400px))}
  .controls{order:2;margin-top:8px}
  .meters{order:3;margin-top:8px}
  .bubble{font-size:14.5px}
}
/* pop-ups always fit the visible screen (iPhone bars included): the panel scrolls inside itself
   and its buttons stay pinned at the bottom, so they can always be reached */
.overlay{display:flex;align-items:center;justify-content:center;overscroll-behavior:contain;
  padding:max(12px,env(safe-area-inset-top)) max(12px,env(safe-area-inset-right)) max(12px,env(safe-area-inset-bottom)) max(12px,env(safe-area-inset-left))}
.panel{max-height:100%;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.panel .btn{display:inline-flex;align-items:center;justify-content:center;text-decoration:none}
.panel .acts{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;position:sticky;bottom:-22px;z-index:1;
  margin:0 -26px -22px;padding:14px 26px 22px;background:linear-gradient(rgba(255,248,234,0),#fff8ea 12px)}
.banner div{max-width:calc(100% - 24px)}
@media (max-width:520px){
  .panel{padding:16px;border-radius:24px}
  .banner div{padding:16px 22px}
  .banner strong{font-size:28px}
  .panel .acts{bottom:-16px;margin:0 -16px -16px;padding:12px 16px 16px;gap:8px}
  .panel .acts .btn{flex:1 1 40%}
  .panel .btn{min-height:46px;font-size:16px;padding:9px 12px}
  .panel .btn.big{font-size:19px;padding:10px 18px}
  .panel h2{font-size:26px;margin:4px 0 2px}
  .panel p{font-size:15.5px;margin:4px 0 10px}
  .hero{height:clamp(84px,19vh,150px);height:clamp(84px,19svh,150px)}
  .stars{font-size:38px}
  .stats{gap:6px;margin:6px 0 10px}
  .stats span{font-size:13.5px;padding:5px 11px}
  .box{font-size:76px}
}
@media (max-width:360px){ .panel .btn{font-size:15px;padding:9px 8px} }
@media (max-height:520px) and (orientation:landscape){
  .panel{max-width:620px;padding:12px 18px}
  .panel .acts{bottom:-12px;margin:0 -18px -12px;padding:10px 18px 12px}
  .panel .acts .btn{flex:0 1 auto}
  .hero{height:64px}
  .stars{font-size:30px}
  .stats{margin:4px 0 8px}
  .panel p{font-size:15px;margin:4px 0 8px}
}

/* ---------- Seed Lab ---------- */
.sceneBox{position:relative}
.stageCard svg#scene{touch-action:auto}
.shake{animation:shake .4s}
.hot{cursor:pointer}
.hot .ring{fill:rgba(255,255,255,.2);stroke:#1b6182;stroke-width:3;stroke-dasharray:7 6}
.hot:hover .ring,.hot:focus .ring{fill:rgba(35,121,159,.28)}
.hot:focus{outline:none}
.hot.good .ring{fill:rgba(46,158,107,.34);stroke:var(--ok);stroke-dasharray:none}
.hot.bad .ring{fill:rgba(226,96,63,.3);stroke:var(--coral);stroke-dasharray:none}
/* the two cups side by side: cup A is fixed, the player sets cup B */
.lab{display:grid;grid-template-columns:auto minmax(0,1fr) minmax(0,1fr);gap:6px 8px;align-items:center;margin-top:10px}
.lab .lh{font-size:13px;font-weight:900;color:var(--ink);text-align:center;text-transform:uppercase;letter-spacing:.4px}
.lab .lk{font-size:14.5px;font-weight:900;white-space:nowrap}
.lab .lv{font:inherit;font-weight:900;font-size:15.5px;min-height:42px;border-radius:13px;padding:6px 8px;display:flex;align-items:center;justify-content:center;gap:6px;text-align:center;line-height:1.15;border:3px solid #dbe9f0;background:#f3f8fb;color:var(--navy)}
.lab .lv.a{color:var(--ink)}
.lab button.lv{cursor:pointer;background:#fff;border-color:var(--primary);box-shadow:0 3px 0 var(--primary-d)}
.lab button.lv:active{transform:translateY(2px);box-shadow:0 1px 0 var(--primary-d)}
.lab button.lv:disabled{cursor:default;box-shadow:none;border-color:#dbe9f0;opacity:1}
.lab .lv.diff{background:#fff0d9;border-color:#f2a13c;color:#9a4a00}
.lab button.lv.diff{box-shadow:0 3px 0 #d98a2b}
.lab button.lv.diff:disabled{box-shadow:none}
.lab button.lv:focus-visible{outline:3px solid #f7b267;outline-offset:2px}
.lab .run{grid-column:1/-1;margin-top:4px}
.lab .note{grid-column:1/-1;font-size:13px;font-weight:800;color:var(--ink);text-align:center}
.btn.yn{font-size:17px;min-height:60px;display:flex;align-items:center;justify-content:center;gap:8px;line-height:1.25}
.btn.yn.yes{background:#cdeec9;box-shadow:0 4px 0 #94cf8d}
.btn.yn.no{background:#fbd9cf;box-shadow:0 4px 0 #eaa794}
.veil{position:absolute;inset:0;display:grid;place-items:center;padding:12px;background:rgba(255,248,234,.92);border-radius:16px}
.veilCard{text-align:center;display:flex;flex-direction:column;gap:8px;max-width:520px}
.veilCard small{font-weight:900;color:var(--ink);font-size:13px}
.veilCard strong{font-size:clamp(19px,4.2vw,28px);font-weight:900;line-height:1.35}
.veilCard span{font-weight:800;color:#b45309;font-size:15px}
@media (max-width:820px){
  .lab{order:2;margin-top:8px;gap:5px 6px}
  .lab .lk{font-size:13px}
  .lab .lv{font-size:14px;min-height:38px;padding:4px 6px}
  .btn.yn{font-size:15px;min-height:56px;padding:8px 8px}
  .stageCard svg#scene{max-height:max(180px, calc(100vh - 420px));max-height:max(180px, calc(100svh - 420px))}
  .stageCard.labOn svg#scene{max-height:max(205px, calc(100vh - 470px));max-height:max(205px, calc(100svh - 470px))}
}
@media (max-height:520px) and (orientation:landscape){
  .stageCard svg#scene{max-height:max(150px, calc(100vh - 150px));max-height:max(150px, calc(100svh - 150px))}
  .stageCard.labOn{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px;align-items:center}
  .stageCard.labOn .lab{margin-top:0}
  .lab .lv{min-height:32px;font-size:13px}
  .btn.yn{min-height:44px;font-size:14px}
}

<script>
(() => {
'use strict';
/* Seed Lab · Chapter 3's game.
   Stage 1 (Warm Up): open a kidney bean (soak, peel, split), find the embryo and the cotyledon, test for starch with iodine.
   Stage 2 (Missions): three experiments. Cup A has water, air and warmth. The player sets cup B and may change ONE condition only.
   Stage 3 (Speed Round): will it germinate?
   Every T('English', 'عربي') has both languages. The Arabic science sentences follow the Arabic school book (pages 28-42):
   the cups are (أ) and (ب), and in Arabic cup (أ) is drawn on the right, as in the book. */
const $ = (s, r = document) => r.querySelector(s);
const el = id => document.getElementById(id);
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const lerp = (a, b, t) => a + (b - a) * t;
const sleep = ms => new Promise(r => setTimeout(r, ms));
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
const T = SI.T, G = SI.G, AR = SI.isAr(), A = window.CH3ART;
if (AR) document.title = 'معمل البذور · شروط الإنبات';

/* ---------- the scene: everything is drawn from this one state ---------- */
const FULL = { water: true, air: true, warm: true };
const sc = {
  mode: 'seed',
  night: 0, soak: 0, coat: 1, split: false, open: 0, stain: 0, germ: false, drop: -1, dropX: 247, dropY: 112,   // Stage 1: soak 0 = dry on the dish, 1 = in the glass, 2 = soaked, back on the dish
  a: Object.assign({}, FULL), b: Object.assign({}, FULL), gA: 0, gB: 0, day: 0,                                 // Stage 2: the two cups
  one: Object.assign({}, FULL), gOne: 0                                                                        // Stage 3: one cup
};
const f1 = n => (Math.round(n * 10) / 10);
function render() {
  let s = A.labBack({ night: sc.night });
  if (sc.mode === 'seed') {
    const skin = k => `<g transform="translate(${f1(lerp(214, 312, k))} ${f1(lerp(186, 206, k))}) scale(.8)" opacity="${f1(clamp(k * 3, 0, 1))}">${A.coatSkin()}</g>`;
    s += `<g transform="translate(60 226)">${A.glass(sc.soak === 1)}</g><g transform="translate(372 226)">${A.iodineBottle()}</g><g transform="translate(214 212)">${A.dish(100)}</g>`;
    if (sc.germ) s += `<g transform="translate(212 178)">${A.halfGerminated({ stain: sc.stain })}</g>`;
    else if (sc.split) s += skin(1) + `<g transform="translate(214 166)">${A.beanSplit({ open: sc.open, stain: sc.stain })}</g>`;
    else if (sc.soak !== 1) s += (sc.coat < 1 ? skin(1 - sc.coat) : '') + `<g transform="translate(214 186) scale(${sc.soak === 2 ? 1.08 : 1})">${A.beanWhole(sc.coat, sc.soak === 2 ? 1 : 0)}</g>`;
    if (sc.drop > -1) s += `<g transform="translate(${sc.dropX} ${sc.dropY})">${A.dropper(sc.drop)}</g>`;
  } else if (sc.mode === 'lab') {

function tween(ms, fn) {
  if (reduceMotion || ms <= 0) { fn(1); render(); return Promise.resolve(); }
  return new Promise(res => {
    const t0 = performance.now();
    const step = now => { const k = clamp((now - t0) / ms, 0, 1); fn(k * k * (3 - 2 * k)); render(); if (k < 1) requestAnimationFrame(step); else res(); };
    requestAnimationFrame(step);
  });
}

/* multiple choice */
function askChoice({ options, correct, hint, ok, count = true, points = 20 }) {
  return new Promise(res => {
    actions.innerHTML = '';
    const wrap = mk('div', 'choices'); let tries = 0, done = false;
    const bs = shuffle(options.map(o => ({ o, right: o === correct }))).map(({ o, right }) => {
      const b = btn(o, 'choice');
      b.onclick = () => {
        if (done) return;
        tries++;
        if (right) { done = true; b.classList.add('good'); sfx.ok(); if (points) addScore(tries === 1 ? points : 5); say(ok, 'thumbs'); finish(); }
        else {
          b.classList.add('bad'); b.disabled = true; sfx.bad(); if (count) mistakes++;
          if (tries >= 2 || options.length <= 2) { done = true; bs.forEach(x => { if (x.dataset.right) x.classList.add('good'); }); say(T(`The answer is <b>${correct}</b>. ${ok}`, `الإجابة هي <b>${correct}</b>. ${ok}`), 'think'); finish(); }
          else say(hint, 'sad');

      };
      if (right) b.dataset.right = '1';
      wrap.appendChild(b); return b;
    });
    actions.appendChild(wrap);
    function finish() { bs.forEach(b => b.disabled = true); setTimeout(() => nextBtn().then(res), 500); }
  });
}

function askSpot(correct, { ok, hint, points = 20 }) {
  return new Promise(res => {
    const box = el('gSpots'); let tries = 0, done = false;
    box.innerHTML = SPOTS.map(s => `<g class="hot" data-id="${s.id}" role="button" tabindex="0" aria-label="${s.name}">${s.ring}</g>`).join('');

  const ga = A.germinates(sc.a), gb = A.germinates(sc.b);
  await tween(3400, k => { sc.day = Math.max(1, Math.ceil(k * 5)); sc.gA = ga ? k : 0; sc.gB = gb ? k : 0; });
}
async function mission(n, key, text) {

      hint: T(`We want the <b>light</b> to be the same for both cups, and the temperature to stay different. Try again!`, G(`عايزين <b>الإضاءة</b> تبقى متشابهة في الكوبين، ودرجة الحرارة تفضل مختلفة. جرّب تاني!`, `عايزين <b>الإضاءة</b> تبقى متشابهة في الكوبين، ودرجة الحرارة تفضل مختلفة. جرّبي تاني!`)),

      hint: T(`Think about what the seeds in cup A still need. Try again!`, G(`فكّر: البذور في الكوب (أ) لسه محتاجة إيه؟ جرّب تاني!`, `فكّري: البذور في الكوب (أ) لسه محتاجة إيه؟ جرّبي تاني!`)),

    hint: T(`Look at the two cups again. Which one has green sprouts? Try again!`, G(`بص على الكوبين تاني. أنهي كوب فيه نبتات خضراء؟ جرّب تاني!`, `بصي على الكوبين تاني. أنهي كوب فيه نبتات خضراء؟ جرّبي تاني!`)), ok: text.ok });

async function stage2() {

  await mission(2, 'air', {
    ask: T(`Do seeds need ${kw('air')} to germinate?`, `هل تحتاج البذور إلى ${kw('الهواء')} لكي تنبت؟`), same: T(`In cup B the seeds are completely submerged in water, so they are not exposed to air. Water and temperature are the same.`, `في الكوب (ب) البذور مغمورة تمامًا في الماء، بحيث لا تتعرَّض للهواء. أما الماء ودرجة الحرارة فكما هما.`),
    a: T('Cup A: exposed to air', 'الكوب (أ): معرَّض للهواء'), b: T('Cup B: under water', 'الكوب (ب): مغمور في الماء'),

  await mission(3, 'warm', {

    a: T('Cup A: in the warm place', 'الكوب (أ): في المكان الدافئ'), b: T('Cup B: in the refrigerator', 'الكوب (ب): في الثلاجة'),
    ok: T(`The seeds in the refrigerator did not germinate, because the temperature was too low. Seeds need an ${kw('appropriate temperature')}. And cup A sprouted in the dark: light is not needed for germination!`, `البذور في الثلاجة لم تنبت لأن درجة الحرارة كانت منخفضة جدًّا. البذور تحتاج إلى ${kw('درجة حرارة مناسبة')} لكي تنبت. والبذور في الكوب (أ) نبتت في الظلام: يعني الضوء ليس ضروريًّا للإنبات!`) });
  sfx.win(); confetti();
  say(T(`You found the <b>3 conditions</b> necessary for germination: ${kw('water')}, ${kw('air')} and an ${kw('appropriate temperature')}. If even one of them is missing, the seeds will not germinate.`, G(`اكتشفت <b>الشروط الثلاثة</b> الضرورية لإنبات البذور: ${kw('الماء')}، و${kw('الهواء')}، و${kw('درجة حرارة مناسبة')}. إذا فُقد أحد هذه الشروط فلن تنبت البذور.`, `اكتشفتي <b>الشروط الثلاثة</b> الضرورية لإنبات البذور: ${kw('الماء')}، و${kw('الهواء')}، و${kw('درجة حرارة مناسبة')}. إذا فُقد أحد هذه الشروط فلن تنبت البذور.`)), 'celebrate');
  await nextBtn(T('Go to Stage 3 ▸', 'على المرحلة ٣ ◂'));
}

/* ---------- Stage 3: will it germinate? ---------- */
const SETUPS = [
  { t: T('Moist cotton, in a warm room', 'قطن مبلل، في غرفة دافئة'), c: {}, why: T('It has water, air and an appropriate temperature: all three conditions.', 'يتوفر لها الماء والهواء ودرجة حرارة مناسبة: الشروط الثلاثة كلها.') },
  { t: T('Moist cotton, in a warm room, inside a dark box', 'قطن مبلل، في غرفة دافئة، داخل صندوق مظلم'), c: { dark: true }, why: T('It has all three conditions. Sunlight is not needed for germination.', 'تتوفر لها الشروط الثلاثة. ضوء الشمس ليس ضروريًّا للإنبات.') },
  { t: T('Moist cotton, in a warm room, with no fertilizer', 'قطن مبلل، في غرفة دافئة، بدون سماد'), c: {}, why: T('It has all three conditions. Fertilizer is not needed for germination.', 'تتوفر لها الشروط الثلاثة. السماد ليس ضروريًّا للإنبات.') },
  { t: T('Moist cotton, on a warm sunny window', 'قطن مبلل، على نافذة دافئة مشمسة'), c: {}, why: T('It has water, air and an appropriate temperature.', 'يتوفر لها الماء والهواء ودرجة حرارة مناسبة.') },
  { t: T('Dry cotton, in a warm room', 'قطن جاف، في غرفة دافئة'), c: { water: false }, why: T('There is no water.', 'لا يوجد ماء.') },
  { t: T('Seeds completely under water, in a warm room', 'بذور مغمورة تمامًا في الماء، في غرفة دافئة'), c: { air: false }, why: T('The seeds are not exposed to air.', 'البذور لا تتعرَّض للهواء.') },
  { t: T('Moist cotton, in the refrigerator', 'قطن مبلل، في الثلاجة'), c: { warm: false }, why: T('The temperature is too low.', 'درجة الحرارة منخفضة جدًّا.') },
  { t: T('Dry cotton, on a warm sunny window', 'قطن جاف، على نافذة دافئة مشمسة'), c: { water: false }, why: T('There is no water. Sunlight does not help a seed to germinate.', 'لا يوجد ماء. وضوء الشمس ليس من شروط الإنبات.') },
  { t: T('Seeds under water, with fertilizer added', 'بذور مغمورة في الماء، مع إضافة سماد'), c: { air: false }, why: T('The seeds are not exposed to air. Fertilizer does not help a seed to germinate.', 'البذور لا تتعرَّض للهواء. والسماد ليس من شروط الإنبات.') },
  { t: T('Dry cotton, in the refrigerator', 'قطن جاف، في الثلاجة'), c: { water: false, warm: false }, why: T('Two conditions are missing: water and an appropriate temperature.', 'شرطان مفقودان: الماء ودرجة الحرارة المناسبة.') }
];
function timedPick(ms) {
  return new Promise(res => {
    const timer = $('#timer'), bar = timer.firstElementChild; timer.hidden = false; bar.style.width = '100%'; bar.classList.remove('low');
    const t0 = performance.now(); let done = false;
    const yes = el('btnYes'), no = el('btnNo'); yes.disabled = no.disabled = false;
    const end = r => { if (done) return; done = true; clearInterval(iv); yes.onclick = no.onclick = null; yes.disabled = no.disabled = true; timer.hidden = true; res(r); };
    const iv = setInterval(() => {
      const left = 1 - (performance.now() - t0) / ms;
      bar.style.width = Math.max(0, left * 100) + '%'; bar.classList.toggle('low', left < .3);
      if (left <= 0) end({ pick: null, timeout: true, left: 0 });
    }, 50);
    const left = () => Math.max(0, 1 - (performance.now() - t0) / ms);
    yes.onclick = () => end({ pick: true, timeout: false, left: left() });
    no.onclick = () => end({ pick: false, timeout: false, left: left() });
  });
}
function veil(html) { const v = el('veil'); if (html == null) { v.hidden = true; return; } el('veilCard').innerHTML = html; v.hidden = false; }
async function stage3() {
  setStage(3, T('Speed Round', 'جولة السرعة'));
  await banner(T('Stage 3', 'المرحلة ٣'), T('Speed Round', 'جولة السرعة'));
  const ROUNDS = 8;
  sc.mode = 'one'; sc.one = Object.assign({}, FULL); sc.gOne = 0; setUI({ yesno: true }); render();
  el('btnYes').disabled = el('btnNo').disabled = true;
  say(T(`Speed Round! I will describe a cup of seeds. Will the seeds <b>germinate</b> or not? Press the right button before time runs out. ${ROUNDS} rounds!`, G(`جولة السرعة! هوصف لك كوب فيه بذور. هل البذور <b>تنبت</b> ولا لأ؟ اضغط على الزرار الصح قبل ما الوقت يخلص. ${ROUNDS} جولات!`, `جولة السرعة! هوصف لك كوب فيه بذور. هل البذور <b>تنبت</b> ولا لأ؟ اضغطي على الزرار الصح قبل ما الوقت يخلص. ${ROUNDS} جولات!`)), 'point');
  await nextBtn(T('Go! ▸', 'يلّا! ◂'));
  const yes = shuffle(SETUPS.filter(s => A.germinates(Object.assign({}, FULL, s.c)))).slice(0, 4), no = shuffle(SETUPS.filter(s => !A.germinates(Object.assign({}, FULL, s.c)))).slice(0, 4);
  const list = shuffle(yes.concat(no));
  let streak = 0;
  for (let i = 1; i <= ROUNDS; i++) {
    const S = list[i - 1], c = Object.assign({}, FULL, S.c), ans = A.germinates(c);
    sc.one = c; sc.gOne = 0; render();
    veil(`<small>${T(`Round ${i} of ${ROUNDS}`, `الجولة ${i} من ${ROUNDS}`)}</small><strong>${S.t}</strong><span>${T('Will these seeds germinate?', 'هل تنبت هذه البذور؟')}</span>`);
    say(T(`Think of the three conditions!`, G(`افتكر الشروط الثلاثة!`, `افتكري الشروط الثلاثة!`)), 'think');
    const r = await timedPick(12000);
    veil(null);
    if (ans) tween(900, k => { sc.gOne = k; });
    const verdict = ans ? T('The seeds <b>germinate</b>.', 'البذور <b>تنبت</b>.') : T('The seeds <b>do not germinate</b>.', 'البذور <b>لا تنبت</b>.');
    if (r.pick === ans) {
      streak++;
      addScore(10 + Math.round(r.left * 10) + (streak >= 3 ? 5 : 0)); sfx.ok();
      say(T(`Correct! ${streak >= 3 ? `<b class="kw">Streak ×${streak}</b> ` : ''}${verdict} ${S.why}`, `صح! ${streak >= 3 ? `<b class="kw">سلسلة ×${streak}</b> ` : ''}${verdict} ${S.why}`), 'thumbs');
    } else {
      streak = 0; mistakes++; sfx.bad();
      say(T(`${r.timeout ? 'Time’s up!' : 'Not quite.'} ${verdict} ${S.why}`, `${r.timeout ? 'الوقت خلص!' : G('قرّبت!', 'قرّبتي!')} ${verdict} ${S.why}`), 'sad');
    }
    await sleep(2600);
  }
}

function results() {
  const stars = mistakes <= 1 ? 3 : mistakes <= 4 ? 2 : 1;
  const prev = store.load();
  const best = Math.max(prev.best || 0, score);
  store.save({ ...prev, best, stars: Math.max(prev.stars || 0, stars), plays: (prev.plays || 0) + 1 });
  const gain = SI.addXP(score);
  sfx.win(); SI.voice('finish'); confetti(60);
  const o = mk('div', 'overlay');
  o.innerHTML = `<div class="panel">
    <img class="hero" src="assets/parrot_celebrate.png" alt="">
    <h2>${T('Seed Lab done!', G('خلّصت معمل البذور!', 'خلّصتي معمل البذور!'))}</h2>
    <div class="stars" aria-label="${T(`${stars} of 3 stars`, `${stars} من ٣ نجوم`)}">${'★'.repeat(stars)}<span class="off">${'★'.repeat(3 - stars)}</span></div>
    <div class="stats"><span>${T('Score', 'النقاط')}: ${score}</span><span>${T('Best', 'أعلى نتيجة')}: ${best}</span><span>+${gain.gained} XP · ${T('Level', 'المستوى')} ${gain.after.n}</span></div>
    <p>${T('The cotyledon is packed with <b>starch</b>, the nutrient for germination. Seeds germinate only with <b>water</b>, <b>air</b> and an <b>appropriate temperature</b>. If even one is missing, they will not germinate.', 'الفلقة غنية <b>بالنشا</b>، وهو الغذاء اللازم للإنبات. وتنبت البذور فقط عندما يتوفر لها <b>الماء</b> و<b>الهواء</b> و<b>درجة حرارة مناسبة</b>. إذا فُقد أحد هذه الشروط فلن تنبت البذور.')}</p>
    <div class="acts">
      <a class="btn primary" href="quiz.html#quest">${T('Chapter Quest ▸', 'تحدي الفصل ◂')}</a>
      <a class="btn" href="map.html">${T('Map', 'الخريطة')}</a>
      <button class="btn" id="again" type="button">${T('Play again', 'العب تاني')}</button>
    </div>
  </div>`;
  document.body.appendChild(o);
  SI.rate.guard(o, 'a[href="map.html"]', 'results');   // Reesho asks for a rating before the player leaves (once per chapter)
  $('#again', o).onclick = () => location.reload();
}

function intro() {
  return new Promise(res => {
    const s = store.load();
    const o = mk('div', 'overlay');
    o.innerHTML = `<div class="panel">
      <img class="hero" src="assets/parrot_wave.png" alt="">
      <h2>${T('Seed Lab', 'معمل البذور')}</h2>
      <p>${T(`Hi, <b>${SI.esc(SI.player().name)}</b>! Welcome to my lab. First we open a <b>seed</b> to see what is inside. Then we do three experiments to find out what seeds need to <b>germinate</b>.`, G(`أهلًا يا <b>${SI.esc(SI.player().name)}</b>! نوّرت معملي. الأول هنفتح <b>بذرة</b> ونشوف إيه الموجود جواها. وبعدين هنعمل ثلاث تجارب علشان نعرف البذور محتاجة إيه لكي <b>تنبت</b>.`, `أهلًا يا <b>${SI.esc(SI.player().name)}</b>! نوّرتي معملي. الأول هنفتح <b>بذرة</b> ونشوف إيه الموجود جواها. وبعدين هنعمل ثلاث تجارب علشان نعرف البذور محتاجة إيه لكي <b>تنبت</b>.`))}</p>
      ${s.best ? `<div class="stats"><span>${T('Best score', 'أعلى نتيجة')}: ${s.best}</span><span>${T('Stars', 'النجوم')}: ${'★'.repeat(s.stars || 0)}${'☆'.repeat(3 - (s.stars || 0))}</span></div>` : ''}
      <div class="acts"><button class="btn primary big" id="start" type="button">${T('Start', 'ابدأ')}</button></div>
    </div>`;
    document.body.appendChild(o);
    const b = $('#start', o); b.focus();
    b.onclick = () => { sfx.tick(); o.remove(); res(); };
  });
}

async function main() {
  if (!SI.requirePlayer() || !SI.requireChapter('ch3')) return;   // this game belongs to Chapter 3
  SI.applyTheme();
  setUI({}); render();
  say(T(`Hi! I’m Reesho the parrot.`, `أهلًا! أنا ريشو البغبغان.`), 'wave');
  const jump = +((/^#stage([23])$/.exec(location.hash) || [])[1] || 1);   // seedlab.html#stage2 or #stage3 jumps straight there (to check changes quickly)
  await intro();
  if (jump <= 1) await stage1();
  if (jump <= 2) await stage2();
  await stage3();
  results();
}
main().catch(err => console.error(err));

// small hook for automated tests
window.__seedlab = { sc, render, results, get mistakes() { return mistakes; }, get score() { return score; } };
})();
