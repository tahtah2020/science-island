<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,follow">
<title>Chapter Quest · Motafawek</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@700;800;900&family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#1f3d57; --ink:#3a5c75; --card:rgba(255,250,240,.95);
  --primary:#23799f; --primary-d:#1b6182; --mint:#bfe8d6; --mint-d:#8fd3b8;
  --coral:#e2603f; --ok:#2e9e6b; --ok-bg:#d4f4e1; --bad-bg:#fde0d8; --gold:#f2b134;
  --radius:22px;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;min-height:100%}
body{
  font-family:"Nunito",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--navy);
  background:linear-gradient(rgba(255,255,255,.35),rgba(255,255,255,.35)),url(assets/bg_park.jpg) center/cover fixed #d8f1f7;
  -webkit-tap-highlight-color:transparent;overflow-x:hidden;
}
.app{max-width:1080px;margin:0 auto;padding:12px 14px 28px;display:flex;flex-direction:column;gap:12px}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:inherit}
.logo{width:40px;height:40px;border-radius:14px;background:linear-gradient(135deg,#8fd3ee,#9fdcc4);display:grid;place-items:center;box-shadow:0 4px 12px rgba(31,61,87,.18);font-size:20px}
.brand h1{margin:0;font-size:22px;font-weight:900}
.brand p{margin:0;font-size:13px;font-weight:700;color:var(--ink)}
.hud{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.pill{background:var(--card);border-radius:999px;padding:8px 14px;font-weight:800;font-size:14px;box-shadow:0 3px 10px rgba(31,61,87,.12);position:relative;white-space:nowrap}
.pill b{font-size:18px}
.pill.pop{animation:pop .4s}
.icon{width:40px;height:40px;border-radius:50%;border:0;background:var(--card);color:var(--navy);font-size:18px;font-weight:900;cursor:pointer;box-shadow:0 3px 10px rgba(31,61,87,.12);display:grid;place-items:center;text-decoration:none}
.icon[aria-pressed="true"]{opacity:.55;text-decoration:line-through}
.float{position:absolute;right:10px;top:-6px;color:var(--ok);font-weight:900;animation:rise 1s forwards;pointer-events:none}

.grid{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,.65fr);gap:14px;align-items:start}
.card{background:var(--card);border-radius:var(--radius);box-shadow:0 8px 28px rgba(31,61,87,.14);padding:16px}

/* question card */
.qhead{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.badges{display:flex;gap:6px;flex-wrap:wrap}
.badge{font-size:12.5px;font-weight:900;letter-spacing:.3px;text-transform:uppercase;border-radius:999px;padding:4px 10px;background:#e3f1f7;color:var(--primary-d)}
.badge.timed{background:#fff0d9;color:#b45309}
.badge.boss{background:#3a2a5e;color:#ffe08a}
.badge.bonus{background:#fdf2c4;color:#8a6400}
.badge.lesson{background:#e4f3dc;color:#2d6a1f}
.progress{display:flex;gap:4px;flex-wrap:wrap}
.progress i{width:11px;height:11px;border-radius:50%;background:#dbe9f0}
.progress i.ok{background:var(--ok)}
.progress i.no{background:var(--coral)}
.progress i.now{background:var(--primary);box-shadow:0 0 0 3px #bfe3f2}
.qtext{font-size:23px;font-weight:800;line-height:1.35;margin:6px 0 14px}
.qtext .gap{display:inline-block;min-width:86px;border-bottom:4px solid var(--primary);text-align:center;color:var(--ok);padding:0 6px}
.story{background:#fff;border-left:6px solid #9fdcc4;border-radius:14px;padding:10px 14px}
.timer{height:14px;border-radius:99px;background:#dbe9f0;margin:0 0 12px;overflow:hidden;position:relative}
.timer i{display:block;height:100%;width:100%;background:var(--primary);border-radius:99px}
.timer i.low{background:var(--coral)}
.timer span{position:absolute;right:8px;top:-1px;font-size:11px;font-weight:900;color:#fff}

/* answers */
.choices{display:grid;gap:10px}
.choices.two{grid-template-columns:1fr 1fr}
.btn{font:inherit;font-weight:900;font-size:18px;border:0;border-radius:16px;padding:12px 18px;min-height:54px;cursor:pointer;
  background:var(--mint);color:var(--navy);box-shadow:0 4px 0 var(--mint-d);transition:transform .08s}
.btn:active{transform:translateY(2px);box-shadow:0 2px 0 var(--mint-d)}
.btn.primary{background:var(--primary);color:#fff;box-shadow:0 4px 0 var(--primary-d)}
.btn.big{font-size:22px;padding:14px 34px}
.btn:disabled{cursor:default}
.btn:focus-visible{outline:3px solid #f7b267;outline-offset:2px}
.opt{background:#fff;border:3px solid #cfe3ee;box-shadow:none;text-align:left;font-size:18px;display:flex;align-items:center;gap:10px}
.opt .k{flex:none;width:30px;height:30px;border-radius:9px;background:#e3f1f7;display:grid;place-items:center;font-size:15px}
.opt.good{background:var(--ok-bg);border-color:var(--ok)}
.opt.bad{background:var(--bad-bg);border-color:var(--coral)}
.opt.dim{opacity:.55}
.opt.sel{border-color:var(--primary);background:#eaf6fb}
.tf .opt{justify-content:center;font-size:22px}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cols .colhead{font-size:13px;font-weight:900;color:var(--ink);text-transform:uppercase;letter-spacing:.4px}
.opt .num{margin-left:auto;flex:none;min-width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-size:15px;color:#fff;background:transparent}
.tools{display:flex;gap:10px;margin-top:12px;flex-wrap:wrap}
.tools .btn:disabled{opacity:.45;box-shadow:none}
.diagramWrap{display:grid;place-items:center;background:linear-gradient(#eaf7fc,#f6fbf4);border-radius:18px;padding:8px}
.diagram{width:100%;height:auto;max-height:46vh;display:block}
.hot{cursor:pointer}
.hot .ring{fill:rgba(35,121,159,.08);stroke:#23799f;stroke-width:3;stroke-dasharray:7 6}
.hot:hover .ring,.hot:focus .ring{fill:rgba(35,121,159,.2)}
.hot:focus{outline:none}
.hot.sel .ring,.hot.sel .mus{stroke:#23799f;stroke-width:4}
.hot.good .ring{fill:rgba(46,158,107,.28);stroke:var(--ok);stroke-dasharray:none}
.hot.good .mus{fill:#7dd3a8;stroke:var(--ok)}
.hot.bad .ring{fill:rgba(226,96,63,.25);stroke:var(--coral);stroke-dasharray:none}
.hot.bad .mus{fill:#f4a58f;stroke:var(--coral)}
.hot:hover .mus,.hot:focus .mus{filter:brightness(1.08)}
.explain{margin-top:14px;border-radius:16px;padding:12px 14px;font-weight:700;font-size:17px;line-height:1.4}
.explain.ok{background:var(--ok-bg)}
.explain.no{background:var(--bad-bg)}
.why-btn{margin-top:10px;width:100%;font-weight:800;font-size:16px;padding:10px 14px;border-radius:14px;background:#fff6df;border:2px solid var(--gold,#f2b134);color:#1f3d57;cursor:pointer}
.why-btn:disabled{opacity:.7;cursor:default}
.why-play{display:block;margin-top:10px;font-weight:800;font-size:15px;padding:8px 14px;border-radius:12px;background:#fff;border:2px solid var(--gold,#f2b134);color:#1f3d57;cursor:pointer}
.why-play:disabled{opacity:.7;cursor:default}
.why-box{margin-top:10px;border-radius:16px;padding:12px 14px;background:#fff6df;border:2px solid var(--gold,#f2b134);font-size:16.5px;line-height:1.55}
.actions{margin-top:12px;display:flex;justify-content:flex-end}
.pvbar{display:flex;gap:8px;margin-bottom:12px}
.pvbar select{flex:1 1 0;width:0;min-width:0;text-overflow:ellipsis;font:inherit;font-weight:800;font-size:15px;border:3px solid #cfe3ee;border-radius:14px;padding:8px 10px;background:#fff;color:var(--navy)}
.pvbar .btn{min-height:46px;padding:8px 16px}

/* coach */
.coachRow{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center}
#robot{height:170px;width:auto;transform-origin:50% 100%}
#robot.hop{animation:hop .5s}
.bubble{position:relative;background:#fff;border:3px solid #cfe3ee;border-radius:20px;padding:12px 14px;font-weight:800;font-size:17px;line-height:1.4;width:100%;min-height:70px}
.bubble::before{content:"";position:absolute;left:50%;top:-12px;width:18px;height:18px;margin-left:-9px;background:#fff;border-left:3px solid #cfe3ee;border-top:3px solid #cfe3ee;transform:rotate(45deg)}
.streak{font-weight:900;color:#b45309}

/* overlays */
.overlay{position:fixed;inset:0;z-index:30;display:grid;place-items:center;padding:16px;background:rgba(143,211,238,.45);backdrop-filter:blur(4px)}
.panel{background:#fff8ea;border-radius:28px;padding:22px 26px;max-width:480px;width:100%;text-align:center;box-shadow:0 14px 40px rgba(31,61,87,.25)}
.panel h2{margin:6px 0 4px;font-size:32px;font-weight:900}
.panel p{margin:6px 0 14px;font-weight:700;font-size:17px;line-height:1.45}
.panel .row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.hero{height:160px;width:auto}
.stats{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin:8px 0 16px}
.stats span{background:#fff;border-radius:999px;padding:6px 14px;font-weight:800;font-size:15px}
.stars{font-size:46px;letter-spacing:6px;color:var(--gold);line-height:1}
.stars .off{color:#e3d9c4}
.banner{position:fixed;inset:0;z-index:40;display:grid;place-items:center;background:rgba(143,211,238,.4);backdrop-filter:blur(3px);animation:fade .25s;pointer-events:none}
.banner.out{opacity:0;transition:opacity .3s}
.banner div{background:#fff8ea;border-radius:28px;padding:20px 44px;text-align:center;box-shadow:0 14px 40px rgba(31,61,87,.25)}
.banner.boss div{background:#3a2a5e;color:#ffe08a}
.banner small{display:block;font-weight:800;font-size:16px;letter-spacing:1px;text-transform:uppercase;opacity:.8}
.banner strong{font-size:38px;font-weight:900}
.box{font-size:96px;line-height:1;cursor:pointer;background:none;border:0;animation:wobble 1s infinite}
.box:focus-visible{outline:3px solid #f7b267;border-radius:20px}
.prize{font-size:44px;font-weight:900;color:var(--ok);animation:pop .5s}
.confetti{position:fixed;top:-14px;width:9px;height:14px;border-radius:2px;z-index:50;pointer-events:none;animation:fall 2.1s ease-in forwards}

@keyframes pop{50%{transform:scale(1.18)}}
@keyframes rise{to{transform:translateY(-26px);opacity:0}}
@keyframes hop{0%{transform:none}35%{transform:translateY(-14px) scale(.97,1.04)}70%{transform:scale(1.04,.96)}100%{transform:none}}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
@keyframes fade{from{opacity:0}}
@keyframes wobble{0%,100%{transform:rotate(0)}25%{transform:rotate(-7deg)}75%{transform:rotate(7deg)}}
@keyframes fall{to{transform:translate(var(--dx),105vh) rotate(540deg)}}
.shake{animation:shake .4s}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

@media (max-width:820px){
  .grid{grid-template-columns:1fr}
  .coach{order:-1}
  .coachRow{flex-direction:row;text-align:left;align-items:flex-end}
  #robot{height:96px}
  .bubble{font-size:16px;min-height:64px}
  .bubble::before{left:-12px;top:auto;bottom:22px;margin:0;border-top:0;border-bottom:3px solid #cfe3ee}
  html[dir=rtl] .bubble::before{left:auto;right:-12px;border-left:0;border-bottom:0;border-right:3px solid #cfe3ee;border-top:3px solid #cfe3ee}
  .qtext{font-size:20px}
  .brand p{display:none}
  .cols{grid-template-columns:1fr}
}

/* touch screens: a fixed background is unreliable on phones and tablets */
@media (hover:none){body{background-attachment:scroll}}

@media (max-width:820px){
  .app{padding:8px 12px 18px;gap:8px}
  .top{gap:6px}
  .logo{width:34px;height:34px;font-size:17px}
  .brand h1{font-size:19px}
  .hud{gap:6px}
  .pill{padding:6px 11px;font-size:13px}
  .pill b{font-size:16px}
  .icon{width:36px;height:36px;font-size:16px}
  .card{padding:12px}
  #robot{height:64px}
  .bubble{font-size:15px;min-height:0;padding:9px 12px}
  .qtext{font-size:19px;margin:4px 0 10px}
  .opt{font-size:16px;min-height:48px;padding:10px 12px}
  .tf .opt{font-size:19px}
  .opt .k{width:26px;height:26px;font-size:13px}
  .diagram{max-height:40vh}
  .explain{font-size:15.5px;margin-top:10px}
}
@media (max-height:520px) and (orientation:landscape){
  .app{padding:6px 12px 12px;gap:6px}
  .brand p{display:none}
  .grid{grid-template-columns:minmax(0,1.5fr) minmax(0,.5fr);gap:10px}
  .coach{order:0}
  .coachRow{flex-direction:column;text-align:center;align-items:center}
  #robot{height:58px}
  .bubble{font-size:13.5px;min-height:0;padding:8px 10px}
  .bubble::before{display:none}
  .card{padding:10px}
  .qtext{font-size:17px;margin:2px 0 8px}
  .choices{gap:6px}
  .opt{font-size:15px;min-height:40px;padding:7px 10px}
  .diagram{max-height:56vh}
  .btn{min-height:42px}
  .panel{padding:14px 18px}
  .hero{height:90px}
  .panel h2{font-size:24px}
}

@media (max-width:820px){
  .diagram{max-height:max(180px, calc(100vh - 380px));max-height:max(180px, calc(100svh - 380px))}
}

.lvlbox{background:#fff;border-radius:16px;padding:10px 14px;margin:4px 0 10px;text-align:left}
.lvlrow{display:flex;justify-content:space-between;gap:8px;font-weight:900;font-size:15px;margin-bottom:6px}
.lvlrow span{color:#b7791f;flex:none;white-space:nowrap;direction:ltr;unicode-bidi:isolate}
.lvlbox small{display:block;margin-top:4px;font-weight:800;color:var(--ink);font-size:13px}
.xpbar{height:10px;border-radius:99px;background:#dbe9f0;overflow:hidden}
.xpbar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#f7c948,#f2994a)}
.rank{font-size:18px!important;margin:0 0 8px!important}

/* pop-ups always fit the visible screen (iPhone bars included): the panel scrolls inside itself
   and its buttons stay pinned at the bottom, so they can always be reached */
.overlay{display:flex;align-items:center;justify-content:center;overscroll-behavior:contain;
  padding:max(12px,env(safe-area-inset-top)) max(12px,env(safe-area-inset-right)) max(12px,env(safe-area-inset-bottom)) max(12px,env(safe-area-inset-left))}
.panel{max-height:100%;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.panel .btn{display:inline-flex;align-items:center;justify-content:center;text-decoration:none}
.panel .acts{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;position:sticky;bottom:-22px;z-index:1;
  margin:0 -26px -22px;padding:14px 26px 22px;background:linear-gradient(rgba(255,248,234,0),#fff8ea 12px)}
.banner div{max-width:calc(100% - 24px)}
@media (max-width:520px){
  .panel{padding:16px;border-radius:24px}
  .banner div{padding:16px 22px}
  .banner strong{font-size:28px}
  .panel .acts{bottom:-16px;margin:0 -16px -16px;padding:12px 16px 16px;gap:8px}
  .panel .acts .btn{flex:1 1 40%}
  .panel .btn{min-height:46px;font-size:16px;padding:9px 12px}
  .panel .btn.big{font-size:19px;padding:10px 18px}
  .panel h2{font-size:26px;margin:4px 0 2px}
  .panel p{font-size:15.5px;margin:4px 0 10px}
  .hero{height:clamp(84px,19vh,150px);height:clamp(84px,19svh,150px)}
  .stars{font-size:38px}
  .stats{gap:6px;margin:6px 0 10px}
  .stats span{font-size:13.5px;padding:5px 11px}
  .box{font-size:76px}
}
@media (max-width:360px){ .panel .btn{font-size:15px;padding:9px 8px} }
@media (max-height:520px) and (orientation:landscape){
  .panel{max-width:620px;padding:12px 18px}
  .panel .acts{bottom:-12px;margin:0 -18px -12px;padding:10px 18px 12px}
  .panel .acts .btn{flex:0 1 auto}
  .hero{height:64px}
  .stars{font-size:30px}
  .stats{margin:4px 0 8px}
  .panel p{font-size:15px;margin:4px 0 8px}
}
/* ---------- exam-style question types: choose all, table, build the answer, letter tiles ---------- */
.opt .num.tick{border:3px solid #cfe3ee;border-radius:9px;color:transparent;font-size:17px}
.opt.sel .num.tick{background:var(--primary)!important;border-color:var(--primary);color:#fff}
.helpline{font-size:13px;font-weight:900;color:var(--ink);text-transform:uppercase;letter-spacing:.4px;margin:0 0 8px}
html[dir=rtl] .helpline{text-transform:none;letter-spacing:0}
.poc{background:#fdf0cf;border-radius:12px;padding:6px 12px;font-weight:800;font-size:15px;margin-bottom:8px;display:inline-block}
.tbl{display:grid;gap:8px;grid-template-columns:repeat(var(--n,2),minmax(0,1fr))}
.tcol{font:inherit;color:inherit;text-align:inherit;padding:0;border:3px solid #e6cf96;border-radius:16px;background:#fff;min-height:112px;display:flex;flex-direction:column;cursor:pointer;overflow:hidden}
.tcol:focus-visible{outline:3px solid #f7b267;outline-offset:2px}
.tcol.ready{border-color:var(--primary);box-shadow:0 0 0 3px #bfe3f2}
.tcol .th{background:#fdf0cf;font-weight:900;font-size:16px;padding:8px 6px;text-align:center;line-height:1.2}
.tcol .drop{display:flex;flex-direction:column;gap:6px;padding:8px;flex:1}
.pool{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;min-height:52px;align-items:flex-start}
.tnow{background:#eaf6fb;border:3px dashed #9fc3d6;border-radius:16px;padding:8px 10px 6px;margin-bottom:8px;text-align:center}
.tnow .helpline{margin:0 0 6px;color:var(--primary-d)}
.tnow .slot1{display:flex;justify-content:center;min-height:50px}
.tnow .chipb{font-size:18px;text-align:center;border-color:var(--primary);background:#fff;box-shadow:0 4px 0 var(--primary-d);cursor:default;animation:pop .35s}
.tnow .tgo{font-size:14px;font-weight:900;color:var(--primary-d);margin-top:6px}
.tnow.done{background:var(--ok-bg);border-color:var(--ok)}
.tnow.done .slot1,.tnow.done .tgo{display:none}
.tnow.done .helpline{margin:4px 0;color:#1d6b49;text-transform:none;letter-spacing:0;font-size:14.5px}
.tcol.ready .drop:empty::before{content:"＋";display:grid;place-items:center;flex:1;min-height:44px;border:2px dashed #9fc3d6;border-radius:12px;color:#7d99ab;font-size:22px;font-weight:900}
.helpline.wait{margin:10px 0 0}
.helpline.wait + .pool{margin-top:6px;min-height:0}
.helpline.wait + .pool .chipb{font-size:14.5px;padding:6px 10px;min-height:38px;opacity:.8}
.chipb{font:inherit;font-weight:800;font-size:16px;line-height:1.25;color:var(--navy);background:#fff;border:3px solid #cfe3ee;border-radius:14px;padding:8px 12px;min-height:44px;cursor:pointer;text-align:start}
.chipb:focus-visible{outline:3px solid #f7b267;outline-offset:2px}
.chipb.sel{border-color:var(--primary);background:#eaf6fb;box-shadow:0 0 0 3px #bfe3f2}
.chipb.good{background:var(--ok-bg);border-color:var(--ok)}
.chipb.bad{background:var(--bad-bg);border-color:var(--coral)}
.chipb:disabled{cursor:default;color:var(--navy)}
.tcol .chipb{font-size:15px;padding:6px 9px;min-height:38px;width:100%}
.line{min-height:62px;border:3px dashed #9fc3d6;border-radius:16px;background:#fff;padding:8px;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.line:empty::before{content:attr(data-empty);color:#7d99ab;font-weight:800;font-size:15px;padding:0 6px}
.line.good{border-style:solid;border-color:var(--ok);background:var(--ok-bg)}
.line.bad{border-style:solid;border-color:var(--coral)}
.qtext u.wrong{text-decoration:underline;text-decoration-color:var(--coral);text-decoration-thickness:4px;text-underline-offset:5px}
.qtext u.fixed{text-decoration:none;color:var(--ok);background:var(--ok-bg);border-radius:8px;padding:0 6px}
.slots{display:flex;flex-wrap:wrap;gap:8px 18px;justify-content:center;margin:2px 0 12px}
.slots .word{display:flex;gap:4px}
.slot{font:inherit;font-weight:900;font-size:clamp(16px,4.4vw,24px);width:clamp(21px,6.3vw,40px);height:clamp(34px,9vw,48px);padding:0;border:0;border-bottom:4px solid var(--primary);border-radius:8px 8px 0 0;background:#eef7fb;color:var(--navy);cursor:pointer;display:grid;place-items:center;text-transform:uppercase}
.slots .word.long{gap:2px}
.slots .word.long .slot{width:clamp(18px,5.3vw,36px);font-size:clamp(15px,4vw,22px)}

<script>
(() => {
'use strict';
const $ = (s, r = document) => r.querySelector(s);

const lerp = (a, b, t) => a + (b - a) * t;
const sleep = ms => new Promise(r => setTimeout(r, ms));
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const mk = (tag, cls, html) => { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; };
const esc = SI.esc, T = SI.T, G = SI.G, AR = SI.isAr();

/* ---------- per-player review schedule (Leitner boxes), sound, mute ---------- */
const CH = SI.chapter() || {};                             // the chapter being played (questions come from CH.questions)
/* Arabic content shown to a player of the English-interface track (Studies: one Arabic book for both tracks): read right to left */
if (CH.id && SI.contentAr(CH) && !AR) ['qtext', 'area', 'explain'].forEach(id => { const e = document.getElementById(id); if (e) { e.setAttribute('dir', 'rtl'); e.setAttribute('lang', 'ar'); } });
const armSkin = (SI.chProf('ch1').game || {}).skin || 0;   // arm colour chosen in Arm Mechanic, used by the arm diagrams
const DAY = 864e5, INTERVALS = [0, 1, 3, 7, 14];
function recordCard(id, firstTry, chId) {

    p.cards = p.cards || {};

    if (firstTry) { c.box = Math.min(c.box + 1, 4); c.due = Date.now() + INTERVALS[c.box] * DAY; }
    else { c.box = 0; c.due = Date.now(); }               // wrong or needed help: back in today's review

}
function dueCards() {
  const cards = SI.chProf().cards || {}, now = Date.now();
  return Object.entries(cards).filter(([, c]) => c.due <= now).sort((a, b) => a[1].box - b[1].box || a[1].due - b[1].due).map(([id]) => id);
}
const sfx = SI.sfx;
const muteBtn = $('#mute');
const paintMute = () => { const m = SI.isMuted(); muteBtn.setAttribute('aria-pressed', m); muteBtn.setAttribute('aria-label', m ? T('Sound off', 'الصوت مغلق') : T('Sound on', 'الصوت شغال')); };

/* ---------- coach + fx ---------- */

function say(html, p) {

}
function confetti(n = 30) {

  const colors = ['#f08a6c', '#8fd3ee', '#9fdcc4', '#f7d58a', '#c7a7e0'];
  for (let i = 0; i < n; i++) {
    const c = mk('i', 'confetti'); c.style.left = Math.random() * 100 + 'vw'; c.style.background = colors[i % colors.length];
    c.style.animationDelay = Math.random() * .4 + 's'; c.style.setProperty('--dx', (Math.random() * 140 - 70) + 'px');
    document.body.appendChild(c); setTimeout(() => c.remove(), 2800);
  }
}
async function banner(a, b, cls = '') {
  const e = mk('div', 'banner ' + cls, `<div><small>${a}</small><strong>${b}</strong></div>`);
  document.body.appendChild(e); await sleep(reduceMotion ? 900 : 1500); e.classList.add('out'); await sleep(320); e.remove();
}
let score = 0;
function addScore(n) {
  if (!n) return;
  score += n; $('#score').textContent = score;
  const p = $('#scorePill'); p.classList.remove('pop'); void p.offsetWidth; p.classList.add('pop');
  const f = mk('span', 'float', '+' + n); p.appendChild(f); setTimeout(() => f.remove(), 1000);
}
function nextBtn(label = T('Next ▸', 'التالي ◂')) {
  return new Promise(res => {
    const a = $('#actions'); a.innerHTML = '';
    const b = mk('button', 'btn primary', label); b.type = 'button';
    b.onclick = () => { a.innerHTML = ''; sfx.tick(); res(); };
    a.appendChild(b); b.focus({ preventScroll: true });
    setTimeout(() => b.scrollIntoView({ block: 'nearest', behavior: reduceMotion ? 'auto' : 'smooth' }), 60);
  });
}

/* ---------- diagrams ---------- */
const f1 = n => n.toFixed(1);
function smooth(pts) {
  const n = pts.length, P = i => pts[((i % n) + n) % n];
  let d = `M${f1(pts[0][0])} ${f1(pts[0][1])}`;
  for (let i = 0; i < n; i++) {
    const p0 = P(i - 1), p1 = P(i), p2 = P(i + 1), p3 = P(i + 2);
    d += `C${f1(p1[0] + (p2[0] - p0[0]) / 6)} ${f1(p1[1] + (p2[1] - p0[1]) / 6)} ${f1(p2[0] - (p3[0] - p1[0]) / 6)} ${f1(p2[1] - (p3[1] - p1[1]) / 6)} ${f1(p2[0])} ${f1(p2[1])}`;
  }
  return d + 'Z';
}
function bez(A, B, bulge) {
  const dx = B.x - A.x, dy = B.y - A.y, L = Math.hypot(dx, dy) || 1, ux = dx / L, uy = dy / L, px = -uy, py = ux;
  const a1 = { x: A.x + ux * L * .3 + px * bulge, y: A.y + uy * L * .3 + py * bulge }, b1 = { x: B.x - ux * L * .3 + px * bulge, y: B.y - uy * L * .3 + py * bulge };
  return `C${f1(a1.x)} ${f1(a1.y)} ${f1(b1.x)} ${f1(b1.y)} ${f1(B.x)} ${f1(B.y)}`;
}
const spindle = (A, B, w) => `M${f1(A.x)} ${f1(A.y)} ${bez(A, B, 1.35 * w)} ${bez(B, A, 1.35 * w)}Z`;
const along = (A, B, k) => ({ x: lerp(A.x, B.x, k), y: lerp(A.y, B.y, k) });
const ARM = {
  upper: smooth([[190,50],[222,58],[238,84],[238,120],[236,160],[231,205],[226,245],[222,258],[190,264],[158,258],[154,245],[149,205],[144,160],[142,120],[142,84],[158,58]]),
  fore: smooth([[0,-14],[34,-4],[35,30],[31,70],[24,110],[19,135],[22,160],[22,186],[17,207],[5,215],[-10,213],[-22,200],[-26,178],[-24,150],[-18,132],[-23,110],[-30,70],[-34,30],[-32,-4]]),
  hum: smooth([[183,110],[184,160],[182,198],[172,224],[169,246],[176,266],[190,276],[204,266],[211,246],[208,224],[198,198],[196,160],[197,110],[190,103]]),
  scap: smooth([[156,86],[170,74],[194,74],[207,86],[207,106],[196,118],[176,126],[160,114],[154,100]]),
  ulna: smooth([[-26,-6],[-14,-22],[4,-14],[5,10],[3,60],[1,110],[4,127],[-4,136],[-11,127],[-10,100],[-12,50],[-17,18]]),
  rad: smooth([[10,16],[17,10],[25,16],[24,28],[19,40],[18,70],[21,112],[27,128],[20,137],[9,133],[8,100],[10,60],[9,30]])
};
const SKINS = [['#f6d6b0', '#d9a678'], ['#ebbd8f', '#c98f5c'], ['#c98d5f', '#9d6538'], ['#94603f', '#633f27']];
function armSVG(theta, kind, label) {
  const [sk, skd] = SKINS[armSkin] || SKINS[0];
  const th = theta * Math.PI / 180, d = { x: Math.sin(th), y: Math.cos(th) }, n = { x: Math.cos(th), y: -Math.sin(th) };
  const E = { x: 190, y: 256 }, L = (lx, ly) => ({ x: E.x + n.x * lx + d.x * ly, y: E.y + n.y * lx + d.y * ly });
  const A_IN = { x: 214, y: 90 }, A_OUT = { x: 172, y: 124 }, W = { x: 162, y: 252 };
  const Pin = L(16, 34), totIn = Math.hypot(Pin.x - A_IN.x, Pin.y - A_IN.y), Qin = along(A_IN, Pin, Math.max(60, totIn - 50) / totIn);
  const Pout = L(-22, 2), lo = Math.hypot(W.x - A_OUT.x, W.y - A_OUT.y), totOut = lo + Math.hypot(Pout.x - W.x, Pout.y - W.y);
  const Qout = along(A_OUT, W, clamp(totOut - 52, 60, lo - 6) / lo);
  const tf = `translate(190 256) rotate(${-theta})`;
  const tIn = `M${f1(Qin.x)} ${f1(Qin.y)}L${f1(Pin.x)} ${f1(Pin.y)}`, tOut = `M${f1(Qout.x)} ${f1(Qout.y)}Q${W.x} ${W.y} ${f1(Pout.x)} ${f1(Pout.y)}`;
  const vb = theta > 60 ? '112 36 336 286' : '96 36 190 450';
  const thumb = 'cx="28" cy="160" rx="8" ry="16" transform="rotate(-14 28 160)"';
  const bone = 'fill="#fff6df" stroke="#cdb98f" stroke-width="2.5" stroke-linejoin="round"';
  const skinD = `fill="${skd}" stroke="${skd}" stroke-width="7" stroke-linejoin="round"`;
  const mus = (A, B, id, name) => `<g class="hot" data-id="${id}" role="button" tabindex="0" aria-label="${name}">
      <path class="mus" d="${spindle(A, B, 12)}" fill="#e7a59b" stroke="#b9776d" stroke-width="3"/>

      <line x1="${f1(A.x)}" y1="${f1(A.y)}" x2="${f1(B.x)}" y2="${f1(B.y)}" stroke="transparent" stroke-width="44" stroke-linecap="round"/></g>`;
  const ring = (p, r, id, name) => `<g class="hot" data-id="${id}" role="button" tabindex="0" aria-label="${name}"><circle class="ring" cx="${f1(p.x)}" cy="${f1(p.y)}" r="${r}"/></g>`;
  return `<svg class="diagram" viewBox="${vb}" role="img" aria-label="${esc(label)}">
    <path d="${ARM.upper}" ${skinD}/><circle cx="190" cy="256" r="36" ${skinD}/>
    <g transform="${tf}"><path d="${ARM.fore}" ${skinD}/><ellipse ${thumb} ${skinD}/></g>
    <path d="${ARM.upper}" fill="${sk}"/><circle cx="190" cy="256" r="36" fill="${sk}"/>
    <g transform="${tf}"><path d="${ARM.fore}" fill="${sk}"/><ellipse ${thumb} fill="${sk}"/>
      <path d="M-12 197L-12 211M-1 199L-1 214M10 198L10 211" stroke="${skd}" stroke-width="2.4" stroke-linecap="round" fill="none"/></g>
    <path d="${ARM.scap}" ${bone}/>
    <g transform="${tf}"><path d="${ARM.ulna}" ${bone}/><path d="${ARM.rad}" ${bone}/></g>
    <path d="${ARM.hum}" ${bone}/><circle cx="192" cy="101" r="17" ${bone}/>
    <circle cx="190" cy="256" r="21" fill="none" stroke="#6fb3cf" stroke-width="7"/><circle cx="190" cy="256" r="21" fill="none" stroke="#c3e8f4" stroke-width="3.6"/>
    ${kind !== 'muscles' ? '' : `<g fill="none" stroke-linecap="round"><path d="${tOut}" stroke="#bfa465" stroke-width="9"/><path d="${tOut}" stroke="#fbf0cf" stroke-width="5.5"/>
      <path d="${tIn}" stroke="#bfa465" stroke-width="9"/><path d="${tIn}" stroke="#fbf0cf" stroke-width="5.5"/></g>`}
    ${kind === 'muscles' ? mus(A_OUT, Qout, 'out', T('Outer muscle', 'العضلة الخلفية')) + mus(A_IN, Qin, 'in', T('Inner muscle', 'العضلة الأمامية'))
      : ring({ x: 192, y: 100 }, 27, 'shoulder', T('Shoulder joint', 'مفصل الكتف')) + ring(E, 29, 'elbow', T('Elbow joint', 'مفصل الكوع')) + ring(L(0, 138), 22, 'wrist', T('Wrist joint', 'مفصل المعصم'))}
  </svg>`;
}
function skeletonSVG() {
  const b = 'fill="#fff6df" stroke="#b9a47a" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"';
  const bs = 'fill="none" stroke="#b9a47a" stroke-width="9" stroke-linecap="round"', bf = 'fill="none" stroke="#fff6df" stroke-width="5" stroke-linecap="round"';
  const limb = (pts) => `<polyline points="${pts}" ${bs}/><polyline points="${pts}" ${bf}/>`;
  let ribs = '';
  for (let i = 0; i < 6; i++) {
    const y = 92 + i * 12, w = 34 - Math.abs(i - 2) * 2.2;
    ['-1', '1'].forEach(s => {
      const k = +s, x1 = 100 + k * 7, x2 = 100 + k * w;

      ribs += `<path d="${dd}" fill="none" stroke="#b9a47a" stroke-width="7" stroke-linecap="round"/><path d="${dd}" fill="none" stroke="#fff6df" stroke-width="3.6" stroke-linecap="round"/>`;
    });
  }
  let spine = '';
  for (let i = 0; i < 15; i++) spine += `<rect x="94" y="${70 + i * 9}" width="12" height="7" rx="3" ${b}/>`;
  return `<svg class="diagram" viewBox="0 0 200 340" role="img" aria-label="${T('A skeleton', 'هيكل عظمي')}">
    ${limb('66,80 54,146 48,206')} ${limb('134,80 146,146 152,206')}
    <ellipse cx="46" cy="220" rx="8" ry="12" ${b}/><ellipse cx="154" cy="220" rx="8" ry="12" ${b}/>
    ${limb('86,228 82,284 84,328')} ${limb('114,228 118,284 116,328')}
    <circle cx="82" cy="284" r="6" ${b}/><circle cx="118" cy="284" r="6" ${b}/>
    <ellipse cx="80" cy="334" rx="11" ry="5" ${b}/><ellipse cx="120" cy="334" rx="11" ry="5" ${b}/>
    <path d="M100 76 L66 80 M100 76 L134 80" ${bs}/><path d="M100 76 L66 80 M100 76 L134 80" ${bf}/>
    <g class="hot" data-id="ribs" role="button" tabindex="0" aria-label="${T('Ribs', 'الضلوع')}">
      <ellipse class="ring" cx="100" cy="122" rx="46" ry="42"/>${ribs}
      <rect x="96" y="86" width="8" height="52" rx="4" ${b}/></g>
    <path d="M70 206 Q100 196 130 206 Q134 226 116 236 Q100 226 84 236 Q66 226 70 206Z" ${b}/>
    <g class="hot" data-id="backbone" role="button" tabindex="0" aria-label="${T('Backbone', 'العمود الفقري')}">
      <rect class="ring" x="86" y="62" width="28" height="150" rx="12"/>${spine}</g>
    <g class="hot" data-id="skull" role="button" tabindex="0" aria-label="${T('Skull', 'الجمجمة')}">
      <circle class="ring" cx="100" cy="36" r="34"/>
      <path d="M100 8 C122 8 128 26 126 40 C125 50 118 56 114 58 L113 66 L87 66 L86 58 C82 56 75 50 74 40 C72 26 78 8 100 8Z" ${b}/>
      <ellipse cx="90" cy="38" rx="7" ry="8" fill="#5b4a35"/><ellipse cx="110" cy="38" rx="7" ry="8" fill="#5b4a35"/>
      <path d="M100 46 L96 53 L104 53Z" fill="#5b4a35"/>
      <path d="M90 60 V65 M97 60 V65 M103 60 V65 M110 60 V65" stroke="#b9a47a" stroke-width="1.6"/></g>
  </svg>`;
}
const DIAGRAMS = {

function startTimer(sec, onEnd) {
  const t = $('#timer'), bar = t.firstElementChild, lab = t.lastElementChild;
  t.hidden = false; bar.style.width = '100%'; bar.classList.remove('low');
  const t0 = performance.now(); let lastSec = sec, done = false;
  const iv = setInterval(() => {
    const left = 1 - (performance.now() - t0) / (sec * 1000);
    bar.style.width = Math.max(0, left * 100) + '%'; bar.classList.toggle('low', left < .3);
    const s = Math.ceil(Math.max(0, left) * sec); lab.textContent = s + T('s', ' ث');
    if (s < lastSec && s <= 3 && s > 0) sfx.beep(); lastSec = s;
    if (left <= 0) stop(true);
  }, 50);
  function stop(timeout) {
    if (done) return 0; done = true; clearInterval(iv);
    const left = Math.max(0, 1 - (performance.now() - t0) / (sec * 1000));
    if (timeout) onEnd();
    return left;
  }
  timerStop = () => stop(false);
  return stop;
}

/* each renderer resolves {firstTry, correct, timeout} */
/* "the scientific term" is a choice (owner, Oct 2026): the right term + 3 wrong ones.
   Wrong ones: the idea's own `choices` list if written, else other terms of the same chapter (same lesson first), then other short answers. */
function termOpts(q) {
  if (q._termOpts) return q._termOpts;
  const ans = String(q.answer), low = x => String(x).trim().toLocaleLowerCase(), seen = new Set([low(ans)]), out = [ans];
  const add = list => list.forEach(x => { if (out.length < 4 && x && !seen.has(low(x))) { seen.add(low(x)); const t = String(x); out.push(/^[A-Z]/.test(ans) ? t[0].toUpperCase() + t.slice(1) : t); } });
  if (Array.isArray(q.choices)) add(q.choices);
  const ideas = (window.IDEAS || []).filter(I => I.id !== q.id), vs = I => I.variants || [];
  const sameL = I => q.lesson == null || I.lesson === q.lesson;
  const terms = ok => shuffle(ideas.filter(ok).flatMap(I => vs(I).filter(v => v.type === 'term' || v.type === 'fix').map(v => v.answer)));
  add(terms(sameL)); add(terms(I => !sameL(I)));
  add(shuffle(ideas.flatMap(I => vs(I).filter(v => v.type === 'mc' && v.options).map(v => v.options[v.answer])).filter(x => String(x).split(' ').length <= 3)));
  return (q._termOpts = out);
}

      });
      const paint = () => {
        chips.forEach(b => { const ii = +b.dataset.ii, home = ii === sel ? nowSlot : place[ii] >= 0 ? cols[place[ii]].querySelector('.drop') : pool; if (b.parentNode !== home) home.appendChild(b); b.classList.toggle('sel', sel === ii); });
        const left = place.filter(v => v < 0).length;
        cols.forEach(c => c.classList.toggle('ready', sel !== null));
        now.classList.toggle('done', sel === null);
        nowLab.textContent = sel !== null ? T(`Where does this card go? (${q.items.length - left + 1} of ${q.items.length})`, `البطاقة دي مكانها فين؟ (${q.items.length - left + 1} من ${q.items.length})`)
          : T('All done! Press Check. To change a card, tap it.', G('خلصت! اضغط تحقق. ولو عايز تغيّر بطاقة اضغط عليها.', 'خلصتي! اضغطي تحقق. ولو عايزة تغيّري بطاقة اضغطي عليها.'));
        waitLab.hidden = pool.hidden = !pool.children.length;
        check.disabled = left > 0;
      };
      const mark = () => {
        let ok = true; tools.hidden = true; pool.hidden = waitLab.hidden = now.hidden = true;
        chips.forEach(b => { const ii = +b.dataset.ii, good = place[ii] === q.answer[ii]; ok = ok && good; b.disabled = true; b.classList.remove('sel'); b.classList.add(good ? 'good' : 'bad'); });
        cols.forEach(c => { c.classList.remove('ready'); c.tabIndex = -1; });
        return ok;
      };
      const showRight = () => area.appendChild(mk('div', 'explain no', q.cols.map((c, ci) => `<b>${esc(c)}:</b> ${q.items.filter((_, i) => q.answer[i] === ci).map(esc).join(' · ')}`).join('<br>')));
      check.onclick = () => {
        if (finished) return; tries++;
        const ok = mark();
        if (!ok && retry) {   // wrong cards go back to the pile, right ones stay; place them again
          sfx.bad(); tryAgain();
          setTimeout(() => {
            if (finished) return;
            chips.forEach(b => { const ii = +b.dataset.ii; if (place[ii] !== q.answer[ii]) place[ii] = -1; b.classList.remove('good', 'bad'); b.disabled = place[ii] >= 0; });
            cols.forEach(c => { c.tabIndex = 0; });
            tools.hidden = false; now.hidden = false;
            const next = order.find(ii => place[ii] < 0); sel = next === undefined ? null : next; paint();
          }, 1600);
          return;
        }
        if (!ok) showRight(); finish(ok, ok && tries === 1);
      };
      reveal = () => { mark(); showRight(); };
      tools.appendChild(check); area.append(now, tbl, waitLab, pool, tools); paint();
    }

    /* a number answer (Math): type it on the number pad. Two tries; the right number is shown after the second.
       q.answer is the number as text ('12.42'); 0.50 equals 0.5 unless q.exact is true (a question about writing zeros) */
    else if (q.type === 'num') {
      const ans = String(q.answer), maxTries = 2;
      const same = s => (q.exact ? s === ans : s !== '' && s !== '.' && Math.abs(Number(s) - Number(ans)) < 1e-9);
      let val = '';
      const box = mk('div', 'numbox'), pad = mk('div', 'numpad'), tools = mk('div', 'tools');
      const check = mk('button', 'btn primary', T('Check ✓', 'تحقق ✓')); check.type = 'button'; check.disabled = true;
      const paintBox = () => { box.innerHTML = (val ? esc(val) : '<span class="ph">?</span>') + (q.unit ? `<span class="u">${esc(q.unit)}</span>` : ''); check.disabled = !val || val === '.' || val.endsWith('.'); };
      const keys = [];
      const key = ch => {
        if (finished) return;
        if (ch === '⌫') val = val.slice(0, -1);
        else if (ch === '.') { if (val.includes('.')) return; val = val === '' ? '0.' : val + '.'; }
        else { if (val.replace('.', '').length >= 9) return; val = val === '0' ? ch : val + ch; }
        box.classList.remove('bad'); sfx.tick(); paintBox();
      };
      ['7', '8', '9', '4', '5', '6', '1', '2', '3', '.', '0', '⌫'].forEach(ch => {
        const b = mk('button', ch === '⌫' ? 'fn' : '', ch === '.' ? '·' : ch); b.type = 'button';
        b.setAttribute('aria-label', ch === '⌫' ? T('Delete', 'امسح') : ch === '.' ? T('Decimal point', 'العلامة العشرية') : ch);
        if (ch === '.') b.className = 'fn';
        b.onclick = () => key(ch); pad.appendChild(b); keys.push(b);
      });
      const lockAll = () => { keys.forEach(b => { b.disabled = true; }); check.disabled = true; };
      check.onclick = () => {
        if (finished || check.disabled) return; tries++;
        if (same(val)) { box.classList.add('lock'); lockAll(); finish(true, tries === 1); return; }
        if (tries >= maxTries) { box.classList.add('bad'); lockAll(); val = ans; paintBox(); box.classList.add('lock'); box.classList.remove('bad'); finish(false, false); return; }
        sfx.bad(); box.classList.add('bad'); val = ''; paintBox(); box.classList.add('bad');
        say(T('Not quite. Check your number and try again!', G('قرّبت! راجع الرقم وجرّب تاني.', 'قرّبتي! راجعي الرقم وجرّبي تاني.')), 'think');
      };
      reveal = () => { lockAll(); val = ans; paintBox(); box.classList.add('lock'); };
      keyHandler = e => {
        if (finished || e.ctrlKey || e.metaKey || e.altKey) return;
        if (e.key === 'Backspace') { e.preventDefault(); key('⌫'); return; }
        if (e.key === 'Enter') { if (!(document.activeElement && document.activeElement.tagName === 'BUTTON') && !check.disabled) { e.preventDefault(); check.click(); } return; }
        if (/^[0-9]$/.test(e.key)) { e.preventDefault(); key(e.key); } else if (e.key === '.' || e.key === ',') { e.preventDefault(); key('.'); }
      };
      paintBox();
      area.appendChild(mk('div', 'helpline', T('Type the number with the pad', 'اكتب الرقم بلوحة الأرقام')));
      tools.appendChild(check); area.append(box, pad, tools);
    }

    /* write the word with letter tiles: the scientific term, or the right word instead of the underlined one */
    else if (q.type === 'fix') {
      const ans = String(q.answer), maxTries = 2;
      const isLetter = ch => /[\p{L}\p{N}]/u.test(ch), same = (a, b) => a.toLocaleLowerCase() === b.toLocaleLowerCase();
      const slotsEl = mk('div', 'slots'), tilesEl = mk('div', 'tiles'), slots = [];
      let word = mk('div', 'word'); slotsEl.appendChild(word);
      [...ans].forEach(ch => {
        if (ch === ' ') { word = mk('div', 'word'); slotsEl.appendChild(word); return; }
        if (!isLetter(ch)) { word.appendChild(mk('span', 'slot fixed', esc(ch))); return; }
        const b = mk('button', 'slot'); b.type = 'button'; b.setAttribute('aria-label', T('Letter box', 'خانة حرف'));
        const S = { el: b, ch, tile: null, lock: false };
        b.onclick = () => { if (finished || S.lock || !S.tile) return; S.tile.el.classList.remove('used'); S.tile = null; sfx.tick(); paint(); };
        word.appendChild(b); slots.push(S);
      });
      /* a long single word (12+ letters, e.g. "Compressibility") gets narrower boxes so it fits a phone screen */
      slotsEl.querySelectorAll('.word').forEach(w => { if (w.querySelectorAll('.slot:not(.fixed)').length >= 12) w.classList.add('long'); });
      const letters = slots.map(S => S.ch);
      const spare = shuffle([...(AR ? 'بتجحدرسشصعفقكلمنهوي' : 'aeiourstlnmcdph')].filter(c => !letters.some(l => same(l, c)))).slice(0, letters.length >= 5 ? 2 : 1);
      const tiles = shuffle(letters.concat(spare)).map(ch => {
        const b = mk('button', 'tile', esc(ch)); b.type = 'button'; const t = { el: b, ch };
        b.onclick = () => { if (finished) return; const S = slots.find(x => !x.tile); if (!S) return; S.tile = t; b.classList.add('used'); sfx.tick(); paint(); };
        tilesEl.appendChild(b); return t;
      });
      const tools = mk('div', 'tools');
      const clear = mk('button', 'btn', T('↺ Clear', '↺ امسح')); clear.type = 'button'; clear.disabled = true;
      const check = mk('button', 'btn primary', T('Check ✓', 'تحقق ✓')); check.type = 'button'; check.disabled = true;
      const paint = () => {
        slots.forEach(S => { S.el.textContent = S.tile ? S.tile.ch : ''; S.el.classList.toggle('lock', S.lock); S.el.classList.remove('bad'); });
        check.disabled = slots.some(S => !S.tile); clear.disabled = !slots.some(S => S.tile && !S.lock);
      };
      const empty = S => { S.tile.el.classList.remove('used'); S.tile = null; };
      clear.onclick = () => { if (finished) return; slots.forEach(S => { if (S.tile && !S.lock) empty(S); }); sfx.tick(); paint(); };
      const done = () => {
        tools.hidden = true; tilesEl.hidden = true; slots.forEach(S => { S.el.disabled = true; });
        const u = qt.querySelector('u.wrong'); if (u) { u.className = 'fixed'; u.textContent = ans; }
      };
      const showAnswer = () => slots.forEach(S => { const good = !!S.tile && same(S.tile.ch, S.ch); S.el.textContent = S.ch; S.el.classList.toggle('lock', good); S.el.classList.toggle('bad', !good); });
      check.onclick = () => {
        if (finished || check.disabled) return; tries++;
        if (slots.every(S => same(S.tile.ch, S.ch))) { slots.forEach(S => { S.lock = true; }); paint(); done(); finish(true, tries === 1); return; }
        if (tries >= maxTries) { showAnswer(); done(); finish(false, false); return; }
        sfx.bad();
        slots.forEach(S => { if (same(S.tile.ch, S.ch)) S.lock = true; else empty(S); });
        paint();
        say(T('The green letters are in the right place. Try the others again!', G('الحروف الخضراء في مكانها الصح. جرّب الباقي تاني!', 'الحروف الخضراء في مكانها الصح. جرّبي الباقي تاني!')), 'think');
      };
      reveal = () => { showAnswer(); done(); };
      keyHandler = e => {
        if (finished || e.ctrlKey || e.metaKey || e.altKey) return;
        const onBtn = document.activeElement && document.activeElement.tagName === 'BUTTON';
        if (e.key === 'Backspace') { const S = slots.slice().reverse().find(x => x.tile && !x.lock); if (S) { empty(S); paint(); } e.preventDefault(); return; }
        if (e.key === 'Enter') { if (!onBtn && !check.disabled) { e.preventDefault(); check.click(); } return; }
        if (e.key.length !== 1 || e.key === ' ') return;
        const t = tiles.find(x => !x.el.classList.contains('used') && same(x.ch, e.key)); if (t) { e.preventDefault(); t.el.click(); }
      };
      area.appendChild(mk('div', 'helpline', T('Tap the letters to write the word', 'اضغط على الحروف لتكتب الكلمة')));
      tools.append(clear, check); area.append(slotsEl, tilesEl, tools);
    }

    /* build the written answer from cards (give a reason, what happens, function, definition); some cards do not belong */
    else if (q.type === 'build') {
      const maxTries = 2, line = [];
      const cards = shuffle(q.parts.map((t, i) => ({ t, i })).concat((q.extra || []).map(t => ({ t, i: -1 }))));
      area.appendChild(mk('div', 'helpline', T('Tap the cards in order to build the answer', 'اضغط على البطاقات بالترتيب لتكوّن الإجابة')));
      const lineEl = mk('div', 'line'); lineEl.dataset.empty = T('Your answer will appear here…', 'إجابتك هتظهر هنا…');
      const pool = mk('div', 'pool');
      const tools = mk('div', 'tools');
      const clear = mk('button', 'btn', T('↺ Clear', '↺ امسح')); clear.type = 'button'; clear.disabled = true;
      const check = mk('button', 'btn primary', T('Check ✓', 'تحقق ✓')); check.type = 'button'; check.disabled = true;
      const paint = () => {
        cards.forEach(c => { if (!line.includes(c) && c.el.parentNode !== pool) pool.appendChild(c.el); });
        line.forEach(c => lineEl.appendChild(c.el));
        lineEl.classList.remove('bad'); check.disabled = clear.disabled = !line.length;
      };
      cards.forEach(c => {
        const b = mk('button', 'chipb', esc(c.t)); b.type = 'button'; c.el = b;
        b.onclick = () => { if (finished) return; const k = line.indexOf(c); if (k >= 0) line.splice(k, 1); else line.push(c); sfx.tick(); paint(); };
      });
      clear.onclick = () => { if (finished) return; line.length = 0; sfx.tick(); paint(); };
      const done = ok => { tools.hidden = true; pool.hidden = true; cards.forEach(c => { c.el.disabled = true; }); lineEl.classList.add(ok ? 'good' : 'bad'); };
      const showModel = () => area.appendChild(mk('div', 'explain no', `<b>${T('Model answer:', 'الإجابة النموذجية:')}</b> ${q.parts.map(esc).join(' ')}`));
      check.onclick = () => {
        if (finished || check.disabled) return; tries++;
        if (line.length === q.parts.length && line.every((c, k) => c.i === k)) { done(true); finish(true, tries === 1); return; }
        if (tries >= maxTries) { done(false); showModel(); finish(false, false); return; }
        sfx.bad(); lineEl.classList.add('bad');
        const stray = line.some(c => c.i < 0), missing = q.parts.some((_, i) => !line.some(c => c.i === i));
        say(stray ? T('One of your cards does not belong in the answer. Tap it to take it out, then check again.', G('فيه بطاقة مش من الإجابة. اضغط عليها علشان تشيلها وجرّب تاني.', 'فيه بطاقة مش من الإجابة. اضغطي عليها علشان تشيليها وجرّبي تاني.'))
          : missing ? T('Something is missing. Add another card, then check again.', G('فيه حاجة ناقصة. ضيف بطاقة كمان وجرّب تاني.', 'فيه حاجة ناقصة. ضيفي بطاقة كمان وجرّبي تاني.'))
          : T('Right cards! Now put them in the right order.', G('البطاقات صح! رتّبها صح بقى.', 'البطاقات صح! رتّبيها صح بقى.')), 'think');
      };
      reveal = () => { done(false); showModel(); };
      tools.append(clear, check); area.append(lineEl, pool, tools); paint();
    }
  });
}

/* one phrasing per idea, a different one from last time when possible */
function variantOf(idea, fixed) {
  const last = (SI.chProf().lastVar || {})[idea.id];
  let pool = idea.variants.map((_, i) => i);
  if (pool.length > 1) pool = pool.filter(i => i !== last);
  const vi = fixed != null && idea.variants[fixed] ? fixed : pool[Math.floor(Math.random() * pool.length)], v = idea.variants[vi];
  return Object.assign({ id: idea.id, lesson: idea.lesson, concept: idea.concept, explain: idea.explain, vi }, idea.bonus ? { src: 'bonus' } : {}, idea.guide ? { guide: true } : {}, v, v.explain ? { explain: v.explain } : {});
}
function rememberVariants(list) { SI.updateChProf(p => { p.lastVar = p.lastVar || {}; list.forEach(q => { p.lastVar[q.id] = q.vi; }); }); }
const ideaById = id => window.IDEAS.find(I => I.id === id);

/* ---------- "Why was I wrong?": Reesho explains a wrong answer (Claude, through the reesho-api worker) ---------- */
const REESHO_API = 'https://reesho-api.ahmadtahoon2020.workers.dev/';
/* Switch: false hides the "Why is my answer wrong?" button, Reesho's written explanation and its spoken voice
   (paused 2026-10-13: the explanations had science mistakes and the voice mispronounced Arabic). true turns it back on. */
const REESHO_EXPLAIN_ON = false;
/* Reesho reads his explanation aloud in his own voice (ElevenLabs, through the same worker); plays by itself unless sound is off */
function stopReeshoVoice() { try { if (window.__reeshoAudio) window.__reeshoAudio.pause(); } catch (e) {} window.__reeshoAudio = null; }
function addVoice(box, text, sig) {
  let url = null;
  const pb = mk('button', 'why-play', T('🔊 Listen to Reesho', '🔊 اسمع ريشو')); pb.type = 'button';
  box.appendChild(pb);
  const load = () => url ? Promise.resolve(url) : fetch(REESHO_API + 'voice', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ text, sig }) })
    .then(r => { if (!r.ok) throw new Error('voice'); return r.blob(); }).then(bl => (url = URL.createObjectURL(bl)));
  const play = () => {
    pb.disabled = true; pb.textContent = T('🦜 Getting ready…', 'ريشو بيجهّز صوته… 🦜');
    load().then(u => { stopReeshoVoice(); const a = new Audio(u); window.__reeshoAudio = a; return a.play(); })
      .catch(() => { if (AR) SI.speak(text); })
      .finally(() => { pb.disabled = false; pb.textContent = T('🔊 Listen again', '🔊 اسمع تاني'); });
  };
  pb.onclick = play;
  if (!SI.isMuted()) play();
}

function addWhyBtn(q, ex, hint = false) {   // hint: the question is still open, so Reesho must not give the answer away
  const wrong = q._wrong; delete q._wrong;
  if (!REESHO_EXPLAIN_ON) return;
  const b = mk('button', 'btn why-btn', T('🦜 Why is my answer wrong?', G('🦜 ليه إجابتي غلط؟', '🦜 ليه إجابتي غلط؟')));
  b.type = 'button';
  b.onclick = async () => {
    b.disabled = true; b.textContent = T('🦜 Reesho is thinking…', 'ريشو بيفكّر… 🦜');
    try {
      const res = await fetch(REESHO_API, { method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ qid: `${SI.chapterId() || 'ch1'}-${q.id}-${q.vi}`, question: q.q, chosen: wrong, correct: answerText(q), fact: q.explain || '', hint,
          lang: AR ? 'ar' : 'en', gender: SI.gender() === 'f' ? 'girl' : 'boy' }) });
      const d = await res.json();
      if (!res.ok || !d.explanation) throw new Error(d.error || 'no_reply');
      const box = mk('div', 'why-box', `<b>🦜 ${T('Reesho', 'ريشو')}:</b> ${esc(d.explanation)}`);
      b.replaceWith(box); say(T('Now you know why!', G('كده عرفت السبب!', 'كده عرفتي السبب!')), 'point');
      if (d.sig) addVoice(box, d.explanation, d.sig);
    } catch (e) {
      b.replaceWith(mk('div', 'why-box', T('🦜 Reesho is resting now. Read the explanation above and try again later!', G('🦜 ريشو بيرتاح دلوقتي. اقرأ الشرح اللي فوق وجرّب بعدين!', '🦜 ريشو بيرتاح دلوقتي. اقري الشرح اللي فوق وجرّبي بعدين!'))));
    }
  };
  ex.after(b);
  const old = ex.parentNode.querySelectorAll('.why-btn, .why-box'); old.forEach(n => { if (n !== b) n.remove(); });
}

/* an unfinished Quest is kept in the chapter profile (p.run) so the child continues from the last question instead of starting again */
const RUN_DAYS = 3;
function saveRun(list, next, results, missed, firstRight) {
  SI.updateChProf(p => { p.run = next >= list.length ? null : { ids: list.map(q => q.id + ':' + q.vi), i: next, results: Array.from(results, r => r === true ? 1 : r === false ? 0 : -1), missed: missed.map(q => q.id), firstRight, score, streak, best, at: Date.now() }; });
}
function loadRun() {
  const r = SI.chProf().run;
  if (!r || !r.ids || r.i <= 0 || r.i >= r.ids.length || Date.now() - r.at > RUN_DAYS * 864e5) return null;
  const list = r.ids.map(k => { const [id, vi] = k.split(':'), I = ideaById(id); if (!I) return null; const q = variantOf(I, +vi); if (I.boss) q.mode = 'boss'; else if (I.bonus) q.mode = 'normal'; return q; });
  if (list.some(q => !q)) return null;
  return { list, run: { i: r.i, results: r.results.map(x => x === 1 ? true : x === 0 ? false : undefined), missed: r.missed, firstRight: r.firstRight, score: r.score, streak: r.streak, best: r.best } };
}
const clearRun = () => SI.updateChProf(p => { p.run = null; });
async function playList(list, label, resume) {
  const results = resume ? resume.results.slice() : [], missed = resume ? list.filter(q => resume.missed.includes(q.id)) : [];
  let firstRight = resume ? resume.firstRight : 0;
  for (let i = resume ? resume.i : 0; i < list.length; i++) {
    const q = list[i];
    if (q.src === 'bonus' && list[i - 1] && list[i - 1].src !== 'bonus') {
      sfx.boss(); await banner(T('Bonus', 'إضافي'), T('Extra question!', 'سؤال إضافي!'));
      say(q.guide ? T('A bonus question in the style of the monthly test. Extra points!', 'سؤال إضافي على طريقة امتحان الشهر. نقط زيادة!') : T(`A bonus question from the ${SI.isUnits() ? 'unit' : 'chapter'}’s extra reading. Extra points!`, 'سؤال إضافي من الجزء الإثرائي في الكتاب. نقط زيادة!'), 'point');
    } else if (q.mode === 'boss' && list[i - 1] && list[i - 1].mode !== 'boss') {
      sfx.boss(); SI.voice('boss'); await banner(T('Get ready', 'استعد'), T('Boss Round!', 'التحدي الكبير!'), 'boss');

/* Chapter Quest: 20 ideas, one phrasing each; normal and timed mixed, Boss ideas last */
/* A long chapter (a whole unit of the preparatory book) sets questMax in chapters.js: each Quest then asks that many ideas:
   every Boss idea, and normal ideas taken in turn from each lesson (the ones the player knows least first), so every lesson is in it */
function questIdeas() {
  const all = window.IDEAS.filter(I => !I.bonus), max = CH.questMax;
  if (!max || all.length <= max) return all;
  const boss = all.filter(I => I.boss), cards = SI.chProf().cards || {}, box = I => (cards[I.id] ? cards[I.id].box : -1), byL = {};
  shuffle(all.filter(I => !I.boss)).sort((x, y) => box(x) - box(y)).forEach(I => { (byL[I.lesson] = byL[I.lesson] || []).push(I); });
  const lessons = Object.keys(byL).sort((x, y) => x - y), keep = [];
  for (let k = 0; keep.length < max - boss.length && lessons.some(l => byL[l].length); k++) { const L = byL[lessons[k % lessons.length]]; if (L.length) keep.push(L.shift()); }
  return keep.concat(boss);
}
function buildQuest() {
  const normal = [], timed = [], boss = [];
  const bonus = window.IDEAS.filter(I => I.bonus);
  questIdeas().forEach(I => {
    const q = variantOf(I);
    if (I.boss) { q.mode = 'boss'; boss.push(q); } else (q.mode === 'timed' ? timed : normal).push(q);
  });
  if (CH.bookOrder) {   // the questions follow the book: lesson 1, then 2 and so on; each lesson in the order of its ideas, the Boss ideas of every lesson at the end
    const pos = new Map(window.IDEAS.map((I, i) => [I.id, i])), byBook = (x, y) => (pos.get(x.id) - pos.get(y.id));
    const extraB = bonus.length ? [Object.assign(variantOf(bonus[Math.floor(Math.random() * bonus.length)]), { mode: 'normal' })] : [];
    return normal.concat(timed).sort(byBook).concat(boss.sort(byBook), extraB);
  }
  const N = shuffle(normal), T = shuffle(timed), seq = [];
  while (N.length || T.length) {
    if (N.length) seq.push(N.shift());
    if (T.length) seq.push(T.shift());
    if (N.length && T.length < N.length) seq.push(N.shift());
  }
  const extra = bonus.length ? [Object.assign(variantOf(bonus[Math.floor(Math.random() * bonus.length)]), { mode: 'normal' })] : [];
  return seq.concat(shuffle(boss), extra);   // one bonus question after the Boss round; it never counts for the stars
}
/* Daily 5: ideas due for review first, then the ones the player knows least */
function buildDaily() {
  const cards = SI.chProf().cards || {}, due = dueCards();
  const box = id => (cards[id] ? cards[id].box : -1);
  const rest = shuffle(window.IDEAS.filter(I => !I.bonus).map(I => I.id).filter(id => !due.includes(id))).sort((a, b) => box(a) - box(b));
  return due.concat(rest).slice(0, 5).map(id => { const q = variantOf(ideaById(id)); if (q.mode === 'boss') q.mode = 'normal'; return q; });
}
function buildReview() {
  return dueCards().slice(0, 10).map(ideaById).filter(Boolean).map(I => { const q = variantOf(I); if (q.mode === 'boss') q.mode = 'normal'; return q; });
}

/* ---------- Reesho's Exam Hall (quiz.html#exam=oct) ----------
   A monthly test on several chapters at once (chapters.js: window.EXAMS), shaped like the school's monthly test:

  if (q.type === 'table') return q.cols.map((c, ci) => `${c}: ${q.items.filter((_, i) => q.answer[i] === ci).join(', ')}`).join(' · ');
  if (q.type === 'term' || q.type === 'fix') return String(q.answer);
  if (q.type === 'num') return String(q.answer) + (q.unit ? ' ' + q.unit : '');

const EXAM_A = v => (['tf', 'fill', 'fix', 'term', 'multi', 'order', 'num'].includes(v.type) || (v.type === 'mc' && v.style !== 'story')) ? v.type : null;
const EXAM_B = v => v.type === 'build' ? (v.style === 'why' ? 'why' : v.style === 'whatif' ? 'whatif' : 'say') : (v.type === 'table' || v.type === 'match') ? 'compare' : v.type === 'tap' ? 'figure' : (v.type === 'mc' && v.style === 'story') ? 'story' : null;

  pool.forEach(I => I.variants.forEach((v, vi) => { const a = EXAM_A(v), b = EXAM_B(v); if (a || b) cands.push({ I, v, vi, a, b }); }));
  const take = test => {
    const list = shuffle(cands.filter(c => !used.has(c.I.id) && test(c) && (perCh[c.I.ch] || 0) < (caps[c.I.ch] == null ? 99 : caps[c.I.ch])));
    if (!list.length) return null;
    list.sort((x, y) => ((perCh[x.I.ch] || 0) - (perCh[y.I.ch] || 0)) || ((last[x.I.id] === x.vi) - (last[y.I.id] === y.vi)));   // spread over the chapters, new phrasings first
    const c = list[0]; used.add(c.I.id); perCh[c.I.ch] = (perCh[c.I.ch] || 0) + 1; return c;
  };
  const kinds = shuffle(['tf', 'mc', 'fill', 'fix', 'term', 'multi', 'order', 'num']), fams = shuffle(['say', 'why', 'whatif', 'compare', 'figure', 'story']);
  const make = (c, n, part, marks) => c && Object.assign({ id: c.I.id, ch: c.I.ch, lesson: c.I.lesson, concept: c.I.concept, explain: c.I.explain, vi: c.vi }, c.v, c.v.explain ? { explain: c.v.explain } : {},
    { mode: 'normal', oneTry: true, exam: { q: n, part, marks } });

    const B1 = take(c => c.b === fams[n - 1]) || take(c => c.b), B2 = take(c => c.b === fams[n - 1]) || take(c => c.b);

}

    say(i === 0 ? T('Read every question carefully. Good luck!', G('اقرأ كل سؤال كويس. بالتوفيق!', 'اقري كل سؤال كويس. بالتوفيق!'))

      : T('Part (B): two marks. Take your time.', G('الجزء (ب): درجتان. خد وقتك.', 'الجزء (ب): درجتان. خدي وقتك.')), i === 0 ? 'point' : 'think');

}
function examResults(EX, res, total) {
  const pct = total ? res.marks / total : 0;
  const grade = pct >= .9 ? T('Excellent', 'ممتاز') : pct >= .75 ? T('Very good', 'جيد جدًا') : pct >= .5 ? T('Good', 'جيد') : T('Keep practising', 'محتاج تمرين');
  track('quiz_complete', { mode: 'exam', exam: EX.id, marks: res.marks, of: total });
  let best = res.marks;
  SI.updateProf(p => {
    const E = (p.exams = p.exams || {})[EX.id] = p.exams[EX.id] || {};
    E.best = best = Math.max(E.best || 0, res.marks); E.last = res.marks; E.of = total; E.plays = (E.plays || 0) + 1;
    E.lastVar = E.lastVar || {}; res.flat.forEach(q => { E.lastVar[q.id] = q.vi; });
  });
  const gain = SI.addXP(res.marks * 15);
  sfx.win(); SI.voice('finish'); if (pct >= .5) confetti(60);
  const me = SI.player();
  say(pct >= .9 ? T(`Wonderful, ${esc(me.name)}! You are ready for the test!`, G(`هايل يا ${esc(me.name)}! إنت جاهز للامتحان!`, `هايل يا ${esc(me.name)}! إنتي جاهزة للامتحان!`))
    : T(`Well done, ${esc(me.name)}! Practise the tricky parts, then try a new paper.`, G(`برافو يا ${esc(me.name)}! راجع الأجزاء الصعبة وجرّب ورقة جديدة.`, `برافو يا ${esc(me.name)}! راجعي الأجزاء الصعبة وجرّبي ورقة جديدة.`)), 'celebrate');
  const byCh = Object.keys(res.perCh).sort((x, y) => (SI.chapterById(x) || {}).n - (SI.chapterById(y) || {}).n).map(id => {
    const c = SI.chapterById(id) || {}, m = res.perCh[id], weak = m.got < m.of && SI.chReady(c);
    return `<li><div class="r"><span>${esc(SI.chTitle(c))}: <b>${m.got} / ${m.of}</b></span>${weak ? `<a href="map.html" data-ch="${id}">${T('Practise ▸', 'اتمرّن ◂')}</a>` : ''}</div><div class="bar"><i style="width:${Math.round(m.got / m.of * 100)}%"></i></div></li>`;
  }).join('');
  const miss = res.wrong.map(q => `<li>${esc(q.q)}<b>✓ ${esc(answerText(q))}</b></li>`).join('');
  const o = mk('div', 'overlay', `<div class="panel sheet">
    <h2>${esc(T(EX.title, EX.titleAr))}</h2>
    <div class="mark" aria-label="${T(`${res.marks} out of ${total}`, `${res.marks} من ${total}`)}">${res.marks}<small> / ${total}</small></div>
    <span class="grade${pct >= .75 ? ' top' : ''}">${grade}</span>
    <div class="qm">${res.perQ.map((m, i) => `<span><small>${T('Question', 'السؤال')} ${i + 1}</small>${m} / 5</span>`).join('')}</div>
    ${levelBlock(gain)}
    <h3>${SI.isUnits() ? T('Marks by unit', 'الدرجات حسب الوحدة') : T('Marks by chapter', 'الدرجات حسب الفصل')}</h3><ul class="byc">${byCh}</ul>
    ${miss ? `<h3>${T('Look again at these', 'راجع دول تاني')}</h3><ul class="miss">${miss}</ul>` : `<p style="text-align:center">${T('A perfect paper! 🎉', 'ورقة من غير ولا غلطة! 🎉')}</p>`}
    <div class="row acts">
      <button class="btn primary" type="button" id="again">${T('New paper', 'ورقة جديدة')}</button>
      <a class="btn" href="chapters.html">${SI.chWords()}</a>
    </div></div>`);
  document.body.appendChild(o);
  o.querySelectorAll('a[data-ch]').forEach(a => { a.onclick = () => { SI.setChapter(a.dataset.ch); }; });
  $('#again', o).onclick = () => location.reload();
  if (gain.after.n > gain.before.n) setTimeout(() => { sfx.level(); SI.voice('level'); banner(T('Level up!', 'مستوى جديد!'), `${T('Level', 'المستوى')} ${gain.after.n} · ${gain.after.title}`); }, 900);
  return best;
}
async function examMain() {
  const me = SI.player();
  const EX = SI.examById((/^#exam=([\w-]+)/.exec(location.hash) || [])[1]);
  if (!EX) { location.href = SI.CHAPTERS_PAGE; return; }
  document.querySelectorAll('a[href="map.html"]').forEach(a => { a.href = SI.CHAPTERS_PAGE; const l = SI.isUnits() ? T('Back to the units', 'رجوع للوحدات') : T('Back to the chapters', 'رجوع للفصول'); a.title = l; if (a.hasAttribute('aria-label')) a.setAttribute('aria-label', l); });
  $('.logo').textContent = EX.icon || '📝';
  $('#scorePill').firstElementChild.textContent = T('Marks', 'الدرجات');
  const title = T(EX.title, EX.titleAr), hall = T('Reesho’s Exam Hall', 'لجنة ريشو');
  $('#title').textContent = hall; $('#subtitle').textContent = title; document.title = `${title} · ${hall}`;
  say(T(`Hi, ${esc(me.name)}! Welcome to my exam hall.`, `أهلًا يا ${esc(me.name)}! نوّرت لجنة ريشو.`), 'wave');
  const parts = SI.examParts(EX), pool = [], caps = {};
  for (const part of parts) {
    if (part.chance != null && Math.random() > part.chance) continue;   // a chapter the test only touches is not in every paper
    const ideas = await SI.loadIdeas(part.c);
    if (!ideas) continue;
    if (part.max != null) caps[part.c.id] = part.max;
    ideas.forEach(I => { if ((I.bonus && !I.guide) || (part.lessons && !part.lessons.includes(I.lesson))) return; pool.push(Object.assign({}, I, { ch: part.c.id })); });   // not the enrichment columns
  }
  window.IDEAS = pool;
  const last = ((SI.prof().exams || {})[EX.id] || {}).lastVar || {};
  const paper = buildPaper(pool, caps, last), total = paper.flat().reduce((n, q) => n + q.exam.marks, 0);
  if (total < 20) throw new Error('Not enough questions for a full paper.');
  const prev = (SI.prof().exams || {})[EX.id];
  await intro(hall, `${title} · ${SI.examScope(EX, parts)}`,
    T('4 questions, 5 marks each: <b>20 marks</b>. Part (A) is short and gets <b>one try</b>. Part (B) is worth 2 marks. Every time you come back, Reesho writes a new paper!',
      G('٤ أسئلة، كل سؤال ٥ درجات: <b>٢٠ درجة</b>. الجزء (أ) قصير وليه <b>محاولة واحدة</b>، والجزء (ب) بدرجتين. وكل مرة ترجع، ريشو بيكتب لك ورقة جديدة!', '٤ أسئلة، كل سؤال ٥ درجات: <b>٢٠ درجة</b>. الجزء (أ) قصير وليه <b>محاولة واحدة</b>، والجزء (ب) بدرجتين. وكل مرة ترجعي، ريشو بيكتب لك ورقة جديدة!'))
    + (prev && prev.plays ? `<br>${T('Your best mark', 'أعلى درجة ليك')}: <b>${prev.best} / ${prev.of || 20}</b>` : ''), T('Start the test', 'ابدأ الامتحان'));
  SI.voice('boss');
  track('quiz_start', { mode: 'exam', exam: EX.id });
  const res = await playExam(paper);
  examResults(EX, res, total);
}

async function main() {
  const me = SI.player();
  const mode = /^#(daily|review)$/.test(location.hash) ? location.hash.slice(1) : (/^#preview/.test(location.hash) && SI.isOwner()) ? 'preview' : 'quest';   // preview opens only after the owner signs in on admin.html
  say(T(`Hi, ${esc(me.name)}! I’m Reesho.`, `أهلًا يا ${esc(me.name)}! أنا ريشو.`), 'wave');
  const set = (t, s) => { $('#title').textContent = t; $('#subtitle').textContent = s; document.title = t + T(' · Motafawek', ' · متفوّق'); };
  const TITLE = SI.chTitle(CH);

  if (mode === 'preview') return preview(set);
  if (mode === 'quest') {
    let saved = loadRun();
    if (saved) {   // the child left in the middle: continue from the last question, or start again
      const n = saved.run.i + 1, tot = saved.list.length;
      set(SI.questName(CH), T(`${CH.title} · ${tot} questions`, `${TITLE} · ${tot} سؤال`));
      const o = notice(T('Welcome back!', 'أهلًا بعودتك!'), T(`You stopped at question <b>${n}</b> of ${tot}. Continue from there?`, G(`إنت وقفت عند السؤال <b>${n}</b> من ${tot}. تكمّل من هنا؟`, `إنتي وقفتي عند السؤال <b>${n}</b> من ${tot}. تكمّلي من هنا؟`)),
        `<button class="btn primary" type="button" id="resumeRun">${T(`Continue from question ${n}`, `كمّل من السؤال ${n}`)}</button><button class="btn" type="button" id="freshRun">${T('Start again', 'ابدأ من الأول')}</button>`);
      const again = await new Promise(r => { $('#resumeRun', o).onclick = () => { o.remove(); r(false); }; $('#freshRun', o).onclick = () => { o.remove(); r(true); }; });
      if (again) { clearRun(); saved = null; }
    }
    if (saved) {
      const list = saved.list, R = saved.run;
      score = R.score || 0; $('#score').textContent = score; streak = R.streak || 0; best = R.best || 0;
      track('quiz_resume', { mode: 'quest', chapter: CH.id || '', at: R.i });
      say(T(`Let’s continue from question ${R.i + 1}!`, `يلّا نكمّل من السؤال ${R.i + 1}!`), 'point');
      const res = await playList(list, 'quest', R);
      clearRun();
      const retry = res.missed.filter(q => q.mode !== 'boss');
      if (retry.length) {
        await banner(T('Second chance', 'فرصة تانية'), T('Try them again!', G('جرّبهم تاني!', 'جرّبيهم تاني!')));
        await playList(retry.map(q => Object.assign({}, q, { mode: 'normal' })), 'retry');
      }
      return results('quest', res, list.filter(q => q.src !== 'bonus').length);
    }
    const list = buildQuest(), N = list.filter(q => q.src !== 'bonus').length; rememberVariants(list);
    set(SI.questName(CH), T(`${CH.title} · ${N} questions`, `${TITLE} · ${N} سؤال`));
    await intro(T(`Ready, ${esc(me.name)}?`, G(`جاهز يا ${esc(me.name)}؟`, `جاهزة يا ${esc(me.name)}؟`)), T(`${SI.chWord(CH)} ${CH.n} Quest · ${N} questions`, `تحدي ${SI.chWord(CH)} ${CH.n} · ${N} سؤال`),
      T('Some questions have a timer ⏱. The last ones are Boss questions ★. Get 5 right in a row for a mystery box 🎁. Your best score goes on the Champions board 🏆!',
        G('بعض الأسئلة ليها وقت ⏱. وآخر الأسئلة هي التحدي الكبير ★. جاوب ٥ صح ورا بعض وخد صندوق المفاجآت 🎁. وأعلى نتيجة ليك بتدخل لوحة الأبطال 🏆!', 'بعض الأسئلة ليها وقت ⏱. وآخر الأسئلة هي التحدي الكبير ★. جاوبي ٥ صح ورا بعض وخدي صندوق المفاجآت 🎁. وأعلى نتيجة ليكي بتدخل لوحة الأبطال 🏆!')));
    track('quiz_start', { mode: 'quest', chapter: CH.id || '' });
    const res = await playList(list, 'quest');
    clearRun();
    const retry = res.missed.filter(q => q.mode !== 'boss');
    if (retry.length) {
      await banner(T('Second chance', 'فرصة تانية'), T('Try them again!', G('جرّبهم تاني!', 'جرّبيهم تاني!')));
      await playList(retry.map(q => Object.assign({}, q, { mode: 'normal' })), 'retry');
    }
    await results('quest', res, list.filter(q => q.src !== 'bonus').length);
  } else if (mode === 'daily') {
    set(T('Daily 5', 'خماسية اليوم'), T(`${CH.title} · five quick questions every day`, `${TITLE} · خمس أسئلة سريعة كل يوم`));
    const st = SI.dailyState();
    if (st.done) {
      const o = notice(T('Done for today!', G('خلّصت النهارده!', 'خلّصتي النهارده!')), T(`You already did today’s Daily 5. 🔥 Your streak: <b>${st.streak} day${st.streak === 1 ? '' : 's'}</b>. Come back tomorrow!`, G(`إنت حليت خماسية النهارده خلاص. 🔥 سلسلتك: <b>${st.streak} يوم</b>. ارجع بكرة!`, `إنتي حليتي خماسية النهارده خلاص. 🔥 سلسلتك: <b>${st.streak} يوم</b>. ارجعي بكرة!`)),
        `<button class="btn primary" type="button" id="practise">${T('Practise anyway', 'اتمرّن برضه')}</button><a class="btn" href="map.html">${T('Map', 'الخريطة')}</a>`);
      await new Promise(r => { $('#practise', o).onclick = () => { o.remove(); r(); }; });
      const list = buildDaily(); rememberVariants(list);
      track('quiz_start', { mode: 'daily', chapter: CH.id || '' });
      const res = await playList(list, 'daily');
      return results('daily', res, list.length);
    }
    const list = buildDaily(); rememberVariants(list);
    await intro(T('Daily 5', 'خماسية اليوم'), st.streak ? T(`🔥 ${st.streak} day streak`, `🔥 ${st.streak} يوم ورا بعض`) : T('Start your streak today!', 'ابدأ سلسلتك النهارده!'), T('Five quick questions. Finish them to keep your fire streak going and win bonus XP.', 'خمس أسئلة سريعة. خلّصهم علشان تحافظ على سلسلتك وتكسب XP زيادة.'), T('Go!', 'يلّا!'));
    track('quiz_start', { mode: 'daily', chapter: CH.id || '' });
    const res = await playList(list, 'daily');
    const streakNow = SI.completeDaily();
    await results('daily', res, list.length, 20 + Math.min(streakNow, 10) * 5);
  } else {
    set(T('Review', 'المراجعة'), T(`${CH.title} · the tricky ones`, `${TITLE} · الأسئلة الصعبة`));
    const list = buildReview();
    if (!list.length) {
      const cards = SI.chProf().cards || {};
      const next = Object.values(cards).map(c => c.due).sort((a, b) => a - b)[0];
      const when = next ? Math.max(1, Math.round((next - Date.now()) / DAY)) : 0;
      notice(T('All caught up!', 'مفيش حاجة متأخرة!'), next ? T(`Nothing to review right now. Come back in about <b>${when} day${when > 1 ? 's' : ''}</b>.`, G(`مفيش مراجعة دلوقتي. ارجع بعد حوالي <b>${when} يوم</b>.`, `مفيش مراجعة دلوقتي. ارجعي بعد حوالي <b>${when} يوم</b>.`)) : T(`Play the ${SI.questName(CH)} first. Reesho will save the tricky questions here.`, `العب ${SI.questName(CH)} الأول، وريشو هيحفظ لك الأسئلة الصعبة هنا.`),
        `<a class="btn primary" href="map.html">${T('Map', 'الخريطة')}</a>`);
      return;
    }
    rememberVariants(list);
    await intro(T('Review time', 'وقت المراجعة'), T(`${list.length} question${list.length > 1 ? 's' : ''} to practise`, `${list.length} سؤال للتمرين`), T('These were tricky before. Get them right to move them further away!', G('الأسئلة دي كانت صعبة عليك قبل كده. جاوبها صح علشان تبعد عنك!', 'الأسئلة دي كانت صعبة عليكي قبل كده. جاوبيها صح علشان تبعد عنك!')), T('Go!', 'يلّا!'));
    track('quiz_start', { mode: 'review', chapter: CH.id || '' });
    const res = await playList(list, 'review');
    await results('review', res, list.length);
  }
}
window.addEventListener('hashchange', () => location.reload());
const EXAM = /^#exam\b/.test(location.hash);
const notReady = e => {
  console.error(e);
  notice(T('Not ready yet', 'لسه مش جاهز'), T('The questions could not be loaded. Check your connection and try again.', 'مقدرناش نحمّل الأسئلة. اتأكد من النت وجرّب تاني.'), `<a class="btn primary" href="chapters.html">${SI.chWords()}</a><button class="btn" type="button" onclick="location.reload()">${T('Try again', 'جرّب تاني')}</button>`);
};
if (EXAM) { if (SI.requirePlayer()) examMain().catch(notReady); }
else if (SI.requirePlayer() && ((/^#preview/.test(location.hash) && SI.isOwner() && (SI.chapter() || {}).questions) || SI.requireChapter())) {   // the owner can preview a chapter before it opens
  SI.applyTheme();
  if (CH.quizBg) document.body.style.backgroundImage = `linear-gradient(rgba(255,255,255,.35),rgba(255,255,255,.35)),url(${CH.quizBg})`;
  SI.loadQuestions().then(main).catch(e => {
    console.error(e);
    notice(T('Not ready yet', 'لسه مش جاهز'), T('The questions could not be loaded. Check your connection and try again.', 'مقدرناش نحمّل الأسئلة. اتأكد من النت وجرّب تاني.'), `<a class="btn primary" href="chapters.html">${SI.chWords()}</a><button class="btn" type="button" onclick="location.reload()">${T('Try again', 'جرّب تاني')}</button>`);
  });
}
window.__quiz = { ask: q => ask(q), termOpts, DIAGRAMS, variantOf, mysteryBox, notice, buildPaper, answerText, examResults, results: (kind, res, total, extra, sc) => { if (sc != null) score = sc; return results(kind, res, total, extra); } };
})();
</script>
