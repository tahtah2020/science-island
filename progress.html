<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>متفوّق · لوحة المتابعة</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;700;800;900&family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="common.css?v=20261025q">
<style>
/* Owner's progress board: the whole plan (every subject, Grade 1 to Prep 3, first term) in one table.
   Each cell = one subject in one grade: units published out of the term's units, for the Languages track and the Arabic track.
   Read live from chapters.js; PLAN below gives the number of units of a term that is not listed in chapters.js yet. */
:root{--ok:#2e9e6b;--okbg:#e4f6ec;--wip:#f2b134;--no:#c9d6df;--nobg:#f1f5f8}
body{font-family:"Cairo","Nunito",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:1100px;width:100%;margin:0 auto;display:flex;flex-direction:column;gap:14px;padding-bottom:30px}
.box{background:rgba(255,250,240,.96);border:2px solid var(--line);border-radius:20px;padding:14px 16px}
h1{margin:0 0 4px;font-size:23px;font-weight:900;color:var(--navy)}
.lead{margin:0;font-weight:700;color:var(--ink);font-size:14.5px;line-height:1.7}
.big{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.big .s{background:#fff;border:2px solid var(--line);border-radius:16px;padding:10px 14px}
.big .k{font-weight:800;font-size:14px;color:var(--ink)}
.big .v{font-weight:900;font-size:30px;color:var(--navy);line-height:1.2}
.big .v small{font-size:16px;color:var(--ink)}
.bar{height:10px;border-radius:99px;background:var(--nobg);overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--ok);border-radius:99px}
.scroll{overflow-x:auto;margin:0 -4px;padding:0 4px}
table.m{border-collapse:separate;border-spacing:6px;width:100%;min-width:640px}
.m th{font-weight:900;font-size:14.5px;color:var(--navy);padding:4px;white-space:nowrap}
.m th.g{text-align:start;font-size:15px}
.m th.g small{display:block;font-size:12px;font-weight:800;color:var(--ink)}
.cell{all:unset;box-sizing:border-box;display:flex;flex-direction:column;gap:4px;width:100%;min-height:62px;padding:7px 8px;border-radius:12px;background:#fff;border:2px solid var(--line);cursor:pointer}
.cell:hover,.cell:focus-visible{border-color:var(--primary)}
.cell.none{background:var(--nobg);border-style:dashed;cursor:default;align-items:center;justify-content:center;color:#8aa0b0;font-weight:900;font-size:13px}
.cell.full{background:var(--okbg);border-color:#bfe3cf}
.ln{display:flex;align-items:center;gap:6px;font-size:12.5px;font-weight:800;color:var(--ink)}
.ln b{font-size:14.5px;font-weight:900;color:var(--navy);margin-inline-start:auto;direction:ltr}
.ln .mini{flex:1;height:7px;border-radius:99px;background:var(--nobg);overflow:hidden;min-width:20px}
.ln .mini i{display:block;height:100%;background:var(--ok)}
.key{display:flex;flex-wrap:wrap;gap:6px 16px;font-weight:800;font-size:13.5px;color:var(--ink);margin-top:10px}
.key span{display:inline-flex;align-items:center;gap:6px}
.sq{width:16px;height:16px;border-radius:5px;display:inline-block}
dialog{border:0;border-radius:20px;padding:0;max-width:460px;width:calc(100% - 24px);box-shadow:0 20px 60px rgba(31,61,87,.35)}
dialog::backdrop{background:rgba(31,61,87,.45)}
.dlg{padding:16px 18px;display:flex;flex-direction:column;gap:12px;font-family:"Cairo","Nunito",sans-serif}
.dlg h3{margin:0;font-size:19px;font-weight:900;color:var(--navy)}
.trk{font-weight:900;font-size:15px;color:var(--navy);margin-bottom:6px}
.units{display:flex;flex-wrap:wrap;gap:8px}
.u{all:unset;box-sizing:border-box;width:46px;height:46px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:18px;cursor:pointer;text-decoration:none}
.u.ok{background:var(--ok);color:#fff}
.u.wip{background:var(--wip);color:#4a3200}
.u.no{background:var(--nobg);color:#8aa0b0;border:2px dashed var(--no);cursor:default}
.hint{margin:0;font-weight:700;color:var(--ink);font-size:13.5px}
@media (max-width:520px){ .big .v{font-size:24px} }
</style>
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
</head>
<body>
<div class="app">
  <header class="top">
    <a class="brand" href="admin.html">
      <div class="logo" aria-hidden="true">📋</div>
      <div><div class="name">لوحة المتابعة</div></div>
    </a>
    <nav class="bar" style="display:flex;gap:8px;height:auto;background:none">
      <a class="pill" href="admin.html">لوحة الأدمن</a>
      <a class="pill" href="index.html">الموقع</a>
    </nav>
  </header>

  <main class="wrap">
    <section class="box">
      <h1>خطة الترم الأول</h1>
      <p class="lead">كل مادة في كل صف، من الأول الابتدائي إلى الثالث الإعدادي. الرقم يعني عدد الوحدات المنشورة من وحدات الترم، لمسار اللغات وللمسار العربي. اضغط أي خانة لترى أرقام الوحدات وتفتحها.</p>
    </section>

    <section class="big" id="big"></section>

    <section class="box">
      <div class="scroll"><table class="m" id="m"></table></div>
      <div class="key">
        <span><i class="sq" style="background:var(--ok)"></i>منشورة</span>
        <span><i class="sq" style="background:var(--wip)"></i>قيد العمل</span>
        <span><i class="sq" style="background:var(--nobg);border:2px dashed var(--no)"></i>لم تبدأ</span>
      </div>
    </section>
  </main>
</div>

<dialog id="dlg"><div class="dlg" id="dlgBody"></div></dialog>

<script src="firebase-config.js?v=20261025q"></script>
<script src="chapters.js?v=20261025q"></script>
<script src="common.js?v=20261025q"></script>
<script>
(() => {
  /* Units in the first term of a subject and grade, when chapters.js does not list all of them yet: 'grade.subject': number.
     Example: 'g1.arabic': 6. The larger of this number and the units listed in chapters.js is used. */
  const PLAN = {};

  const GRADES = [['g1', 'الأول الابتدائي'], ['g2', 'الثاني الابتدائي'], ['g3', 'الثالث الابتدائي'], ['g4', 'الرابع الابتدائي'], ['g5', 'الخامس الابتدائي'], ['g6', 'السادس الابتدائي'],
                  ['p1', 'الأول الإعدادي'], ['p2', 'الثاني الإعدادي'], ['p3', 'الثالث الإعدادي']];
  const SUBJ = window.SUBJECTS || [], CH = window.CHAPTERS || [];
  const sub = c => c.subject || 'science', gr = c => c.grade || 'g5';
  const lng = s => s.lang || { lang: 'en', ar: 'ar' };
  const shared = s => lng(s).lang === lng(s).ar;          // one book for both tracks
  const fileOf = (c, s, t) => (lng(s)[t] === 'ar' ? c.questionsAr : c.questions) || null;
  const st = (c, s, t) => fileOf(c, s, t) ? (c.ready ? 'ok' : 'wip') : 'no';

  function cellData(g, s) {
    const list = CH.filter(c => gr(c) === g && sub(c) === s.id).sort((a, b) => (a.n || 0) - (b.n || 0));
    const total = Math.max(list.length, PLAN[g + '.' + s.id] || 0);
    const tracks = (shared(s) ? [['lang', 'المساران']] : [['lang', 'لغات'], ['ar', 'عربي']])
      .map(([t, label]) => ({ t, label, units: list.map(c => ({ c, st: st(c, s, t) })) }));
    tracks.forEach(x => x.done = x.units.filter(u => u.st === 'ok').length);
    return { list, total, tracks };
  }

  // summary per track (a shared book counts for both tracks)
  const sum = { lang: [0, 0], ar: [0, 0] };
  GRADES.forEach(([g]) => SUBJ.forEach(s => {
    const d = cellData(g, s); if (!d.total) return;
    ['lang', 'ar'].forEach(t => { const tr = d.tracks.find(x => x.t === t) || d.tracks[0]; sum[t][0] += tr.done; sum[t][1] += d.total; });
  }));
  const pct = (a, b) => b ? Math.round(a / b * 100) : 0;
  document.getElementById('big').innerHTML = [['lang', 'مسار اللغات'], ['ar', 'المسار العربي']].map(([t, n]) =>
    `<div class="s"><div class="k">${n}: الوحدات المنشورة</div><div class="v">${sum[t][0]} <small>من ${sum[t][1]} (${pct(...sum[t])}%)</small></div><div class="bar"><i style="width:${pct(...sum[t])}%"></i></div></div>`).join('');

  // the table
  const head = `<tr><th></th>${SUBJ.map(s => `<th>${s.icon || ''} ${s.titleAr}</th>`).join('')}</tr>`;
  const body = GRADES.map(([g, name]) => {
    const cells = SUBJ.map(s => {
      const d = cellData(g, s);
      if (!d.total) return `<td><div class="cell none">لم يبدأ</div></td>`;
      const full = d.tracks.every(x => x.done === d.total);
      return `<td><button class="cell${full ? ' full' : ''}" data-g="${g}" data-s="${s.id}">${d.tracks.map(x =>
        `<span class="ln">${x.label}<span class="mini"><i style="width:${pct(x.done, d.total)}%"></i></span><b>${x.done}/${d.total}</b></span>`).join('')}</button></td>`;
    }).join('');
    const any = SUBJ.some(s => cellData(g, s).list.some(c => c.ready));
    return `<tr><th class="g">${name}${any ? '' : '<small>لم نبدأ بعد</small>'}</th>${cells}</tr>`;
  }).join('');
  document.getElementById('m').innerHTML = head + body;

  // a cell: the unit numbers of each track, each one opens the unit
  const dlg = document.getElementById('dlg');
  document.getElementById('m').addEventListener('click', e => {
    const b = e.target.closest('button.cell'); if (!b) return;
    const s = SUBJ.find(x => x.id === b.dataset.s), g = b.dataset.g, d = cellData(g, s);
    const gname = GRADES.find(x => x[0] === g)[1];
    const sq = (u, t, i) => u.st === 'no'
      ? `<span class="u no" title="لم تبدأ">${u.c.n || i + 1}</span>`
      : `<a class="u ${u.st}" href="quiz.html#preview${lng(s)[t] === 'ar' ? '&lang=ar' : '&lang=en'}" data-ch="${u.c.id}" data-g="${g}" data-t="${t}" title="${u.st === 'ok' ? 'منشورة' : 'قيد العمل'}">${u.c.n || i + 1}</a>`;
    const extra = Math.max(0, d.total - d.list.length);
    document.getElementById('dlgBody').innerHTML = `<h3>${s.icon || ''} ${s.titleAr} · ${gname}</h3>
      ${d.tracks.map(x => `<div><div class="trk">${x.label}: ${x.done} من ${d.total}</div><div class="units">${x.units.map((u, i) => sq(u, x.t, i)).join('')}${
        Array.from({ length: extra }, (_, i) => `<span class="u no">${d.list.length + i + 1}</span>`).join('')}</div></div>`).join('')}
      <p class="hint">اضغط رقم الوحدة لتراجع أسئلتها.</p>
      <button class="btn close" type="button" style="align-self:flex-start">إغلاق</button>`;
    dlg.showModal();
  });
  dlg.addEventListener('click', e => {
    if (e.target === dlg || e.target.closest('.close')) return dlg.close();
    const a = e.target.closest('a.u'); if (!a) return;
    // the preview needs a player of that grade and track, and the unit chosen
    const want = { name: 'Admin', grade: a.dataset.g, track: a.dataset.t };
    const all = SI.players ? SI.players() : {};
    const id = Object.keys(all).find(k => all[k].name === want.name && all[k].grade === want.grade && all[k].track === want.track);
    if (id && SI.usePlayer) SI.usePlayer(id); else SI.addPlayer(want);   // one Admin player per grade and track, reused
    SI.setChapter(a.dataset.ch);
  });
})();
</script>
</body>
</html>
