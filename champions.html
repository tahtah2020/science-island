<style>
/* «نجوم متفوّق» (7 Nov 2026): evening sky, golden pyramid, three boards, badges, level rings, team goal, «مكانك» bar, photos after approval */
body{background:linear-gradient(180deg,#132b45 0%,#1f4a6e 45%,#2f6f95 100%);min-height:100svh}
.sky{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.sky i{position:absolute;width:3px;height:3px;border-radius:50%;background:#fff;opacity:.7;animation:tw 3s ease-in-out infinite}
.sky i.b{width:5px;height:5px;box-shadow:0 0 8px #fff7c9;background:#fff7c9}
@keyframes tw{0%,100%{opacity:.25;transform:scale(.8)}50%{opacity:1;transform:scale(1.15)}}
.app{position:relative;z-index:1;padding-bottom:120px}
.top .brand h1{color:#fff}.top .brand p{color:#cfe6f5}
.wrap{max-width:760px;width:100%;margin:0 auto;display:flex;flex-direction:column;gap:14px}

.hero{display:flex;align-items:center;gap:12px;color:#fff}
.hero svg{width:78px;height:auto;flex:none;filter:drop-shadow(0 6px 10px rgba(0,0,0,.25))}
.hero h2{margin:0;font-size:26px;font-weight:900}
.hero p{margin:2px 0 0;font-weight:800;color:#d7ecf8;font-size:15px}

.tabs{display:flex;gap:6px;background:rgba(255,255,255,.12);padding:5px;border-radius:999px}
.tabs button{flex:1;border:0;background:transparent;color:#e3f2fb;font:inherit;font-weight:900;font-size:15px;padding:10px 6px;border-radius:999px;cursor:pointer;min-height:44px}
.tabs button[aria-selected="true"]{background:#f2b134;color:#1f3d57;box-shadow:0 3px 0 #c98c10}
.tabs button:focus-visible{outline:3px solid #fff;outline-offset:2px}
.tabInfo{margin:-2px 0 22px;position:relative;z-index:2;text-align:center;font:800 13.5px "Cairo","Nunito",sans-serif;color:#e3f2fb}
.near{padding:14px 16px}
.near h3{margin:0 0 8px;font:900 17px "Cairo","Nunito",sans-serif;color:var(--navy)}
.near ol{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.near li{display:grid;grid-template-columns:44px 40px 1fr auto;align-items:center;gap:8px;background:rgba(35,121,159,.07);border-radius:14px;padding:6px 10px}
.near li.me{background:#ffe9a0;box-shadow:inset 0 0 0 2px #f2b134}
.near .r{font:900 17px "Nunito",sans-serif;color:var(--navy);text-align:center}
.near .av{width:40px;height:40px;font-size:18px}
.near .nm{font:900 15px "Cairo","Nunito",sans-serif;color:var(--navy);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.near .nt{font:800 12.5px "Cairo",sans-serif;color:var(--ink)}
.near .sc{font:900 16px "Nunito",sans-serif;color:var(--primary-d)}

/* avatar + level ring */
.av{--s:48px;width:var(--s);height:var(--s);border-radius:50%;flex:none;display:grid;place-items:center;font-weight:900;color:#fff;font-size:calc(var(--s)*.42);position:relative;background:var(--c,#7fb7d6);border:3px solid #fff;box-shadow:0 0 0 3px var(--ring,transparent)}
.av img{width:100%;height:100%;border-radius:50%;object-fit:cover;display:block}
.av.t2{--ring:#c98a52}.av.t3{--ring:#b7c4ce}.av.t4{--ring:#f2b134}
.av.t5{box-shadow:0 0 0 3px #7fe3ff,0 0 12px 2px rgba(127,227,255,.75)}
.av .pend{position:absolute;bottom:-4px;inset-inline-end:-6px;font-size:12px;background:#f2b134;border-radius:999px;padding:1px 5px;color:#1f3d57;border:2px solid #fff}


/* «الهرم الذهبي» (owner's choice, 7 Nov 2026): the top 10 sit on a pyramid of 4 rows (1 + 2 + 3 + 4); #1 on the golden capstone */
.pyr{position:relative;width:100%;max-width:760px;margin:6px auto 0;aspect-ratio:1024/765;container-type:inline-size;transition:opacity .2s;border-radius:22px;overflow:hidden;box-shadow:0 10px 30px rgba(0,0,0,.35)}
.pyr>img.bg{position:absolute;inset:0;width:100%;height:100%;display:block}
.slot .mini{display:none;color:#fff3c4}
@media (max-width:600px){.slot .sc{display:none}.slot .rk{font-size:10px;min-width:18px;height:18px}}
.pyr>svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.cap-shine{animation:shine 3.2s ease-in-out infinite}
@keyframes shine{0%,100%{opacity:.15}50%{opacity:.75}}
.slot{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:2px;width:var(--w);border:0;background:none;padding:0;cursor:pointer;font:inherit;color:#fff;animation:climb .7s cubic-bezier(.3,1.4,.5,1) both}
@keyframes climb{from{transform:translate(-50%,40%);opacity:0}to{transform:translate(-50%,-50%);opacity:1}}
.slot .av{--s:var(--a)}
.slot .nm{font-weight:900;font-size:var(--f);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-shadow:0 2px 3px rgba(60,30,0,.7)}
.slot .sc{font-weight:900;font-size:calc(var(--f)*.9);color:#fff3c4;background:rgba(80,45,10,.55);border-radius:999px;padding:0 8px;font-variant-numeric:tabular-nums}
.slot .rk{position:absolute;top:-4px;inset-inline-start:calc(50% - var(--a)/2 - 10px);background:#1f3d57;color:#fff;border:2px solid #f2b134;border-radius:999px;font-size:11px;font-weight:900;min-width:22px;height:22px;display:grid;place-items:center;z-index:2}
.slot.me .av{box-shadow:0 0 0 3px #2e9e6b,0 0 14px 3px rgba(46,158,107,.9)}
.slot.me .nm::after{content:attr(data-you);font-size:10px;background:#2e9e6b;color:#fff;border-radius:999px;padding:0 6px;margin-inline-start:4px;vertical-align:1px;text-shadow:none}
.slot.empty .av{background:rgba(255,255,255,.18);border-style:dashed;color:#fff6d8}
.slot:focus-visible{outline:3px solid #fff;outline-offset:3px;border-radius:14px}
.slot .crown{position:absolute;top:calc(var(--a)*-.55);width:calc(var(--a)*.62);left:50%;transform:translateX(-50%);z-index:3;animation:crown 1s cubic-bezier(.3,1.5,.5,1) 1.4s both}
.pyrReesho{position:absolute;width:15%;top:3%;right:8%;z-index:2;animation:fly 3.5s ease-in-out infinite;filter:drop-shadow(0 6px 8px rgba(0,0,0,.3))}
@keyframes fly{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-10px) rotate(3deg)}}
.det .bdg{justify-content:center}
.det .bdg span{font-size:13px}
.det .av{--s:96px}
.det .big{font-size:26px;font-weight:900;color:#1b6182}
.flyR{position:fixed;z-index:45;pointer-events:none;filter:drop-shadow(0 8px 12px rgba(0,0,0,.35))}
.spark{position:fixed;z-index:46;pointer-events:none;width:12px;height:12px;margin:-6px 0 0 -6px;background:radial-gradient(circle,#fff7c9 0 35%,#f2b134 36% 60%,transparent 61%);border-radius:50%}
.flyTag{position:fixed;z-index:46;pointer-events:none;transform:translate(-50%,-100%);background:#f2b134;color:#1f3d57;font-weight:900;font-size:15px;border-radius:999px;padding:3px 12px;border:2px solid #fff;white-space:nowrap;box-shadow:0 4px 10px rgba(0,0,0,.3)}
@media (prefers-reduced-motion:reduce){.slot,.slot .crown,.pyrReesho,.cap-shine{animation:none}}
/* podium */
.podium{position:relative;display:grid;grid-template-columns:1fr 1.15fr 1fr;align-items:end;gap:8px;margin-top:18px;transition:opacity .2s}
.podium .pyrReesho{width:62px;top:-46px;right:-6px}
button.pd{border:0;background:none;font:inherit;padding:0;cursor:pointer;color:inherit}
button.pd:focus-visible,.row:focus-visible{outline:3px solid #fff;outline-offset:3px;border-radius:16px}
.row{cursor:pointer}
.pd{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;min-width:0}
.pd .nm{color:#fff;font-weight:900;font-size:16px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pd .sc{color:#ffe7a6;font-weight:900;font-size:15px;font-variant-numeric:tabular-nums}
.pd .step{width:100%;border-radius:16px 16px 6px 6px;display:grid;place-items:center;font-weight:900;font-size:30px;color:#1f3d57;box-shadow:inset 0 -6px 0 rgba(0,0,0,.12)}
.pd.p1 .step{height:118px;background:linear-gradient(#ffe08a,#f2b134)}
.pd.p2 .step{height:86px;background:linear-gradient(#eef3f7,#c4d1da)}
.pd.p3 .step{height:66px;background:linear-gradient(#f7d9bf,#d9a477)}
.pd.p1 .av{--s:76px}.pd.p2 .av,.pd.p3 .av{--s:58px}
.pd .crownWrap{position:relative}
.pd .crown{position:absolute;left:50%;top:-30px;width:46px;transform:translateX(-50%);animation:crown 1s cubic-bezier(.3,1.5,.5,1) .3s both}
@keyframes crown{from{transform:translate(-50%,-60px) rotate(-25deg);opacity:0}to{transform:translateX(-50%);opacity:1}}
.pd.me .nm::after,.row.me .nm::after{content:attr(data-you);font-size:11px;background:#2e9e6b;color:#fff;border-radius:999px;padding:1px 7px;margin-inline-start:6px;vertical-align:2px}
.pd .bdg{justify-content:center}

/* rows 4-10 */
.list{list-style:none;margin:0;padding:12px;display:flex;flex-direction:column;gap:8px;background:var(--card);border-radius:22px}
.row{display:grid;grid-template-columns:30px auto minmax(0,1fr) auto;align-items:center;gap:10px;background:#fff;border:2px solid var(--line);border-radius:16px;padding:8px 12px}
.row.me{border-color:#2e9e6b;box-shadow:0 0 0 3px rgba(46,158,107,.2)}
.row .r{font-weight:900;font-size:20px;text-align:center;font-variant-numeric:tabular-nums}
.row .av{--s:44px}
.row .who{min-width:0}
.row .nm{font-weight:900;font-size:17px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .sc{font-weight:900;font-size:18px;color:var(--primary-d);font-variant-numeric:tabular-nums;text-align:end}
.row .gap{display:block;font-size:11.5px;font-weight:800;color:var(--ink)}
.bar{height:6px;border-radius:9px;background:#e3eef4;overflow:hidden;margin-top:4px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#8fd3ee,#23799f);border-radius:9px}
.bdg{display:flex;flex-wrap:wrap;gap:4px;margin-top:3px}
.bdg span{font-size:11.5px;font-weight:800;background:#fff4d6;color:#7a5200;border-radius:999px;padding:1px 8px;white-space:nowrap}
.pd .bdg span{background:rgba(255,255,255,.16);color:#fff3cf}
.empty{text-align:center;font-weight:800;color:#e3f2fb;padding:22px 8px}

/* team goal */
.team{display:flex;gap:12px;align-items:center}
.team h3{margin:0;font-size:18px;font-weight:900}
.team p{margin:2px 0 6px;font-size:14px;font-weight:700;color:var(--ink)}
.team .big{height:14px;border-radius:9px;background:#e3eef4;overflow:hidden}
.team .big i{display:block;height:100%;background:linear-gradient(90deg,#f7d36b,#f2b134);transition:width 1.2s}
.team .num{font-size:13px;font-weight:900;margin-top:4px;font-variant-numeric:tabular-nums}
.team .gift{font-size:40px;flex:none}

/* «مكانك» bar */
.mebar{position:fixed;z-index:20;left:50%;transform:translateX(-50%);bottom:calc(10px + env(safe-area-inset-bottom,0px));width:min(760px,calc(100% - 20px));
  background:#fff8ea;border:3px solid #f2b134;border-radius:22px;padding:8px 12px;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;box-shadow:0 10px 30px rgba(0,0,0,.35)}
.mebar .avBtn{border:0;background:none;padding:0;cursor:pointer;position:relative}
.mebar .avBtn .cam{position:absolute;bottom:-3px;inset-inline-start:-5px;background:#23799f;color:#fff;border-radius:50%;width:22px;height:22px;display:grid;place-items:center;font-size:12px;border:2px solid #fff}
.mebar .av{--s:50px}
.mebar .t1{font-weight:900;font-size:15px}
.mebar .t2{font-weight:800;font-size:13px;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mebar .rk{font-weight:900;font-size:26px;color:#1f3d57;font-variant-numeric:tabular-nums;text-align:center;line-height:1}
.mebar .rk small{display:block;font-size:11px;color:var(--ink)}

/* photo sheet + celebration */
.veil{position:fixed;inset:0;z-index:50;background:rgba(10,25,40,.6);display:grid;place-items:center;padding:16px}
.sheet{background:#fff8ea;border-radius:24px;padding:18px;max-width:420px;width:100%;text-align:center;display:flex;flex-direction:column;gap:12px;align-items:center}
.sheet h3{margin:0;font-size:21px;font-weight:900}
.sheet p{margin:0;font-weight:700;color:var(--ink);font-size:14.5px}
.sheet .prev{--s:130px}
.sheet .btns{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.sheet .btn{font-size:16px;min-height:46px;padding:10px 16px}
.sheet .msg{font-weight:900;color:#1b6182;min-height:20px}
.cel{text-align:center;color:#fff}
.cel img{width:170px;animation:pop .6s cubic-bezier(.3,1.6,.5,1)}
.cel h3{font-size:30px;margin:6px 0;font-weight:900}
.cel p{font-size:18px;font-weight:800;margin:0 0 14px}
@keyframes pop{from{transform:scale(.3)}to{transform:scale(1)}}
.conf{position:fixed;top:-20px;width:10px;height:14px;border-radius:3px;z-index:60;pointer-events:none;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
@media (prefers-reduced-motion:reduce){.sky i,.pd .crown,.cel img,.conf{animation:none}.conf{display:none}}
@media (max-width:520px){
  .hero svg{width:60px}.hero h2{font-size:21px}.hero p{font-size:13.5px}
  .tabs button{font-size:13px}
  .pd .nm{font-size:14px}.pd.p1 .av{--s:62px}.pd.p2 .av,.pd.p3 .av{--s:50px}
  .pd.p1 .step{height:96px}.pd.p2 .step{height:70px}.pd.p3 .step{height:54px}
  .row{grid-template-columns:24px auto minmax(0,1fr) auto;gap:8px;padding:7px 9px}.row .av{--s:38px}.row .nm{font-size:15px}
}
</style>

<script>
(async () => {
  'use strict';
  const me = SI.requirePlayer(); if (!me) return;
  SI.applyTheme();
  const $ = s => document.querySelector(s), T = SI.T, G = SI.G, esc = SI.esc, LB = SI.LB;
  if (SI.isAr()) document.title = 'نجوم متفوّق · متفوّق';
  const TEAM_GOAL = 5000;   // everybody's points this week together → Reesho wears the party hat

  /* twinkling sky */
  const sky = $('#sky'); for (let i = 0; i < 70; i++) { const s = document.createElement('i'); if (i % 9 === 0) s.className = 'b'; s.style.cssText = `left:${Math.random() * 100}%;top:${Math.random() * 70}%;animation-delay:${(Math.random() * 3).toFixed(2)}s`; sky.appendChild(s); }

  $('#lead').textContent = T('Every point counts: quests, games, adventures, Daily 5 and Review.', 'كل نقطة بتتحسب: التحديات والألعاب والمغامرات والأسئلة اليومية والمراجعة.');
  const INFO = {
    wgrade: T(`This week’s points, ${SI.gradeName()} only. A new race starts every Saturday: your points are always kept in the Hall of fame.`,
      `نقاط الأسبوع ده لطلاب ${SI.gradeName()} بس. السباق بيبدأ من جديد كل سبت، ونقاطك كلها محفوظة في لوحة الشرف.`),
    week: T('This week’s points, all grades. A new race every Saturday.', 'نقاط الأسبوع ده لكل الصفوف. سباق جديد كل سبت.'),
    all: T('All the points since the start. They are never deleted.', 'كل النقاط من أول يوم. ما بتتمسحش أبدًا.')
  };
  const youTxt = T('YOU', SI.G('أنت', 'أنتِ'));

  /* avatars: approved photo for everybody, my own photo for me on this device, else my initial on a colour */
  const COLORS = ['#e2603f', '#23799f', '#2e9e6b', '#8a6fd1', '#e0912f', '#d4507a', '#3f9fb5', '#6c8f2f'];
  const colorOf = n => { let h = 0; for (const ch of String(n)) h = (h * 31 + ch.codePointAt(0)) | 0; return COLORS[Math.abs(h) % COLORS.length]; };
  const tierOf = lvl => lvl >= 5 ? 't5' : lvl === 4 ? 't4' : lvl === 3 ? 't3' : lvl === 2 ? 't2' : '';
  let myId = await LB.myId(), cards = {}, photos = {};
  const mine = () => LB.myPhoto();
  function avatar(r, extra = '') {
    const c = cards[r.id] || {}, lvl = c.lvl || SI.levelInfo(r.score || 0).n, own = r.id === myId && mine();
    const src = own && own.data && own.st !== 'no' ? own.data : photos[r.id];
    const pend = own && own.st === 'pending' ? '<span class="pend" title="waiting">⏳</span>' : '';
    const inner = src ? `<img src="${esc(src)}" alt="">` : esc([...String(r.name || '?')][0] || '?');
    return `<span class="av ${tierOf(lvl)} ${extra}" style="--c:${colorOf(r.name)}">${inner}${pend}</span>`;
  }
  const badgesOf = (r, kind, i) => {
    const c = cards[r.id] || {}, list = LB.badgeList(c.bdg, c.g);
    return list.length ? `<div class="bdg">${list.slice(0, 3).map(b => `<span>${esc(b.t)}</span>`).join('')}</div>` : '';
  };
  const CROWN = `<svg class="crown" viewBox="-62 -76 124 88" aria-hidden="true"><path d="M-52 6 L-58 -52 L-27 -26 L0 -66 L27 -26 L58 -52 L52 6Z" fill="#f2b134" stroke="#c98c10" stroke-width="4" stroke-linejoin="round"/><rect x="-52" y="-6" width="104" height="14" rx="5" fill="#e09a14" stroke="#c98c10" stroke-width="3"/><circle cx="-58" cy="-54" r="7" fill="#e2603f"/><circle cx="0" cy="-68" r="8" fill="#23799f"/><circle cx="58" cy="-54" r="7" fill="#2e9e6b"/></svg>`;

  let kind = 'wgrade', loadId = 0;
  async function load(k) {
    kind = k; const id = ++loadId;
    document.querySelectorAll('#tabs button').forEach(b => b.setAttribute('aria-selected', String(b.dataset.k === k)));
    $('#podium').style.opacity = '.45'; $('#tabNote').hidden = true; $('#tabInfo').textContent = INFO[k] || '';
    const res = k === 'all' ? await LB.show(10) : await LB.topOf(k, 10);
    if (id !== loadId) return;
    const rows = res.rows || [], ids = rows.map(r => r.id);
    [cards, photos] = await Promise.all([LB.cards(ids), LB.photos(ids)]);
    if (id !== loadId) return;
    draw(rows, k);
    meBar(k, rows, res.online);
  }
  /* podium (owner, 7 Nov 2026: back from the pyramid, which did not fit phones): top 3 on steps, #1 in the middle with the crown,
     Reesho the explorer flies beside it; 4-10 as rows with the gap to the child above. Tap anyone = details sheet. */
  let shown = [];
  function draw(rows, k) {
    const pod = $('#podium'), list = $('#list'); pod.style.opacity = '';
    shown = rows;
    if (!rows.length) {
      pod.innerHTML = ''; list.hidden = true;
      const n = $('#tabNote'); n.hidden = false;
      n.textContent = k === 'week' || k === 'wgrade' ? T('Nobody has points this week yet. Play now and be the first!', SI.G('لسه محدش جمع نقاط الأسبوع ده. العب دلوقتي وكن الأول!', 'لسه محدش جمع نقاط الأسبوع ده. العبي دلوقتي وكوني الأولى!'))
        : k === 'grade' ? T('Your grade’s list is starting. Play to be on it!', SI.G('قائمة صفّك بتبدأ. العب علشان تكون فيها!', 'قائمة صفّك بتبدأ. العبي علشان تكوني فيها!'))
        : T('Loading the stars…', 'بنحمّل النجوم…');
      return;
    }
    pod.innerHTML = '<img class="pyrReesho" src="assets/stars/reesho_crown.webp" alt="">' + [1, 0, 2].map(i => {
      const r = rows[i]; if (!r) return '<div></div>';
      return `<button type="button" class="pd p${i + 1}${r.id === myId ? ' me' : ''}" data-i="${i}"><div class="crownWrap">${i === 0 ? CROWN : ''}${avatar(r)}</div>
        <div class="nm" data-you="${youTxt}">${esc(r.name)}</div><div class="sc">${r.score} ⭐</div>${badgesOf(r, k, i)}
        <div class="step">${['🥇', '🥈', '🥉'][i]}</div></button>`;
    }).join('');
    const rest = rows.slice(3);
    list.hidden = !rest.length;
    list.innerHTML = rest.map((r, j) => {
      const i = j + 3, up = rows[i - 1], gap = up.score - r.score;
      return `<li class="row${r.id === myId ? ' me' : ''}" data-i="${i}" tabindex="0" role="button"><span class="r">${i + 1}</span>${avatar(r)}
        <div class="who"><div class="nm" data-you="${youTxt}">${esc(r.name)}</div>${badgesOf(r, k, i)}</div>
        <div class="sc">${r.score}<span class="gap">${T(`${gap + 1} to pass #${i}`, `ناقص ${gap + 1} عن #${i}`)}</span><div class="bar"><i style="width:${Math.max(6, Math.round(100 * r.score / Math.max(1, up.score)))}%"></i></div></div></li>`;
    }).join('');
    document.querySelectorAll('#podium [data-i], #list [data-i]').forEach(el => {
      el.onclick = () => details(+el.dataset.i, k);
      el.onkeydown = e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); details(+el.dataset.i, k); } };
    });
  }
  /* tap a student: big photo, points, badges, how far from the stone above */
  function details(i, k) {
    const r = shown[i]; if (!r) return;
    $('#detAv').innerHTML = avatar(r);
    $('#detH').textContent = `#${i + 1} · ${r.name}`;
    $('#detSc').textContent = `${r.score} ⭐`;
    $('#detBdg').innerHTML = badgesOf(r, k, i) || '';
    const up = shown[i - 1];
    $('#detGap').textContent = i === 0 ? T('On the golden capstone! 👑', 'فوق القمة الذهبية! 👑') : T(`${up.score - r.score + 1} points from #${i}`, `ناقص ${up.score - r.score + 1} نقطة ويطلع مكان #${i}`);
    $('#detVeil').hidden = false; $('#detClose').focus();
  }
  $('#detClose').onclick = () => { $('#detVeil').hidden = true; };
  $('#detVeil').onclick = e => { if (e.target.id === 'detVeil') $('#detVeil').hidden = true; };

  /* «مكانك»: my avatar (tap = photo), rank on this board, points, how many to pass the child above */
  async function meBar(k, rows, online) {
    const m = await LB.meOf(k), bar = $('#mebar');
    const myRow = { id: myId, name: me.name, score: m ? m.score : 0 };
    $('#meAv').innerHTML = avatar(myRow);
    bar.hidden = false;
    if (!m) {
      $('#near').hidden = true;
      $('#meT1').textContent = me.name;
      $('#meT2').textContent = k === 'week' ? T('Earn points this week to join the list!', SI.G('اجمع نقاط الأسبوع ده وادخل القائمة!', 'اجمعي نقاط الأسبوع ده وادخلي القائمة!')) : T('Play to get on the list!', SI.G('العب علشان تدخل القائمة!', 'العبي علشان تدخلي القائمة!'));
      $('#meRk').innerHTML = '📷';
      return;
    }
    $('#meT1').textContent = T(`Your points: ${m.score}`, `نقاطك: ${m.score}`);
    $('#meT2').innerHTML = m.rank === 1 ? T('👑 You are number 1!', SI.G('👑 إنت رقم ١!', '👑 إنتي رقم ١!'))
      : m.above ? T(`${m.above.score - m.score + 1} more points to pass <b>${esc(m.above.name)}</b>!`, `باقي لك ${m.above.score - m.score + 1} نقطة وتسبق <b>${esc(m.above.name)}</b>!`) : '';
    $('#meRk').innerHTML = `#${m.rank}<small>${T('rank', 'ترتيبك')}</small>`;
    if (k === 'all') celebrate(m.rank);
    if (k !== 'all') {   // this week against last week: you race yourself too
      const lw = await LB.lastWeek();
      if (lw !== null && kind === k) $('#meT2').innerHTML += `<br>${m.score > lw ? T(`🚀 Better than last week (${lw})!`, `🚀 أحسن من الأسبوع اللي فات (${lw})!`)
        : T(`Last week: ${lw}. ${lw - m.score + 1} more to beat it!`, `الأسبوع اللي فات: ${lw}. باقي ${lw - m.score + 1} وتكسر رقمك!`)}`;
    }
    nearCard(m, rows, k);
  }

  /* «منافسينك القريبين»: when I am not in the top list, the two just above me, me, the two just below (how many points apart) */
  async function nearCard(m, rows, k) {
    const box = $('#near'), list = m && m.near;
    if (!list || list.length < 2 || rows.some(r => r.id === myId) || kind !== k) { box.hidden = true; return; }
    const at = list.findIndex(r => r.id === myId);
    Object.assign(cards, await LB.cards(list.map(r => r.id).filter(id => !cards[id])));
    $('#nearList').innerHTML = list.map((r, j) => {
      const rank = m.rank + j - at, d = r.score - m.score;
      const note = r.id === myId ? T('you', SI.G('إنت', 'إنتي')) : d > 0 ? T(`${d + 1} to pass`, `باقي ${d + 1} وتسبقه`) : T(`${-d} behind you`, `وراك بـ ${-d}`);
      return `<li class="${r.id === myId ? 'me' : ''}"><span class="r">#${rank}</span>${avatar(r)}<div style="min-width:0"><div class="nm">${esc(r.name)}</div><div class="nt">${note}</div></div><span class="sc">${r.score}</span></li>`;
    }).join('');
    box.hidden = false;
  }

  /* climbed since the last visit → confetti + Reesho */
  function celebrate(rank) {
    const key = 'si.rank.' + me.id; let last = 0; try { last = +localStorage.getItem(key) || 0; localStorage.setItem(key, String(rank)); } catch (e) {}
    if (!last || rank >= last) return;
    $('#celH').textContent = T(`You climbed to #${rank}!`, SI.G(`طلعت المركز ${rank}!`, `طلعتي المركز ${rank}!`));
    $('#celP').textContent = T(`You were #${last}. Keep going!`, SI.G(`كنت #${last}. كمّل كده!`, `كنتي #${last}. كمّلي كده!`));
    $('#celVeil').hidden = false; SI.voice('champion'); climbed = rank;
    const cs = ['#f2b134', '#e2603f', '#2e9e6b', '#23799f', '#8fd3ee', '#d4507a'];
    for (let i = 0; i < 60; i++) { const c = document.createElement('i'); c.className = 'conf'; c.style.cssText = `left:${Math.random() * 100}vw;background:${cs[i % cs.length]};animation-duration:${2 + Math.random() * 2}s;animation-delay:${Math.random() * .8}s`; document.body.appendChild(c); setTimeout(() => c.remove(), 5000); }
    $('#celOk').focus();
  }
  $('#celOk').onclick = () => { $('#celVeil').hidden = true; if (climbed) { const r = climbed; climbed = 0; setTimeout(() => flyCrown(r), 250); } };

  /* after a climb: Reesho flies with the crown from the capstone to the child's stone (or to his avatar in the «مكانك» bar
     when he is not in the top 10), sparkles fall on him, then Reesho flies back to the capstone */
  let climbed = 0;
  async function flyCrown(rank) {
    const home = document.querySelector('.pyrReesho');
    const target = document.querySelector('.pd.me .av, .row.me .av') || document.querySelector('#meAv .av');
    if (!home || !target || matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    target.scrollIntoView({ block: 'center', behavior: 'smooth' }); await new Promise(r => setTimeout(r, 500));
    const a = home.getBoundingClientRect(), b = target.getBoundingClientRect();
    const w = Math.max(70, a.width * 1.2), h = w * 420 / 295;
    const img = document.createElement('img'); img.src = home.src; img.alt = ''; img.className = 'flyR';
    img.style.cssText = `left:${a.left}px;top:${a.top}px;width:${w}px`;
    document.body.appendChild(img); home.style.visibility = 'hidden';
    const tx = b.left + b.width / 2 - w / 2 - a.left, ty = b.top - h * .78 - a.top;   // the crown just above the child's head
    const mid = { x: tx / 2, y: Math.min(0, ty) / 2 - 90 };
    await img.animate([
      { transform: 'translate(0,0) rotate(0) scale(1)' },
      { transform: `translate(${mid.x}px,${mid.y}px) rotate(-12deg) scale(1.15)`, offset: .5 },
      { transform: `translate(${tx}px,${ty}px) rotate(0) scale(1)` }
    ], { duration: 1600, easing: 'ease-in-out', fill: 'forwards' }).finished;
    /* hover over the child, sparkles, a little tag, the avatar bounces */
    SI.voice('champion');
    const cx = b.left + b.width / 2, cy = b.top + b.height / 2;
    for (let i = 0; i < 16; i++) {
      const sp = document.createElement('i'); sp.className = 'spark'; sp.style.left = cx + 'px'; sp.style.top = (b.top - 10) + 'px'; document.body.appendChild(sp);
      const ang = Math.PI * (0.15 + 0.7 * Math.random()), d = 40 + Math.random() * 50;
      sp.animate([{ transform: 'translate(0,0) scale(1)', opacity: 1 }, { transform: `translate(${Math.cos(ang) * d * (i % 2 ? 1 : -1)}px,${Math.sin(ang) * d}px) scale(.3)`, opacity: 0 }], { duration: 900 + Math.random() * 400, easing: 'ease-out', fill: 'forwards' }).finished.then(() => sp.remove());
    }
    const tag = document.createElement('div'); tag.className = 'flyTag'; tag.textContent = T(`⬆ #${rank}`, `⬆ المركز ${rank}`);
    tag.style.left = cx + 'px'; tag.style.top = Math.max(60, b.top - h * .78) + 'px';   // above Reesho's crown document.body.appendChild(tag);
    tag.animate([{ opacity: 0, transform: 'translate(-50%,-60%)' }, { opacity: 1, transform: 'translate(-50%,-100%)' }], { duration: 400, fill: 'forwards' });
    target.animate([{ transform: 'scale(1)' }, { transform: 'scale(1.25)' }, { transform: 'scale(1)' }], { duration: 700, easing: 'ease-in-out', iterations: 2 });
    await img.animate([{ transform: `translate(${tx}px,${ty}px)` }, { transform: `translate(${tx}px,${ty - 8}px)` }, { transform: `translate(${tx}px,${ty}px)` }], { duration: 700, iterations: 2 }).finished;
    /* back to the capstone */
    await img.animate([{ transform: `translate(${tx}px,${ty}px) scale(1)` }, { transform: `translate(${mid.x}px,${mid.y}px) rotate(10deg) scale(1.1)`, offset: .5 }, { transform: 'translate(0,0) scale(1)' }], { duration: 1400, easing: 'ease-in-out', fill: 'forwards' }).finished;
    img.remove(); home.style.visibility = '';
    setTimeout(() => tag.remove(), 1800);
  }

  /* team goal: everybody's points this week; reached → Reesho wears the party hat */
  (async () => {
    const t = await LB.weekTotal(); if (t === null) return;
    const pct = Math.min(100, Math.round(100 * t / TEAM_GOAL)), done = t >= TEAM_GOAL;
    $('#teamTxt').textContent = done ? T('We did it! Reesho put on his party hat this week. 🎉', 'عملناها! ريشو لبس قبعة الحفلة الأسبوع ده. 🎉')
      : T(`If all of us together reach ${TEAM_GOAL} points this week, Reesho wears his party hat!`, `لو جمعنا كلنا ${TEAM_GOAL} نقطة الأسبوع ده، ريشو يلبس قبعة الحفلة!`);
    $('#teamNum').textContent = `${t} / ${TEAM_GOAL}`;
    $('#team').hidden = false; requestAnimationFrame(() => { $('#teamBar').style.width = pct + '%'; });
    const hat = (window.WARDROBE || []).find(w => w.id === 'party');
    if (done && hat) $('#hat').innerHTML = `<g transform="translate(${hat.at[0]} ${hat.at[1]}) rotate(${hat.at[2]})">${hat.svg}</g>`;
  })();

  /* photo: cropped to a square in the browser, about 10 KB, shown to everybody only after the owner approves it */
  let pending = null;
  function openPhoto() {
    const own = mine(), st = own && own.st;
    pending = null; $('#phSend').hidden = true; $('#phMsg').textContent = '';
    $('#phDel').hidden = !(own && own.data);
    $('#phPrev').innerHTML = own && own.data ? `<img src="${esc(own.data)}" alt="">` : esc([...me.name][0] || '?');
    $('#phPrev').style.setProperty('--c', colorOf(me.name));
    $('#phInfo').textContent = st === 'pending' ? T('Your photo is being reviewed: it will be approved within 24 hours. Only you can see it now.', SI.G('صورتك بتتراجع، وهتتم الموافقة عليها خلال 24 ساعة. إنت بس اللي شايفها دلوقتي.', 'صورتك بتتراجع، وهتتم الموافقة عليها خلال 24 ساعة. إنتي بس اللي شايفاها دلوقتي.'))
      : st === 'ok' ? T('Your photo is approved: everybody can see it. ✓', 'صورتك اتوافق عليها: الكل شايفها. ✓')
      : st === 'no' ? T('That photo was not approved. Try another one.', 'الصورة دي ما اتقبلتش. جرّب صورة تانية.')
      : T('Choose a photo of your face or a drawing you love. We review every photo and approve it within 24 hours; then everybody sees it.', SI.G('اختار صورة لوشّك أو رسمة بتحبها. كل صورة بنراجعها ونوافق عليها خلال 24 ساعة، وبعدها الكل يشوفها.', 'اختاري صورة لوشّك أو رسمة بتحبيها. كل صورة بنراجعها ونوافق عليها خلال 24 ساعة، وبعدها الكل يشوفها.'));
    $('#photoVeil').hidden = false; $('#phPick').focus();
  }
  $('#avBtn').onclick = openPhoto;
  $('#phClose').onclick = () => { $('#photoVeil').hidden = true; };
  $('#phPick').onclick = () => $('#phFile').click();
  $('#phFile').onchange = async e => {
    const f = e.target.files && e.target.files[0]; e.target.value = ''; if (!f) return;
    try {
      const url = URL.createObjectURL(f), img = new Image();
      await new Promise((ok, no) => { img.onload = ok; img.onerror = no; img.src = url; });
      const S = 160, cv = document.createElement('canvas'); cv.width = cv.height = S;
      const side = Math.min(img.naturalWidth, img.naturalHeight), sx = (img.naturalWidth - side) / 2, sy = (img.naturalHeight - side) / 2;
      const ctx = cv.getContext('2d'); ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, S, S); ctx.drawImage(img, sx, sy, side, side, 0, 0, S, S);
      URL.revokeObjectURL(url);
      let data = cv.toDataURL('image/webp', .8); if (!/^data:image\/webp/.test(data)) data = cv.toDataURL('image/jpeg', .82);
      pending = data; $('#phPrev').innerHTML = `<img src="${data}" alt="">`; $('#phSend').hidden = false; $('#phSend').focus();
      $('#phMsg').textContent = '';
    } catch (err) { $('#phMsg').textContent = T('Could not open this photo. Try another one.', 'مقدرناش نفتح الصورة دي. جرّب صورة تانية.'); }
  };
  $('#phSend').onclick = async () => {
    if (!pending) return; $('#phSend').disabled = true;
    const r = await LB.sendPhoto(pending); $('#phSend').disabled = false;
    $('#phMsg').textContent = r.ok ? T('Sent! ✓ We will review it and approve it within 24 hours.', 'اتبعتت! ✓ هنراجعها ونوافق عليها خلال 24 ساعة، وبعدها تظهر للكل.') : T('Saved on this device. Sending did not work now: try again later.', 'اتحفظت على الجهاز ده. الإرسال ما نفعش دلوقتي: جرّب تاني بعدين.');
    $('#phSend').hidden = true; $('#phDel').hidden = false; pending = null;
    $('#meAv').innerHTML = avatar({ id: myId, name: me.name, score: 0 }); load(kind);
  };
  $('#phDel').onclick = async () => {
    await LB.sendPhoto(''); $('#phPrev').innerHTML = esc([...me.name][0] || '?'); $('#phDel').hidden = true;
    $('#phMsg').textContent = T('Removed.', 'اتشالت.'); load(kind);
  };
  document.addEventListener('keydown', e => { if (e.key === 'Escape') { $('#detVeil').hidden = true; $('#photoVeil').hidden = true; $('#celVeil').hidden = true; } });

  document.querySelectorAll('#tabs button').forEach(b => { b.onclick = () => load(b.dataset.k); });
  LB.photoStatus().catch(() => {});
  load('wgrade');
})();
</script>
</body>
</html>
