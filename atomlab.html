<script>
(() => {
'use strict';
/* Atom Lab · the game of Prep 1, Unit 1 "The Matter". Built on the shared game kit (game_kit.js).
   Stage 1 (Warm Up): build an atom of sodium: the nucleus, Z and A, the neutrons (A − Z), the electrons, then fill the energy levels K, L, M (book pages 3-8).
   Stage 2 (Missions): 1) find the place of Na, Cl and Ne in the periodic table from their electron configuration (pages 13-15);
                       2) sodium chloride (ionic bond) and hydrogen chloride (single covalent bond), then O=O and N≡N (pages 26-30);
                       3) physical or chemical property? (pages 22-23)
   Stage 3 (Speed Round): element, compound or mixture? (pages 19-21)
   Every T('English', 'عربي') has both languages. The Arabic science sentences follow the Arabic school book.
   Symbols, formulas and electron configurations stay left to right (ltr) inside Arabic sentences. */
const A = window.P1ART, at = A.at, f1 = A.f1, T = SI.T, G = SI.G;
const P = (m, f) => G(m, f || m);   // Arabic for a boy / for a girl
const ltr = s => '⁦' + s + '⁩';
const L = (x, y, s, o) => A.ltrText(x, y, s, o);
const W = (x, y, s, o) => A.label(x, y, s, o);
const rr = (x, y, w, h, rx = 10) => `<rect class="ring" x="${f1(x)}" y="${f1(y)}" width="${f1(w)}" height="${f1(h)}" rx="${rx}"/>`;
const BG = '#eef6fb';
const pill = (x, y, s, fill = '#ffffff') => `<rect x="${f1(x - 11)}" y="${f1(y - 11)}" width="22" height="22" rx="11" fill="${fill}" stroke="#8fbfe0" stroke-width="2"/>${L(x, y + 5, s, { fs: 13 })}`;

/* an atom drawn from its levels. slots: how many places each level has (default: its electrons); omit: [[level, place], …] left empty;
   rings: how many levels are drawn; nuc: false hides the nucleus; seat: [level, place] drawn as an empty dashed place */
function atomG(levels, o, x = {}) {
  const slots = x.slots || levels, nr = A.nucleusR(o.p, o.n, o.b), r0 = Math.max(o.r0 || 30, nr + 10), dr = o.dr || 20;
  const nRings = x.rings != null ? x.rings : levels.length;
  let s = '';
  for (let i = 0; i < nRings; i++) s += `<circle r="${f1(r0 + i * dr)}" fill="none" stroke="${A.COL.orbit}" stroke-width="${x.hi === i ? 4 : 2}"/>`;
  if (x.nuc !== false) s += A.nucleus(o.p, o.n, o.b);
  if (x.seat) { const q = A.electronAt(slots, x.seat[0], x.seat[1], o); s += `<circle cx="${f1(q.x)}" cy="${f1(q.y)}" r="${(o.er || 5) + 1}" fill="#fff" stroke="${A.COL.electron}" stroke-width="1.6" stroke-dasharray="3 3"/>`; }
  levels.forEach((cnt, i) => {
    if (i >= nRings) return;
    for (let k = 0; k < cnt; k++) {
      if (x.omit && x.omit.some(([a, c]) => a === i && c === k)) continue;
      const q = A.electronAt(slots, i, k, o); s += at(q.x, q.y, 1, A.electron(o.er || 5));
    }
  });
  return s;
}
const ringR = (o, i) => Math.max(o.r0 || 30, A.nucleusR(o.p, o.n, o.b) + 10) + i * (o.dr || 20);

/* ---------- the scene: everything is drawn from this one state ---------- */
const sc = { mode: 'atom',
  nuc: false, rings: 0, lv: [0, 0, 0], know: {}, hiRing: null,          // Stage 1: the atom of sodium
  found: {}, cur: null,                                                 // Mission 1: the periodic table
  bond: 'ionic', move: 0, ions: false, join: 0, shared: false,          // Mission 2: bonds
  card: null,
  board: { phy: [], chem: [] },                                         // Mission 3: physical or chemical
  hi: null };                                                           // Stage 3: the three boxes

/* Stage 1: the atom of sodium on the left, its card on the right */
const NA = { p: 11, n: 12, b: 5.5, r0: 40, dr: 24, er: 6 }, AX = 140, AY = 140;
const LV = ['K', 'L', 'M'];
function atomScene() {
  let s = `<rect width="420" height="280" fill="${BG}"/>`;
  const slots = sc.lv.map(n => Math.max(1, n));
  if (!sc.nuc) s += `<circle cx="${AX}" cy="${AY}" r="34" fill="#ffffff" stroke="#9fb3c4" stroke-width="2.4" stroke-dasharray="6 6"/>${L(AX, AY + 12, '?', { fs: 34, fill: '#9fb3c4' })}`;
  s += at(AX, AY, 1, atomG(sc.lv, NA, { slots, rings: sc.rings, nuc: sc.nuc, hi: sc.hiRing }));
  for (let i = 0; i < sc.rings; i++) { const R = ringR(NA, i), a = -135 * Math.PI / 180; s += pill(AX + Math.cos(a) * R, AY + Math.sin(a) * R, LV[i]); }
  const k = sc.know;
  s += `<rect x="262" y="26" width="146" height="228" rx="16" fill="#ffffff" stroke="#c9d6e2" stroke-width="2.4"/>
    ${L(300, 78, '23', { fs: 17, anchor: 'end', fill: k.A ? '#c4483a' : '#1f3d57' })}${L(300, 120, '11', { fs: 17, anchor: 'end', fill: k.Z ? '#c4483a' : '#1f3d57' })}${L(304, 114, 'Na', { fs: 48, anchor: 'start' })}
    ${W(335, 150, T('Sodium', 'الصوديوم'), { fs: 15 })}<path d="M276 162H394" stroke="#e1e8ef" stroke-width="2"/>
    ${W(335, 186, T('Protons: ', 'البروتونات: ') + (k.p ? '11' : '?'), { fs: 14, fill: k.p ? '#c4483a' : '#8a9aa8' })}
    ${W(335, 212, T('Neutrons: ', 'النيوترونات: ') + (k.n ? '12' : '?'), { fs: 14, fill: k.n ? '#5b6976' : '#8a9aa8' })}
    ${W(335, 238, T('Electrons: ', 'الإلكترونات: ') + (k.e ? '11' : '?'), { fs: 14, fill: k.e ? '#22679f' : '#8a9aa8' })}`;
  if (k.cfg) s += `<rect x="70" y="248" width="140" height="26" rx="13" fill="#fff8ea" stroke="#e6c483" stroke-width="2"/>${L(140, 266, 'K 2 · L 8 · M 1', { fs: 14 })}`;
  return s;
}
/* the spots on the levels: the outer level first, so that the inner one is on top */
const band = (cx, cy, r1, r2) => `<path class="ring" fill-rule="evenodd" d="M${f1(cx - r2)} ${cy}a${f1(r2)} ${f1(r2)} 0 1 0 ${f1(2 * r2)} 0a${f1(r2)} ${f1(r2)} 0 1 0 ${f1(-2 * r2)} 0Z${r1 > 0 ? `M${f1(cx - r1)} ${cy}a${f1(r1)} ${f1(r1)} 0 1 1 ${f1(2 * r1)} 0a${f1(r1)} ${f1(r1)} 0 1 1 ${f1(-2 * r1)} 0Z` : ''}"/>`;
const ringSpots = () => [0, 1, 2].map(i => ({ id: LV[i], name: T(`Level ${LV[i]}`, `المستوى ${LV[i]}`), ring: band(AX, AY, i ? ringR(NA, i) - 11 : 0, ringR(NA, i) + 11) }));

/* Mission 1: the A groups of periods 1 to 4 */
const GR = ['1A', '2A', '3A', '4A', '5A', '6A', '7A', '0'], TX = 66, TY = 46, TW = 41, TH = 46;
const hasCell = (r, g) => r > 0 || g === 0 || g === 7;
const cellX = g => TX + g * TW, cellY = r => TY + r * TH;
const KNOWN = { '0-0': 'H', '0-7': 'He' };
function tableScene() {
  let s = `<rect width="420" height="280" fill="#f7f9fc"/>`;
  GR.forEach((g, i) => { s += L(cellX(i) + TW / 2, TY - 10, g, { fs: 13 }); });
  for (let r = 0; r < 4; r++) {
    s += L(TX - 14, cellY(r) + TH / 2 + 5, String(r + 1), { fs: 14, fill: '#5b6976' });
    for (let g = 0; g < 8; g++) {
      if (!hasCell(r, g)) continue;
      const sym = sc.found[`${r}-${g}`] || KNOWN[`${r}-${g}`];
      s += `<rect x="${cellX(g) + 2}" y="${cellY(r) + 2}" width="${TW - 4}" height="${TH - 4}" rx="7" fill="${sym ? A.GROUP_COL[g] : '#ffffff'}" stroke="${sym ? '#ffffff' : '#c9d6e2'}" stroke-width="1.6"/>${sym ? L(cellX(g) + TW / 2, cellY(r) + TH / 2 + 6, sym, { fs: 16 }) : ''}`;
    }
  }
  s += `<text x="0" y="0" transform="translate(26 ${TY + 2 * TH}) rotate(-90)" text-anchor="middle" font-size="12" font-weight="900" fill="#5b6976">${T('Period', 'الدورة')}</text>`;
  if (sc.cur) s += `<rect x="120" y="240" width="180" height="30" rx="15" fill="#fff8ea" stroke="#e6c483" stroke-width="2"/>${L(210, 260, `${sc.cur.sym}:  ${sc.cur.cfg}`, { fs: 15 })}`;
  return s;
}
const tableSpots = () => {
  const out = [];
  for (let r = 0; r < 4; r++) for (let g = 0; g < 8; g++) if (hasCell(r, g)) out.push({ id: `${r}-${g}`, name: T(`Period ${r + 1}, group ${GR[g]}`, `الدورة ${r + 1}، المجموعة ${GR[g]}`), ring: rr(cellX(g) + 1, cellY(r) + 1, TW - 2, TH - 2, 8) });
  return out;
};

/* Mission 2: bonds */
const ONA = { p: 11, n: 12, b: 4, r0: 30, dr: 18, er: 5, spin: 44 }, OCL = { p: 17, n: 18, b: 4, r0: 30, dr: 18, er: 5, spin: 224 };
const OH = { p: 1, n: 0, b: 5, r0: 30, dr: 18, er: 5 }, OCL2 = Object.assign({}, OCL, { spin: 201.5 }), OHR = Object.assign({}, OH, { spin: 90 });
const NAX = 100, CLX = 312, BY = 132;
function ionicScene() {
  const from = A.electronAt([2, 8, 1], 2, 0, ONA), to = A.electronAt([2, 8, 8], 2, 0, OCL);
  const x1 = NAX + from.x, y1 = BY + from.y, x2 = CLX + to.x, y2 = BY + to.y, k = sc.move;
  let s = `<rect width="420" height="280" fill="${BG}"/>`;
  s += at(NAX, BY, 1, sc.ions ? atomG([2, 8], ONA, { rings: 2 }) : atomG([2, 8, 1], ONA, { omit: k > 0 ? [[2, 0]] : null }));
  s += at(CLX, BY, 1, atomG([2, 8, 8], OCL, { omit: sc.ions ? null : [[2, 0]], seat: sc.ions || k > 0 ? null : [2, 0] }));
  if (k > 0 && !sc.ions) s += at(x1 + (x2 - x1) * k, y1 + (y2 - y1) * k - Math.sin(k * Math.PI) * 34, 1, A.electron(5.5));
  const nm = sc.ions ? ['Na⁺  (2,8)', 'Cl⁻  (2,8,8)'] : ['Na  (2,8,1)', 'Cl  (2,8,7)'];
  s += L(NAX, 252, nm[0], { fs: 15 }) + L(CLX, 252, nm[1], { fs: 15 });
  if (sc.ions) {
    s += `<circle cx="${NAX + 46}" cy="${BY - 50}" r="15" fill="#ef6b57"/>${L(NAX + 46, BY - 44, '+', { fs: 20, fill: '#fff' })}<circle cx="${CLX + 76}" cy="${BY - 78}" r="15" fill="#3f93db"/>${L(CLX + 76, BY - 72, '−', { fs: 22, fill: '#fff' })}
      <path d="M176 ${BY + 4}l14 -8v16z M246 ${BY + 4}l-14 -8v16z" fill="#c4483a"/><path d="M188 ${BY + 4}H232" stroke="#c4483a" stroke-width="3" stroke-dasharray="4 4"/>
      ${L(210, 24, '[Na]⁺ [Cl]⁻', { fs: 17 })}`;
  }
  return s;
}
function covScene() {
  const k = sc.join, hx = 110 + 40 * k, cx = 300 - 52 * k;
  let s = `<rect width="420" height="280" fill="${BG}"/>`;
  if (!sc.shared) {
    s += at(hx, BY, 1, atomG([1], OHR));
    s += at(cx, BY, 1, atomG([2, 8, 8], OCL, { omit: [[2, 0]] }));
    s += L(hx, 252, 'H  (1)', { fs: 15 }) + L(cx, 252, 'Cl  (2,8,7)', { fs: 15 });
  } else {
    const xm = ((hx + ringR(OH, 0)) + (cx - ringR(OCL, 2))) / 2;
    s += at(hx, BY, 1, atomG([0], OH)) + at(cx, BY, 1, atomG([2, 8, 8], OCL2, { omit: [[2, 0], [2, 1]] }));
    s += `<ellipse cx="${f1(xm)}" cy="${BY}" rx="11" ry="21" fill="#fde6a4" opacity=".85" stroke="#e6a93c" stroke-width="2"/>` + at(xm, BY - 9, 1, A.electron(5)) + at(xm, BY + 9, 1, A.electron(5));
    s += L(210, 252, 'H − Cl', { fs: 18 });
    s += `<path d="M${f1(xm)} ${BY - 26}V48" stroke="#e6a93c" stroke-width="2" stroke-dasharray="4 4"/>` + W(f1(xm), 40, T('A shared pair of electrons', 'زوج من الإلكترونات المشتركة'), { fs: 13.5, fill: '#a8701c' });
  }
  return s;
}
const CARDS = ['single', 'double', 'triple'];
function cardsScene() {
  let s = `<rect width="420" height="280" fill="#f7f9fc"/>`;
  CARDS.forEach((c, i) => {
    const y = 14 + i * 88, on = sc.card === c;
    s += `<rect x="130" y="${y}" width="160" height="80" rx="14" fill="#ffffff" stroke="${on ? '#2e9e6b' : '#c9d6e2'}" stroke-width="${on ? 4 : 2}"/>${at(130, y + 2, 1, A.bondCard(c))}`;
  });
  return s;
}

/* Mission 3: the board of physical and chemical properties. In Arabic the first button (physical) is on the right, so is its column */
const COLX = { phy: T(112, 308), chem: T(308, 112) };
function boardScene() {
  let s = `<rect width="420" height="280" fill="#eef3ee"/><rect x="14" y="14" width="392" height="252" rx="16" fill="#ffffff" stroke="#a8834f" stroke-width="5"/><path d="M210 30V250" stroke="#e1e8ef" stroke-width="3"/>`;
  s += W(COLX.phy, 46, T('Physical properties', 'خواص فيزيائية'), { fs: 15, fill: '#1b6182' }) + W(COLX.chem, 46, T('Chemical properties', 'خواص كيميائية'), { fs: 15, fill: '#a8323a' });
  s += `<path d="M34 58H190M230 58H386" stroke="#e1e8ef" stroke-width="2"/>`;
  ['phy', 'chem'].forEach(c => sc.board[c].forEach((t, i) => { s += W(COLX[c], 86 + i * 28, t, { fs: 13.5 }); }));
  return s;
}

/* Stage 3: element, compound or mixture */
const RED = '#ef7d6b', BLUE = '#5aa6e0', SPOTS = [[24, 30, 20], [68, 26, -30], [44, 62, 60], [86, 70, 10], [24, 96, -60], [70, 104, 30]];
const KIND = ['element', 'compound', 'mixture'];
const KX = { element: T(18, 284), compound: 151, mixture: T(284, 18) };
const NAME = { element: T('Element', 'عنصر'), compound: T('Compound', 'مركب'), mixture: T('Mixture', 'مخلوط') };
function boxesScene() {
  const kinds = { element: SPOTS.map(() => [RED, RED]), compound: SPOTS.map(() => [RED, BLUE]), mixture: [[RED, RED], [BLUE, BLUE], [RED, RED], [BLUE, BLUE], [BLUE, BLUE], [RED, RED]] };
  let s = `<rect width="420" height="280" fill="${BG}"/>`;
  KIND.forEach(k => {
    const x = KX[k], on = sc.hi === k;
    s += `<rect x="${x}" y="40" width="118" height="150" rx="14" fill="#ffffff" stroke="${on ? '#2e9e6b' : '#9fb3c4'}" stroke-width="${on ? 5 : 2.4}"/>`;
    s += SPOTS.map(([dx, dy, rot], i) => at(x + dx + 4, 40 + dy + 6, 1, A.diatomic(kinds[k][i][0], kinds[k][i][1], 8, rot))).join('');
    s += W(x + 59, 222, NAME[k], { fs: 17, fill: on ? '#2e9e6b' : '#1f3d57' });
  });
  return s;
}
const render = () => ({ atom: atomScene, table: tableScene, ionic: ionicScene, cov: covScene, cards: cardsScene, board: boardScene, boxes: boxesScene })[sc.mode]();

const g = G4Game({ ch: 'p1u1', logo: '⚛️', title: ['Atom Lab', 'معمل الذرة'], sub: ['Unit 1 · The Matter', 'الوحدة ١ · المادة'],
  bg: 'science/assets/bg_p1u1.svg', bgc: '#dbeefb', label: ['Reesho’s atom lab', 'معمل الذرة بتاع ريشو'], render });
const kw = g.kw;
async function addElectrons(i, n) {
  for (let k = 0; k < n; k++) { sc.lv[i]++; g.paint(); await g.sleep(g.reduceMotion ? 0 : 170); }
}

/* ---------- Stage 1 · Warm Up: build an atom of sodium ---------- */
async function stage1() {
  Object.assign(sc, { mode: 'atom', nuc: false, rings: 0, lv: [0, 0, 0], know: {}, hiRing: null }); g.paint();
  g.say(T(`Let’s build an atom of <b>sodium</b>. Its card shows two numbers beside the symbol ${ltr('Na')}. First: which particles are found in the ${kw('nucleus')} of the atom?`,
    `يلّا نبني ذرة <b>صوديوم</b>. الكارت بتاعها فيه رقمين جنب الرمز ${ltr('Na')}. الأول: ما الجسيمات الموجودة في ${kw('نواة')} الذرة؟`), 'think');
  await g.choice({
    options: [T('Protons and neutrons', 'البروتونات والنيوترونات'), T('Protons and electrons', 'البروتونات والإلكترونات'), T('Electrons only', 'الإلكترونات فقط')], correct: T('Protons and neutrons', 'البروتونات والنيوترونات'),
    hint: T('The electrons revolve around the nucleus.', 'الإلكترونات بتدور حوالين النواة.'),
    ok: T(`The nucleus contains the ${kw('protons')} (positive) and the ${kw('neutrons')} (neutral). The electrons revolve around it at very high speeds.`, `تحتوي النواة على ${kw('البروتونات')} الموجبة و${kw('النيوترونات')} المتعادلة، وتدور حولها الإلكترونات بسرعات فائقة.`),
    reveal: () => { sc.nuc = true; g.paint(); } });
  g.say(T(`The small number at the lower left of the symbol is the ${kw('atomic number')} (Z). For sodium Z = 11. What does the atomic number tell us?`,
    `الرقم الصغير أسفل يسار الرمز هو ${kw('العدد الذري')} ${ltr('(Z)')}. للصوديوم ${ltr('Z = 11')}. العدد الذري يعبر عن إيه؟`), 'point');
  await g.choice({
    options: [T('The number of protons', 'عدد البروتونات'), T('The number of neutrons', 'عدد النيوترونات'), T('The number of nucleons', 'عدد النيوكلونات')], correct: T('The number of protons', 'عدد البروتونات'),
    hint: T('It is the particles with the positive charge.', 'هي الجسيمات اللي شحنتها موجبة.'),
    ok: T(`The atomic number (Z) is the number of ${kw('protons')} in the nucleus. Sodium has 11 protons.`, `العدد الذري ${ltr('(Z)')} هو عدد ${kw('البروتونات')} في النواة. ذرة الصوديوم فيها 11 بروتونًا.`),
    reveal: () => { sc.know.Z = sc.know.p = true; g.paint(); } });
  g.say(T(`The number at the upper left is the ${kw('mass number')} (A): the number of protons and neutrons together. For sodium A = 23. How many neutrons are in the nucleus?`,
    `الرقم أعلى يسار الرمز هو ${kw('العدد الكتلي')} ${ltr('(A)')}: مجموع البروتونات والنيوترونات. للصوديوم ${ltr('A = 23')}. كم نيوترونًا في النواة؟`), 'think');
  await g.choice({
    options: ['12', '23', '11'], correct: '12',
    hint: T('Subtract the atomic number from the mass number.', P('اطرح العدد الذري من العدد الكتلي.', 'اطرحي العدد الذري من العدد الكتلي.')),
    ok: T(`A − Z = 23 − 11 = ${kw('12')} neutrons.`, `الفرق بين العدد الكتلي والعدد الذري يساوي عدد النيوترونات: ${ltr('23 − 11 = 12')}، يعني ${kw('12')} نيوترونًا.`),
    reveal: () => { sc.know.A = sc.know.n = true; g.paint(); } });
  g.say(T('The atom is <b>electrically neutral</b>. How many electrons does the atom of sodium have?', 'الذرة <b>متعادلة كهربيًا</b>. كم إلكترونًا في ذرة الصوديوم؟'), 'think');
  await g.choice({
    options: ['11', '12', '23'], correct: '11',
    hint: T('The negative charges must balance the positive charges.', 'الشحنات السالبة لازم تساوي الشحنات الموجبة.'),
    ok: T(`${kw('11')} electrons: in any atom, the number of positive protons equals the number of negative electrons.`, `${kw('11')} إلكترونًا: في أي ذرة يكون عدد البروتونات الموجبة مساويًا لعدد الإلكترونات السالبة.`),
    reveal: () => { sc.know.e = true; sc.rings = 3; g.paint(); } });
  g.say(T(`The electrons revolve around the nucleus in ${kw('energy levels')}: K, L, M… Which level is filled first? Tap it.`, P(`الإلكترونات بتدور حول النواة في ${kw('مستويات الطاقة')}: ${ltr('K, L, M')}… أنهي مستوى يتملي الأول؟ اضغط عليه.`, `الإلكترونات بتدور حول النواة في ${kw('مستويات الطاقة')}: ${ltr('K, L, M')}… أنهي مستوى يتملي الأول؟ اضغطي عليه.`)), 'point');
  await g.spot(ringSpots(), 'K', {
    hint: T('It is the level nearest to the nucleus.', 'هو أقرب مستوى للنواة.'),
    ok: T(`The first level, ${kw('K')}, is filled first; then the higher levels, one after the other.`, `يُملأ مستوى الطاقة الأول ${kw('K')} بالإلكترونات أولًا، ثم يتتابع ملء مستويات الطاقة الأعلى.`) });
  g.say(T('How many electrons does level K need to be full? (2n², with n = 1)', `كم إلكترونًا يلزم لتشبُّع المستوى ${ltr('K')}؟ ${ltr('(2n², n = 1)')}`), 'think');
  await g.choice({

  const list = g.shuffle(PROPS.filter(p => p.k === 'phy')).slice(0, 3).concat(g.shuffle(PROPS.filter(p => p.k === 'chem')).slice(0, 3));
  for (const it of g.shuffle(list)) {
    const told = it.k === 'phy' ? T(`<b>${it.t}</b>: a ${kw('physical')} property. Nothing new is formed.`, `<b>${it.t}</b>: خاصية ${kw('فيزيائية')}؛ لم تتكون مادة جديدة.`)
      : T(`<b>${it.t}</b>: a ${kw('chemical')} property. It appears only in a chemical reaction.`, `<b>${it.t}</b>: خاصية ${kw('كيميائية')}؛ لا تظهر إلا عند حدوث تفاعل كيميائي.`);
    g.say(T(`<b>${it.t}</b>. Physical or chemical property?`, `<b>${it.t}</b>. خاصية فيزيائية ولا كيميائية؟`), 'think');
    await g.pick({ buttons, correct: it.k, ok: T(`Yes! ${told}`, `صح! ${told}`), no: told, reveal: () => { sc.board[it.k].push(it.s); g.paint(); } });
  }
  g.setTray(null);
}
async function stage2() { await mission1(); await mission2(); await mission3(); }

/* ---------- Stage 3 · Speed Round: element, compound or mixture? ---------- */
const WHY = {
  element: T('One kind of atom: the simplest pure form of matter.', 'نوع واحد من الذرات: أبسط صورة نقية للمادة.'),
  compound: T('Two or more elements chemically combined in fixed mass ratios.', 'اتحاد كيميائي بين عنصرين أو أكثر بنسب كتلية ثابتة.'),
  mixture: T('Not chemically combined: separated by physical methods.', 'مواد غير متحدة كيميائيًا، وتُفصل بطرق فيزيائية.')
};
const F = (f, en, ar) => `${ltr(f)} ${T(`(${en})`, `(${ar})`)}`;
const SPEED = [
  { t: F('O₂', 'oxygen', 'الأكسجين'), ans: 'element' }, { t: F('Hg', 'mercury', 'الزئبق'), ans: 'element' }, { t: F('Cu', 'copper', 'النحاس'), ans: 'element' },
  { t: F('O₃', 'ozone', 'الأوزون'), ans: 'element' }, { t: F('Al', 'aluminum', 'الألومنيوم'), ans: 'element' }, { t: F('N₂', 'nitrogen', 'النيتروجين'), ans: 'element' },
  { t: F('H₂O', 'water', 'الماء'), ans: 'compound' }, { t: F('CO₂', 'carbon dioxide', 'ثاني أكسيد الكربون'), ans: 'compound' }, { t: F('NaCl', 'sodium chloride', 'كلوريد الصوديوم'), ans: 'compound' },
  { t: F('CH₄', 'methane', 'الميثان'), ans: 'compound' }, { t: F('HNO₃', 'nitric acid', 'حمض النيتريك'), ans: 'compound' }, { t: F('CaCuSi₄O₁₀', 'Egyptian blue', 'الأزرق المصري'), ans: 'compound' },
  { t: T('Table salt in water', 'ملح الطعام في الماء'), ans: 'mixture' }, { t: T('Sand in water', 'الرمل في الماء'), ans: 'mixture' }, { t: T('Table salt and sand in water', 'ملح الطعام والرمل في الماء'), ans: 'mixture' }
].map(s => Object.assign(s, { why: WHY[s.ans] }));
async function stage3() {
  Object.assign(sc, { mode: 'boxes', hi: null }); g.paint();
  const some = (k, n) => g.shuffle(SPEED.filter(s => s.ans === k)).slice(0, n);
  await g.speedRound({
    items: some('element', 3).concat(some('compound', 3), some('mixture', 3)), rounds: 9,
    buttons: KIND.map((k, i) => ({ label: NAME[k], value: k, c: [0, 2, 3][i] })),
    ask: T('Element, compound or mixture?', 'عنصر، مركب، أم مخلوط؟'),
    intro: T('Speed Round! I show you a substance. Is it an <b>element</b>, a <b>compound</b> or a <b>mixture</b>? Press the right button before time runs out. 9 rounds!', P('جولة السرعة! هوريك مادة. هل هي <b>عنصر</b> ولا <b>مركب</b> ولا <b>مخلوط</b>؟ اضغط على الزرار الصح قبل ما الوقت يخلص. ٩ جولات!', 'جولة السرعة! هوريكي مادة. هل هي <b>عنصر</b> ولا <b>مركب</b> ولا <b>مخلوط</b>؟ اضغطي على الزرار الصح قبل ما الوقت يخلص. ٩ جولات!')),
    think: T('Element, compound or mixture?', 'عنصر، مركب، أم مخلوط؟'),
    show: () => { sc.hi = null; g.paint(); }, reveal: it => { sc.hi = it.ans; g.paint(); }
  });
}

g.run({
  intro: T(`Hi, <b>${g.name()}</b>! Welcome to my atom lab. First we build an <b>atom</b> of sodium. Then we find elements in the <b>periodic table</b>, watch atoms <b>bond</b>, and sort the properties of matter.`, P(`أهلًا يا <b>${g.name()}</b>! نوّرت معمل الذرة. الأول هنبني <b>ذرة</b> صوديوم. وبعدين ندوّر على العناصر في <b>الجدول الدوري</b>، ونشوف الذرات بترتبط إزاي، ونصنّف خواص المادة.`, `أهلًا يا <b>${g.name()}</b>! نوّرتي معمل الذرة. الأول هنبني <b>ذرة</b> صوديوم. وبعدين ندوّر على العناصر في <b>الجدول الدوري</b>، ونشوف الذرات بترتبط إزاي، ونصنّف خواص المادة.`)),
  stages: [{ name: T('Warm Up', 'التسخين'), fn: stage1 }, { name: T('Missions', 'المهمات'), fn: stage2 }, { name: T('Speed Round', 'جولة السرعة'), fn: stage3 }],
  done: { title: T('Master of matter!', P('بقيت خبير المادة!', 'بقيتي خبيرة المادة!')),
    text: T('The atom has a <b>nucleus</b> of protons and neutrons, and electrons in <b>energy levels</b>. The electron configuration gives the <b>period</b> and the <b>group</b> of an element. Atoms bond by <b>ionic</b> or <b>covalent</b> bonding.', 'تتكون الذرة من <b>نواة</b> بها البروتونات والنيوترونات، وإلكترونات تدور في <b>مستويات الطاقة</b>. ومن التوزيع الإلكتروني نعرف <b>الدورة</b> و<b>المجموعة</b> للعنصر. وترتبط الذرات بالترابط <b>الأيوني</b> أو <b>التساهمي</b>.') }
}).catch(err => console.error(err));
window.__atom = { sc, render };
})();
</script>
