<script>
(() => {
'use strict';
/* Time Trip to Ancient Egypt · the game of Unit 2, The Ancient Egyptian Civilization (Social Studies, Grade 5, book pages 39-65). Built on the shared game kit (game_kit.js).
   Pictures: the owner's illustrations (studies/assets/civ_*.jpg) in the six-picture cards civEarly / civGreat of studies/g5_art.js, or one photo at a time.
   Stage 1 (Warm Up): natural or human factor? (lesson 1, pages 41-42).
   Stage 2 (Missions): 1 the factors (lesson 1) · 2 the prehistoric ages (lesson 2) · 3 the two kingdoms and the unity (lesson 2) · 4 the Archaic age and the Old Kingdom (lesson 3)
                       5 the Middle and New Kingdoms (lesson 3) · 6 Alexander, the Ptolemies and the Romans (lesson 4).
   Stage 3 (Speed Round): which age? (lesson 3). The book is Arabic for both tracks; every T('English', 'عربي') has both languages.
   Rule (owner, 25 Oct 2026): the scene is set right before every question, and it never shows the answer. */
const T = SI.T, G = SI.G, A = S5ART, D = window.CH_DIAGRAMS;
const P = (m, f) => G(m, f || m);
const L = s => `<span dir="ltr">${s}</span>`;
const kw = s => `<b class="kw">${s}</b>`;
const VW = 340, VH = 300, FONT = 'Cairo, Nunito, sans-serif', INK = '#1f3d57';
const sc = { mode: 'set', key: 'civGreat', lines: [], word: '', sub: '' };
const BASE = `<rect width="${VW}" height="${VH}" rx="14" fill="#fbf3e2"/>`;
const esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;');
const txt = (x, y, s, o = {}) => `<text x="${x}" y="${y}" text-anchor="middle" direction="rtl" font-family="${FONT}" font-size="${o.fs || 22}" font-weight="${o.w || 800}" fill="${o.fill || INK}">${esc(s)}</text>`;
function render() {
  const m = sc.mode;
  if (m === 'set') return BASE + `<g transform="translate(0 25)">${D[sc.key]({ pic: { plain: true } })}</g>`;
  if (m === 'card') {
    let s = BASE + `<rect x="16" y="34" width="308" height="232" rx="20" fill="#fffaf0" stroke="#d8c9a6" stroke-width="3"/>`;
    const n = sc.lines.length, step = n > 3 ? 36 : 44, y0 = 158 - (n - 1) * step / 2;
    sc.lines.forEach((line, i) => { s += txt(170, y0 + i * step, line, { fs: Math.min(24, Math.floor(290 / (String(line).length * .52))) }); });
    return s;
  }
  if (m === 'photo') {
    const k = sc.word ? 196 : 236, x = (VW - k) / 2, y = sc.word ? 30 : 32;
    return BASE + `<rect x="${x - 8}" y="${y - 8}" width="${k + 16}" height="${k + 16}" rx="24" fill="#fff" stroke="#d8c9a6" stroke-width="3"/><clipPath id="phc"><rect x="${x}" y="${y}" width="${k}" height="${k}" rx="18"/></clipPath>`
      + `<image href="studies/assets/civ_${sc.sub}.jpg" x="${x}" y="${y}" width="${k}" height="${k}" clip-path="url(#phc)"/>` + (sc.word ? txt(170, 280, sc.word, { fs: Math.min(22, Math.floor(320 / (sc.word.length * .5))) }) : '');
  }
  return BASE;
}
const g = G4Game({ ch: 'sg5u2', logo: '🏺', title: ['Time Trip to Ancient Egypt', 'رحلة إلى مصر القديمة'], sub: ['Unit 2 · The Ancient Egyptian Civilization', 'الوحدة 2 · الحضارة المصرية القديمة'],
  bg: 'studies/assets/bg_sg5u2.svg', bgc: '#fbe9c8', label: ['A picture or a card for each question', 'صورة أو بطاقة لكل سؤال'], render, view: [VW, VH] });
const set = (mode, o) => { Object.assign(sc, { mode, key: sc.key, lines: [], word: '', sub: '' }, o || {}); g.paint(); };
const rings = key => { const r = D[key].rings(); return Object.keys(r).map(id => { const [x, y, R] = r[id]; return { id, name: A.CIVNAME[id], ring: A.ringEl(x, y + 25, R, R) }; }); };
async function spotSet(key, id, sayEn, sayAr, hintEn, hintAr, okEn, okAr) {
  set('set', { key });
  g.say(T(sayEn, sayAr), 'think');
  await g.spot(rings(key), id, { hint: T(hintEn, hintAr), ok: T(okEn, okAr) });
}
async function ask(sayEn, sayAr, options, correct, hintEn, hintAr, okEn, okAr) {
  g.say(T(sayEn, sayAr), 'think');
  await g.choice({ options, correct, hint: T(hintEn, hintAr), ok: T(okEn, okAr) });
}
/* a quick sort: one card at a time ([lines, value, why, '@photo'?]) */
async function sortCards(buttons, cards, prompt) {
  for (const [lines, side, why, pic] of g.shuffle(cards)) {
    if (pic && pic[0] === '@') set('photo', { sub: pic.slice(1), word: Array.isArray(lines) ? lines.join(' ') : lines });
    else set('card', { lines: Array.isArray(lines) ? lines : [lines] });
    g.say(prompt, 'think');
    await g.pick({ buttons, correct: side, ok: T(`Yes! ${why[0]}`, `صح! ${why[1]}`), no: T(`Not quite. ${why[0]}`, `${G('قرّبت!', 'قرّبتي!')} ${why[1]}`) });
  }
  g.setTray(null);
}
const op = (ar, en) => T(en, ar);   // an option: the Arabic book's words, English for the English interface

/* ---------- Stage 1 · Warm Up: natural or human factor? (lesson 1) ---------- */
async function stage1() {
  set('photo', { sub: 'nileriver' });
  g.say(T('Welcome to the time trip! Many factors helped the Ancient Egyptian civilization: natural factors God gave Egypt, and human factors led by the hard-working Egyptian. Sort them!', P('أهلًا في رحلة الزمن! عوامل كتير ساعدت على قيام الحضارة المصرية القديمة: عوامل طبيعية منحها الله لمصر، وعوامل بشرية على رأسها الإنسان المجتهد. يلا نصنّفها!')), 'point');
  await g.next();
  const buttons = [{ label: T('Natural', 'عامل طبيعي'), value: 'n', c: 2 }, { label: T('Human', 'عامل بشري'), value: 'h', c: 1 }];
  await sortCards(buttons, [
    ['نهر النيل', 'n', ['The Nile is a natural factor.', 'نهر النيل عامل طبيعي.']], ['الموقع الجغرافي', 'n', ['The location is a natural factor.', 'الموقع الجغرافي عامل طبيعي.']],
    ['الحدود الطبيعية', 'n', ['The natural borders are a natural factor.', 'الحدود الطبيعية عامل طبيعي.']], ['المناخ المعتدل', 'n', ['The mild climate is a natural factor.', 'المناخ المعتدل عامل طبيعي.']],
    ['الثروات المعدنية', 'n', ['Mineral wealth is a natural factor.', 'الثروات المعدنية عامل طبيعي.']], ['كفاح وإبداع المصري', 'h', ['Hard work and creativity are human factors.', 'كفاح وإبداع المصري عامل بشري.']],
    ['الجيش المصري', 'h', ['The army is a human factor.', 'الجيش المصري عامل بشري.']], ['الحكومة المركزية', 'h', ['The central government is a human factor.', 'الحكومة المركزية عامل بشري.']]],
    T('Natural factor or human factor?', 'عامل طبيعي ولا عامل بشري؟'));
}

/* ---------- Stage 2 · Missions ---------- */
async function mission1() {                 // lesson 1: the factors (pages 40-43)

  set('photo', { sub: 'nileriver' });
  await ask('How did the Nile help the Ancient Egyptian?', 'نهر النيل ساعد المصري القديم في إيه؟', [op('الزراعة والاستقرار على ضفافه', 'Farming and settling on its banks'), op('سكن الكهوف', 'Living in caves'), op('الترحال الدائم', 'Moving all the time')], op('الزراعة والاستقرار على ضفافه', 'Farming and settling on its banks'),
    'Think of the river banks.', 'فكّر في ضفاف النهر.', 'The Nile helped farming, settling, unity and cooperation.', `ساعد في ${kw('الزراعة والاستقرار')}، والوحدة والتعاون لبناء الجسور والسدود.`);
  set('photo', { sub: 'sphinx' });
  await ask('Which natural factor kept the monuments of the Ancient Egyptians until today?', 'أنهي عامل طبيعي ساعد على بقاء آثار المصريين القدماء حتى الآن؟', [op('المناخ الجاف', 'The dry climate'), op('الحكومة المركزية', 'The central government'), op('الجيش المصري', 'The army')], op('المناخ الجاف', 'The dry climate'),
    'It is about the weather.', 'ليه علاقة بالجو.', 'The dry climate kept the monuments.', `${kw('المناخ الجاف')} ساعد على بقاء الآثار خالدة.`);
  set('card', { lines: ['الجيش المصري'] });
  await ask('Why was the army important in Ancient Egypt?', 'الجيش كان مهم ليه في مصر القديمة؟', [op('حماية البلاد واستقرارها ووحدة أراضيها', 'Protecting the country, its stability and unity'), op('بناء الأهرامات', 'Building the pyramids'), op('صناعة الحلي', 'Making jewelry')], op('حماية البلاد واستقرارها ووحدة أراضيها', 'Protecting the country, its stability and unity'),
    'Defending the homeland is a national duty.', 'الدفاع عن الوطن واجب.', 'The army protected the country.', `ساعد على ${kw('حماية البلاد واستقرارها ووحدة أراضيها')}.`);
  set('card', { lines: ['سياسيًّا'] });
  await ask('Politically, the Egyptians were the first people in the world to know…', 'سياسيًّا، المصريون أول شعوب العالم معرفة…', [op('الوحدة السياسية', 'Political unity'), op('الكتابة المسمارية', 'Cuneiform writing'), op('ورق الطباعة', 'Printing paper')], op('الوحدة السياسية', 'Political unity'),
    'Think of one country under one ruler.', 'فكّر في بلد واحد تحت حكم واحد.', 'The first to know political unity.', `أول شعوب العالم معرفة ${kw('للوحدة السياسية')}.`);
}
async function mission2() {                 // lesson 2: the prehistoric ages (pages 46-48)
  set('set', { key: 'civEarly' });
  g.say(T('Mission 2: the prehistoric ages, before people knew writing: the Old Stone Age, the New Stone Age, the Metal Age and the Predynastic age.', 'المهمة ٢: عصور ما قبل التاريخ، قبل ما الإنسان يعرف الكتابة: العصر الحجري القديم، والحجري الحديث، وعصر المعادن، وعصر ما قبل الأسرات.'), 'point');
  await g.next();
  await spotSet('civEarly', 'axe', 'In the Old Stone Age, the Egyptian made his tools from stone. Tap the stone tool.', 'في العصر الحجري القديم صنع المصري أدواته من الحجارة. اضغط على الأداة الحجرية.', 'It is a grey pointed stone.', 'حجر رمادي مدبب.', 'Tools of stone in the Old Stone Age.', `أدوات من ${kw('الحجارة')} في العصر الحجري القديم.`);
  await spotSet('civEarly', 'mudbrick', 'In the New Stone Age, he began to build houses of mud brick. Tap the house.', 'في العصر الحجري الحديث بدأ يبني منازل من الطوب اللبن. اضغط على البيت.', 'A small house of mud.', 'بيت صغير من الطين.', 'Mud-brick houses in the New Stone Age.', `منازل من ${kw('الطوب اللبن')} في العصر الحجري الحديث.`);
  await spotSet('civEarly', 'chisel', 'In the Metal Age, he discovered iron and copper and made tools from them. Tap the metal tool.', 'في عصر المعادن اكتشف الحديد والنحاس وصنع منها أدواته. اضغط على الأداة المعدنية.', 'It has a handle and a flat metal end.', 'ليها مقبض وطرف معدني.', 'Metal tools in the Metal Age.', `أدوات من ${kw('المعادن')} في عصر المعادن.`);
  const buttons = [{ label: T('Old Stone Age', 'الحجري القديم'), value: 'o', c: 0 }, { label: T('New Stone Age', 'الحجري الحديث'), value: 'n', c: 2 }, { label: T('Metal Age', 'عصر المعادن'), value: 'm', c: 3 }];
  await sortCards(buttons, [
    [['سكن الكهوف', 'فوق الهضاب'], 'o', ['Caves on the plateaus: the Old Stone Age.', 'سكن الكهوف فوق الهضاب: العصر الحجري القديم.']], ['اكتشاف النار', 'o', ['Fire: the Old Stone Age.', 'اكتشاف النار: العصر الحجري القديم.']],
    [['النزول إلى ضفاف النيل', 'ومعرفة الزراعة'], 'n', ['Farming by the Nile: the New Stone Age.', 'الزراعة على ضفاف النيل: العصر الحجري الحديث.']], [['أدوات من الفخار', 'والحجارة'], 'n', ['Pottery tools: the New Stone Age.', 'أدوات من الفخار والحجارة: العصر الحجري الحديث.']],
    [['حياة أكثر استقرارًا', 'واكتشاف الحديد والنحاس'], 'm', ['Iron and copper: the Metal Age.', 'الحديد والنحاس: عصر المعادن.']]],
    T('Which age is this?', 'ده أنهي عصر؟'));
  set('card', { lines: ['لماذا نزل المصري القديم', 'من الهضاب إلى النيل؟'] });
  await ask('Why did the Ancient Egyptian come down from the plateaus to the Nile?', 'ليه المصري القديم نزل من الهضاب للنيل؟', [op('جفاف الهضاب', 'The plateaus dried up'), op('الأمطار الغزيرة', 'Heavy rain'), op('كثرة الحيوانات', 'Too many animals')], op('جفاف الهضاب', 'The plateaus dried up'),
    'There was no more water up there.', 'مبقاش فيه مية فوق.', 'The plateaus dried up.', `بسبب ${kw('جفاف الهضاب')}.`);

async function mission3() {                 // lesson 2: the two kingdoms and the unity (pages 48-49)
  set('card', { lines: ['القرية ← المدينة ← الإقليم', 'ثم مملكتان'] });
  g.say(T('Mission 3: houses gathered into villages, villages into cities, then provinces, and the provinces formed two kingdoms: the North and the South.', 'المهمة ٣: المنازل اتجمعت في قرى، والقرى في مدن، وبعدين أقاليم، والأقاليم كوّنت مملكتين: الشمال والجنوب.'), 'point');
  await g.next();
  const buttons = [{ label: T('Northern Kingdom', 'مملكة الشمال'), value: 'n', c: 3 }, { label: T('Southern Kingdom', 'مملكة الجنوب'), value: 's', c: 0 }];
  await sortCards(buttons, [
    ['العاصمة بوتو', 'n', ['Buto was the capital of the North.', 'بوتو عاصمة مملكة الشمال.']], ['العاصمة نخب', 's', ['Nekheb was the capital of the South.', 'نخب عاصمة مملكة الجنوب.']],
    ['التاج الأحمر', 'n', ['The red crown: the North.', 'التاج الأحمر: مملكة الشمال.']], ['التاج الأبيض', 's', ['The white crown: the South.', 'التاج الأبيض: مملكة الجنوب.']],
    ['نبات البردي', 'n', ['Papyrus was the emblem of the North.', 'نبات البردي شعار مملكة الشمال.'], '@bardi'], ['زهرة اللوتس', 's', ['The lotus was the emblem of the South.', 'زهرة اللوتس شعار مملكة الجنوب.']],
    ['ثعبان الكوبرا', 'n', ['The cobra was the deity of the North.', 'ثعبان الكوبرا معبود مملكة الشمال.']], ['أنثى النسر', 's', ['The female vulture was the deity of the South.', 'أنثى النسر معبود مملكة الجنوب.']]],
    T('North or South?', 'مملكة الشمال ولا مملكة الجنوب؟'));
  set('card', { lines: ['الوحدة الثانية', '3200 ق.م'] });

    'He was the ruler of Thebes.', 'كان حاكم مدينة طيبة.', 'King Narmer (Menes) united the country and built Memphis.', `الملك ${kw('نعرمر (مينا)')} حاكم طيبة، وبنى مدينة «من نفر» عاصمة.`);
  set('card', { lines: ['الوحدة الأولى', '4242 ق.م'] });

    'Today it is Ain Shams.', 'اسمها حاليًّا عين شمس.', 'On (Heliopolis), today Ain Shams.', `${kw('أون هليوبوليس')} (عين شمس حاليًّا).`);
}
async function mission4() {                 // lesson 3: the Archaic age and the Old Kingdom (pages 52-53)

  set('photo', { sub: 'narmer' });

  await spotSet('civGreat', 'sphinx', 'King Khafre had the middle pyramid and a famous statue. Tap the statue.', 'الملك خفرع صاحب الهرم الأوسط وتمثال مشهور. اضغط على التمثال.', 'A lion’s body with a king’s head.', 'جسم أسد ورأس ملك.', 'The Sphinx, of King Khafre.', `${kw('تمثال أبو الهول')} للملك خفرع.`);

    'Count the pyramids.', 'عِد الأهرامات.', 'So many pyramids were built.', `${kw('لكثرة ما تم تشييده من أهرامات')}.`);
}
async function mission5() {                 // lesson 3: the Middle and New Kingdoms (pages 54-55)
  set('card', { lines: ['عصر الدولة الوسطى', 'الرخاء الاقتصادي'] });
  g.say(T('Mission 5: the Middle Kingdom reunited the country and brought economic prosperity. Then came the New Kingdom, the age of military glory.', 'المهمة ٥: الدولة الوسطى رجّعت وحدة البلاد وحققت رخاء اقتصادي. وبعدها الدولة الحديثة، عصر المجد الحربي.'), 'point');
  await g.next();
  set('photo', { sub: 'lahun' });
  await ask('Why did King Amenemhat III build the El-Lahun dam?', 'ليه الملك أمنمحات الثالث شيّد سد اللاهون؟', [op('لحماية الأراضي من الفيضانات وتخزين المياه', 'To protect the land from floods and store water'), op('لتسهيل التجارة مع البحر الأحمر', 'To ease trade with the Red Sea'), op('لصد الهكسوس', 'To stop the Hyksos')], op('لحماية الأراضي من الفيضانات وتخزين المياه', 'To protect the land from floods and store water'),
    'It is at the entrance of Lake Moeris in Fayoum.', 'عند مدخل بحيرة موريس بالفيوم.', 'To protect farmland from floods and store water.', `${kw('لحماية الأراضي الزراعية من الفيضانات وتخزين المياه')}.`);
  set('card', { lines: ['قناة سيزوستريس'] });
  await ask('Who dug the Sesostris Canal, and why?', 'مين حفر قناة سيزوستريس وليه؟', [op('سنوسرت الثالث، لتسهيل التجارة', 'Senusret III, to ease trade'), op('خوفو، لنقل الأحجار', 'Khufu, to carry stones'), op('أحمس، لطرد الهكسوس', 'Ahmose, to drive out the Hyksos')], op('سنوسرت الثالث، لتسهيل التجارة', 'Senusret III, to ease trade'),
    'It joined the Red Sea and the Nile.', 'ربطت البحر الأحمر بالنيل.', 'Senusret III, for trade between the Red Sea and the Mediterranean.', `${kw('سنوسرت الثالث')}؛ لتسهيل التجارة بين البحر الأحمر والمتوسط.`);
  set('card', { lines: ['الهكسوس', 'عاصمتهم أواريس'] });
  await ask('Which king defeated the Hyksos and drove them out?', 'أنهي ملك هزم الهكسوس وطردهم؟', [op('أحمس', 'Ahmose'), op('زوسر', 'Djoser'), op('مينا', 'Menes')], op('أحمس', 'Ahmose'),
    'His mother, Queen Ahhotep, encouraged him.', 'أمه الملكة إياح حتب شجعته.', 'Ahmose defeated the Hyksos.', `الملك ${kw('أحمس')}.`);
  const buttons = [{ label: T('Megiddo', 'مجدو'), value: 'm', c: 2 }, { label: T('Kadesh', 'قادش'), value: 'k', c: 1 }];
  await sortCards(buttons, [
    ['الملك تحتمس الثالث', 'm', ['Thutmose III led Megiddo.', 'تحتمس الثالث قاد معركة مجدو.']], ['الملك رمسيس الثاني', 'k', ['Ramesses II led Kadesh.', 'رمسيس الثاني قاد معركة قادش.']],
    [['ضد أمراء آسيا', 'المتمردين'], 'm', ['Against the rebel princes of Asia: Megiddo.', 'ضد أمراء آسيا: مجدو.']], ['ضد الحيثيين', 'k', ['Against the Hittites: Kadesh.', 'ضد الحيثيين: قادش.']],
    ['هزيمتهم بفلسطين', 'm', ['They were defeated in Palestine: Megiddo.', 'هزيمتهم بفلسطين: مجدو.']], ['في سوريا', 'k', ['In Syria: Kadesh.', 'في سوريا: قادش.']]],
    T('Megiddo or Kadesh?', 'معركة مجدو ولا معركة قادش؟'));
}
async function mission6() {                 // lesson 4: Alexander, the Ptolemies and the Romans (pages 58-61)
  set('card', { lines: ['الإسكندر الأكبر', '(المقدوني)'] });
  g.say(T('Mission 6: Egyptians suffered under the Persians. Alexander the Great took Egypt in 332 BC to secure food for his army and build his empire.', 'المهمة ٦: المصريين عانوا من الفرس. الإسكندر الأكبر سيطر على مصر عام 332 ق.م ليأمّن الغذاء لجيشه ويبني إمبراطوريته.'), 'point');
  await g.next();
  set('card', { lines: ['زار الإسكندر الأكبر', 'معبد الإله … في واحة سيوة'] });
  await ask('Which temple did Alexander visit in the Siwa Oasis?', 'الإسكندر زار معبد أنهي إله في واحة سيوة؟', [op('آمون', 'Amun'), op('أتون', 'Aten'), op('أوزوريس', 'Osiris')], op('آمون', 'Amun'),
    'He showed great respect for the Egyptian religion.', 'أظهر احترامًا للديانة المصرية.', 'The temple of Amun.', `معبد الإله ${kw('آمون')}.`);
  set('card', { lines: ['دولة البطالمة', 'حوالي ثلاثة قرون'] });
  await ask('Why did the Ptolemies build the Lighthouse of Alexandria?', 'ليه البطالمة أنشأوا منارة الإسكندرية؟', [op('لإرشاد السفن ليلًا', 'To guide ships at night'), op('لحماية المكتبة', 'To guard the library'), op('لمراقبة الفيضان', 'To watch the flood')], op('لإرشاد السفن ليلًا', 'To guide ships at night'),
    'Think of ships in the dark.', 'فكّر في المراكب بالليل.', 'To guide ships at night, so trade flourished.', `${kw('لإرشاد السفن ليلًا')}، فازدهرت التجارة.`);
  set('photo', { sub: 'qamh' });
  await ask('Why did the Romans care about wheat in Egypt?', 'ليه الرومان اهتموا بالقمح في مصر؟', [op('لتزويد روما به', 'To supply Rome'), op('لصناعة الورق', 'To make paper'), op('لإطعام الفرس', 'To feed the Persians')], op('لتزويد روما به', 'To supply Rome'),
    'Egypt was a source of food for their empire.', 'مصر كانت مصدر غذاء لإمبراطوريتهم.', 'To supply Rome.', `استغلوا القمح ${kw('لتزويد روما به')}.`);
  const buttons = [{ label: T('Ptolemies', 'البطالمة'), value: 'p', c: 3 }, { label: T('Romans', 'الرومان'), value: 'r', c: 2 }];
  await sortCards(buttons, [
    ['مكتبة الإسكندرية', 'p', ['The Ptolemies founded the Library of Alexandria.', 'البطالمة أسسوا مكتبة الإسكندرية.']], ['منارة الإسكندرية', 'p', ['The Ptolemies built the Lighthouse.', 'البطالمة أنشأوا المنارة.']],
    ['معبد دندرة', 'p', ['The Ptolemies built the temple of Dendera.', 'البطالمة شيدوا معبد دندرة.']], ['المسرح الروماني', 'r', ['The Romans built the Roman Theatre.', 'الرومان أنشأوا المسرح الروماني.'], '@theater'],
    ['معبد رأس السوداء', 'r', ['The Romans built the temple of Ras el-Soda.', 'الرومان أنشأوا معبد رأس السوداء.']], [['الإسكندرية ثاني أكبر', 'مركز تجاري بعد روما'], 'r', ['Under the Romans.', 'في عهد الرومان.']]],
    T('Ptolemies or Romans?', 'البطالمة ولا الرومان؟'));
  set('card', { lines: ['الفتح الإسلامي لمصر', '641 م'] });
  await ask('Why did the Egyptians welcome the Islamic conquest led by Amr ibn al-As?', 'ليه المصريين رحبوا بالفتح الإسلامي على يد عمرو بن العاص؟', [op('ليخلصهم من ظلم الرومان', 'To free them from Roman injustice'), op('ليخلصهم من الفرس', 'To free them from the Persians'), op('ليبني الأهرامات', 'To build pyramids')], op('ليخلصهم من ظلم الرومان', 'To free them from Roman injustice'),
    'The Romans taxed and persecuted them.', 'الرومان فرضوا الضرائب واضطهدوهم.', 'To free them from Roman injustice.', `${kw('ليخلصهم من ظلم الرومان')}.`);
}
async function stage2() {
  const from = Math.max(1, +new URLSearchParams(location.search).get('m') || 1);   // ?m=N opens the missions at mission N (owner's checks)
  const all = [mission1, mission2, mission3, mission4, mission5, mission6];
  for (const m of all.slice(from - 1)) await m();
}

/* ---------- Stage 3 · Speed Round: which age? (lesson 3) ---------- */
async function stage3() {
  set('set', { key: 'civGreat' });
  const ar = s => s;   // plain text: a <span> in the veil is styled as the small question line
  const items = [
    { t: ar('توحيد القطرين على يد الملك مينا'), ans: 'a', why: T('The Archaic age.', 'العصر العتيق.') }, { t: ar('أقدم حكومة مركزية في «من نفر»'), ans: 'a', why: T('The Archaic age.', 'العصر العتيق.') },
    { t: ar('بناء هرم زوسر المدرج'), ans: 'o', why: T('The Old Kingdom.', 'الدولة القديمة.') }, { t: ar('الهرم الأكبر للملك خوفو'), ans: 'o', why: T('The Old Kingdom.', 'الدولة القديمة.') },
    { t: ar('حفر قناة سيزوستريس'), ans: 'm', why: T('The Middle Kingdom.', 'الدولة الوسطى.') }, { t: ar('تشييد سد اللاهون'), ans: 'm', why: T('The Middle Kingdom.', 'الدولة الوسطى.') },
    { t: ar('معركة مجدو'), ans: 'n', why: T('The New Kingdom.', 'الدولة الحديثة.') }, { t: ar('أول معاهدة سلام موثقة في التاريخ'), ans: 'n', why: T('The New Kingdom.', 'الدولة الحديثة.') }];
  await g.speedRound({ items, rounds: 8, ms: 12000,
    buttons: [{ label: T('Archaic', 'العصر العتيق'), value: 'a', c: 0 }, { label: T('Old Kingdom', 'الدولة القديمة'), value: 'o', c: 1 }, { label: T('Middle Kingdom', 'الدولة الوسطى'), value: 'm', c: 2 }, { label: T('New Kingdom', 'الدولة الحديثة'), value: 'n', c: 3 }],
    ask: T('Which age?', 'أنهي عصر؟'), intro: T('Speed Round! An event comes in. Press the age it belongs to. Be quick!', 'جولة السرعة! هيظهر حدث، اضغط على العصر بتاعه. بسرعة!'),
    think: T('Which age?', 'أنهي عصر؟') });
}
