<script>
(() => {
'use strict';
/* Blood Express · the game of Grade 6, Chapter 4 "Blood Circulation and Excretion" . Built on the shared game kit (game_kit.js).
   Stage 1 (Warm Up): the pulse and the heart (book pages 35-37).
   Stage 2 (Missions): 1) follow the blood around the body: oxygen, nutrients, carbon dioxide, waste, the lungs (page 35);
                       2) the cleaning route of the body: kidneys, urine, bladder (page 39);
                       3) where the organs are and how they work together (page 41).
   Stage 3 (Speed Round): which organ is it?
   Every T('English', 'عربي') has both languages. The Arabic science sentences follow the Arabic school book (pages 34-43). */
const A = window.G6BODY, at = A.at;
const T = (en, ar) => SI.T(en, ar == null ? en : ar);
const G = SI.G, P = (m, f) => G(m, f || m);   // Arabic for a boy / for a girl
const RED = A.RED, BLUE = A.BLUE;

/* ---------- the scene: everything is drawn from this one state ---------- */
const sc = { mode: 'loop', hi: null, dot: null, names: [], drop: null };
const WALL = '#eef6fb';
const BX = 210, BY = 2;
/* the blood loop: 300 × 300 drawn at .9, so it is 270 high; the words sit beside each part */
const LK = .9, LX = 105, LY = 6, lx = x => +(LX + x * LK).toFixed(1), ly = y => +(LY + y * LK).toFixed(1);
function loopScene() {
  let dot = null;
  if (sc.dot) { const p = A.loopPoint(sc.dot[0], sc.dot[1]); dot = [p[0], p[1], sc.dot[0] < 2 ? RED : BLUE]; }
  const nm = (id, x, y, s) => sc.names.includes(id) ? A.text(x, y, s, 14, sc.hi === id ? '#1f7a52' : '#1f3d57') : '';
  return `<rect width="420" height="280" fill="${WALL}"/>${at(LX, LY, LK, A.loop({ hi: sc.hi, dot }))}
    ${nm('lungs', 62, ly(48), T('Lungs', `الرئتين`))}${nm('heart', 62, ly(152), T('Heart', `القلب`))}${nm('whole', 62, ly(264), T('Whole body', `جميع أجزاء الجسم`))}
    ${sc.key ? `<g font-family="Nunito,Cairo,Arial,sans-serif" font-size="11.5" font-weight="800" fill="#1f3d57" direction="ltr"><rect x="6" y="166" width="12" height="12" rx="3" fill="${RED}"/><text x="23" y="176">${T('Rich in oxygen', 'غني بالأكسجين')}</text><rect x="6" y="190" width="12" height="12" rx="3" fill="${BLUE}"/><text x="23" y="200">${T('Rich in carbon', 'غني بثاني أكسيد')}</text><text x="23" y="213">${T('dioxide', 'الكربون')}</text></g>` : ''}`;
}
/* the body: the kidneys and the bladder (scale .745), or all the organs (scale .66) */
const KK = .745, kx = x => +(BX + x * KK).toFixed(1), ky = y => +(BY + y * KK).toFixed(1);
const KLAB = { kidneys: ['r', 188, 40], urtube: ['l', 236, -20], bladder: ['r', 272, 20] };
function kidneyScene() {
  let labs = '';
  sc.names.forEach(id => { const [side, y, ex] = KLAB[id], Y = ky(y), on = sc.hi === id, txt = { kidneys: T('Kidneys', `الكليتين`), urtube: T('Tube where urine passes', `القناة التي يمر عبرها البول`), bladder: T('Urinary bladder', `المثانة البولية`) }[id];
    labs += side === 'r' ? `<path d="M${kx(ex)} ${Y}H300" stroke="#1f3d57" stroke-width="1.8"/>${A.text(352, Y + 5, txt, 13.5, on ? '#1f7a52' : '#1f3d57')}`
      : `<path d="M${kx(ex)} ${Y}H120" stroke="#1f3d57" stroke-width="1.8"/>${A.text(62, Y + 5, txt, 13.5, on ? '#1f7a52' : '#1f3d57')}`; });
  return `<rect width="420" height="280" fill="${WALL}"/>${at(BX, BY, KK, A.body({ h: 372 }) + A.urinary({ hi: sc.hi, drop: sc.drop }))}${labs}`;
}
const OK_ = .66, ox = x => +(BX + x * OK_).toFixed(1), oy = y => +(BY + y * OK_).toFixed(1);
const OLAB = { lungs: ['l', 150, -62], heart: ['r', 168, 20], stomach: ['r', 250, 60], small: ['l', 330, -40], large: ['r', 330, 60] };
function organsScene() {
  let labs = '';
  sc.names.forEach(id => { const [side, y, ex] = OLAB[id], Y = oy(y), on = sc.hi === id, txt = { lungs: T('Lungs', `الرئتين`), heart: T('Heart', `القلب`), stomach: T('Stomach', `المعدة`), small: T('Small intestine', `الأمعاء الدقيقة`), large: T('Large intestine', `الأمعاء الغليظة`) }[id];
    labs += side === 'r' ? `<path d="M${ox(ex)} ${Y}H300" stroke="#1f3d57" stroke-width="1.8"/>${A.text(352, Y + 5, txt, 13.5, on ? '#1f7a52' : '#1f3d57')}`
      : `<path d="M${ox(ex)} ${Y}H120" stroke="#1f3d57" stroke-width="1.8"/>${A.text(62, Y + 5, txt, 13.5, on ? '#1f7a52' : '#1f3d57')}`; });
  return `<rect width="420" height="280" fill="${WALL}"/>${at(BX, BY, OK_, A.body({ h: 420 }) + A.organs({ hi: sc.hi }))}${labs}`;
}
const render = () => ({ loop: loopScene, kidney: kidneyScene, organs: organsScene })[sc.mode]();

const g = G4Game({ ch: 'g6c4', logo: '❤️', title: ['Blood Express', 'قطار الدم'], sub: ['Chapter 4 · Blood Circulation and Excretion', 'الفصل ٤ · الدورة الدموية والإخراج'],
  bg: 'science/assets/bg_g6c4.svg', bgc: '#fde3ea', label: ['The blood on its way around the body', 'الدم في رحلته حول الجسم'], render });
const kw = g.kw;
/* the white dot travels along one vessel of the blood loop */
async function ride(seg) {
  await g.tween(1100, k => { sc.dot = [seg, k]; });
}
const wait = async () => { await g.next(); };

/* ---------- Stage 1 · Warm Up: the pulse and the heart ---------- */
async function stage1() {
  Object.assign(sc, { mode: 'loop', hi: 'heart', dot: null, names: ['heart'], key: false }); g.paint();
  g.say(T('Put your finger on your wrist, near the base of your thumb. Can you feel something beating? Let us find out what it is! Where do we feel the <b>pulse</b> in the experiment?', `${P('ضع','ضعي')} إصبعك على معصمك، بالقرب من قاعدة إبهامك. هل ${P('تشعر','تشعرين')} بشيء ينبض؟ هيا نعرف ما هو! أين نشعر <b>بالنبض</b> في التجربة؟`), 'think');
  await g.choice({
    options: [T('On the wrist, near the base of the thumb', `على المعصم، بالقرب من قاعدة الإبهام`), T('On the elbow', `على المرفق`), T('On the knee', `على الركبة`)], correct: T('On the wrist, near the base of the thumb', `على المعصم، بالقرب من قاعدة الإبهام`),
    hint: T('Think of the place where doctors often check it.', `${P('فكّر','فكّري')} في المكان اللي بيقيس فيه الأطباء النبض.`),
    ok: T(`We feel the ${kw('pulse')} at the wrist, near the base of the thumb. You can also feel it at the neck or the ankle.`, `نشعر ${kw('بالنبض')} عند المعصم، بالقرب من قاعدة الإبهام. ويمكنك أيضًا الشعور به عند الرقبة أو الكاحل.`) });
  g.say(T('Count the beats in 1 minute while sitting. Then jump lightly and count again. What happens to your pulse?', `${P('احسب','احسبي')} عدد نبضاتك خلال دقيقة واحدة أثناء الجلوس. بعد ذلك ${P('اقفز','اقفزي')} قفزًا خفيفًا و${P('قِس','قيسي')} نبضك مرة أخرى. ماذا يحدث لنبضك؟`), 'think');
  await g.choice({
    options: [T('It becomes faster', `يصبح أسرع`), T('It becomes slower', `يصبح أبطأ`), T('It stops', `يتوقف`)], correct: T('It becomes faster', `يصبح أسرع`),
    hint: T('Your heart works harder when you exercise.', `قلبك بيشتغل أكتر لما تمارس الرياضة.`),
    ok: T(`When you exercise, the heart beats ${kw('faster')}.`, `عند ممارسة الرياضة ينبض القلب بشكل ${kw('أسرع')}.`) });
  g.say(T('Why does the pulse become faster after exercising?', `لماذا يصبح النبض أسرع بعد ممارسة الرياضة؟`), 'think');
  await g.choice({
    options: [T('To carry more oxygen and nutrients to the whole body quickly', `لنقل المزيد من الأكسجين والعناصر الغذائية إلى جميع أنحاء الجسم بسرعة`), T('To allow the blood to rest slowly', `ليسمح للدم بالراحة ببطء`), T('Because there are not enough nutrients', `لعدم وجود ما يكفي من العناصر الغذائية`)], correct: T('To carry more oxygen and nutrients to the whole body quickly', `لنقل المزيد من الأكسجين والعناصر الغذائية إلى جميع أنحاء الجسم بسرعة`),
    hint: T('The body needs more of them when it moves.', `الجسم بيحتاج منهم أكتر لما بيتحرك.`),
    ok: T(`The heart beats faster to carry more ${kw('oxygen and nutrients')} to the whole body quickly.`, `ينبض القلب بشكل أسرع لنقل المزيد من ${kw('الأكسجين والعناصر الغذائية')} إلى جميع أنحاء الجسم بسرعة.`) });
  g.say(T('What do we call the movement of the heart during pumping out blood?', `ماذا نسمي حركة القلب أثناء ضخ الدم؟`), 'think');
  await g.choice({
    options: [T('A heartbeat', `ضربات القلب`), T('A pulse', `النبض`), T('A breath', `الشهيق`)], correct: T('A heartbeat', `ضربات القلب`),
    hint: T('It is the beat of the heart. The pulse is what we feel at the wrist.', `هي حركة القلب نفسه. أما النبض فهو ما نشعر به عند المعصم.`),
    ok: T(`The movement of the heart during pumping out blood is a ${kw('heartbeat')}. It travels through the blood vessels and can be felt as a ${kw('pulse')} at the wrist.`, `تُسمَّى حركة القلب أثناء ضخ الدم ${kw('ضربات القلب')}. وتنتقل عبر الأوعية الدموية ويمكن الشعور بها على شكل ${kw('نبض')} عند المعصم.`) });
}

/* ---------- Stage 2 · Missions ---------- */
async function mission1() {
  await g.banner(T('Mission 1', `المهمة ١`), T('Follow the blood!', `${P('تتبَّع','تتبَّعي')} الدم!`));
  Object.assign(sc, { mode: 'loop', hi: null, dot: [0, 1], names: [], key: true }); g.paint();
  g.say(T('Here is the blood loop. <b>Red</b> blood is rich in oxygen and <b>blue</b> blood is rich in carbon dioxide. Which organ works like a pump and sends the blood out to the whole body?', `هذه حلقة الدم. الدم <b>الأحمر</b> غني بالأكسجين والدم <b>الأزرق</b> غني بثاني أكسيد الكربون. أي عضو يعمل كمضخة ويرسل الدم إلى جميع أنحاء الجسم؟`), 'point');
  await g.choice({
    options: [T('The heart', `القلب`), T('The stomach', `المعدة`), T('The lungs', `الرئتان`)], correct: T('The heart', `القلب`),
    hint: T('It is constantly beating.', `بينبض طول الوقت.`),
    ok: T(`The ${kw('heart')} works like a pump. The blood is pumped out by the heart.`, `يعمل ${kw('القلب')} كمضخة. يُضخ الدم بواسطة القلب.`),
    reveal: () => { sc.hi = 'heart'; if (!sc.names.includes('heart')) sc.names.push('heart'); g.paint(); } });
  sc.hi = null; sc.dot = [1, 0]; g.paint();
  await ride(1);
  g.say(T('The blood travels to the whole body. What does it carry there?', `ينتقل الدم إلى جميع أنحاء الجسم. ماذا يحمل إليها؟`), 'think');
  await g.choice({
    options: [T('Oxygen and nutrients', `الأكسجين والعناصر الغذائية`), T('Carbon dioxide and waste', `ثاني أكسيد الكربون والفضلات`), T('Muscles', `العضلات`)], correct: T('Oxygen and nutrients', `الأكسجين والعناصر الغذائية`),
    hint: T('Nutrients come from the small intestine, and oxygen from the lungs.', `العناصر الغذائية تُمتَصّ من الأمعاء الدقيقة، والأكسجين تأخذه الرئتان.`),
    ok: T(`The blood carries ${kw('oxygen')} and ${kw('nutrients')} to the whole body.`, `يحمل الدم ${kw('الأكسجين')} و${kw('العناصر الغذائية')} إلى جميع أنحاء الجسم.`),
    reveal: () => { sc.hi = 'whole'; if (!sc.names.includes('whole')) sc.names.push('whole'); g.paint(); } });
  sc.hi = null; sc.dot = [2, 0]; g.paint();
  await ride(2);
  g.say(T('On its way back, the blood is blue. What did it collect from the whole body?', `في طريق العودة يصبح الدم أزرق. ماذا جمع من جميع أجزاء الجسم؟`), 'think');
  await g.choice({
    options: [T('Carbon dioxide and waste', `ثاني أكسيد الكربون والفضلات`), T('Oxygen and nutrients', `الأكسجين والعناصر الغذائية`), T('Food and water', `الطعام والماء`)], correct: T('Carbon dioxide and waste', `ثاني أكسيد الكربون والفضلات`),
    hint: T('Blue means rich in carbon dioxide.', `الأزرق يعني غني بثاني أكسيد الكربون.`),
    ok: T(`The blood collects ${kw('carbon dioxide')} and ${kw('waste')} produced in the body, and returns to the heart again.`, `يجمع الدم ${kw('ثاني أكسيد الكربون')} و${kw('الفضلات')} التي ينتجها الجسم، ثم يعود بها إلى القلب مرةً أخرى.`) });
  sc.dot = [3, 0]; g.paint();
  await ride(3);
  g.say(T('The blood that has returned to the heart is sent to the...', `يُرسَل الدم الذي عاد إلى القلب إلى...`), 'think');
  await g.choice({
    options: [T('Lungs', `الرئتين`), T('Kidneys', `الكليتين`), T('Stomach', `المعدة`)], correct: T('Lungs', `الرئتين`),
    hint: T('They are at the top of the picture.', `هما في أعلى الصورة.`),
    ok: T(`It is sent to the ${kw('lungs')}.`, `يُرسَل إلى ${kw('الرئتين')}.`),
    reveal: () => { sc.hi = 'lungs'; if (!sc.names.includes('lungs')) sc.names.push('lungs'); g.paint(); } });
  g.say(T('What does the blood do in the lungs?', `ماذا يفعل الدم في الرئتين؟`), 'think');
  await g.choice({
    options: [T('Lets out carbon dioxide and takes in oxygen', `يتخلص من ثاني أكسيد الكربون ويتزوَّد بالأكسجين`), T('Lets out oxygen and takes in carbon dioxide', `يتخلص من الأكسجين ويتزوَّد بثاني أكسيد الكربون`), T('Takes in nutrients', `يتزوَّد بالعناصر الغذائية`)], correct: T('Lets out carbon dioxide and takes in oxygen', `يتخلص من ثاني أكسيد الكربون ويتزوَّد بالأكسجين`),
    hint: T('After the lungs the blood becomes red again.', `بعد الرئتين يصبح الدم أحمر من جديد.`),
    ok: T(`In the lungs, the blood lets out ${kw('carbon dioxide')} and takes in ${kw('oxygen')}.`, `في الرئتين يتخلص الدم من ${kw('ثاني أكسيد الكربون')} ويتزوَّد ${kw('بالأكسجين')}.`),
    reveal: async () => { sc.dot = [0, 0]; g.paint(); await ride(0); } });
}
async function mission2() {
  await g.banner(T('Mission 2', `المهمة ٢`), T('The cleaning route of the body', `مسار التنظيف في الجسم`));
  Object.assign(sc, { mode: 'kidney', hi: null, names: [], drop: null }); g.paint();
  g.say(T('The blood carries the waste products produced in the body to two organs on the lower back. What are they?', `ينقل الدم الفضلات التي ينتجها الجسم إلى عضوين في أسفل الظهر. ما هما؟`), 'think');
  await g.choice({
    options: [T('The kidneys', `الكليتان`), T('The lungs', `الرئتان`), T('The stomach', `المعدة`)], correct: T('The kidneys', `الكليتان`),
    hint: T('There are two of them, one on each side of the backbone.', `عددهما اثنان، واحدة على كل جانب من العمود الفقري.`),
    ok: T(`The ${kw('kidneys')}: there are ${kw('two')} kidneys on the lower back on both sides of the backbone.`, `${kw('الكليتان')}: توجد ${kw('كليتان')} في أسفل الظهر على جانبي العمود الفقري.`),
    reveal: () => { sc.hi = 'kidneys'; sc.names.push('kidneys'); g.paint(); } });
  g.say(T('What do the kidneys do with the blood?', `ماذا تفعل الكليتان بالدم؟`), 'think');
  await g.choice({
    options: [T('They filter waste products and excess water out of it', `ترشِّحان منه الفضلات والماء الزائد`), T('They pump it to the whole body', `تضخانه إلى الجسم كله`), T('They take in oxygen for it', `تأخذان له الأكسجين`)], correct: T('They filter waste products and excess water out of it', `ترشِّحان منه الفضلات والماء الزائد`),
    hint: T('They keep the inside of the body clean.', `هما اللي بيخلّوا داخل الجسم نظيف.`),
    ok: T(`The waste products and the excess water are ${kw('filtered out')} from the blood to become ${kw('urine')}.`, `يتم ${kw('ترشيح')} الفضلات والماء الزائد من الدم لتكوين ${kw('البول')}.`) });
  g.say(T('The urine passes through thin tubes. Where is it temporarily stored?', `يمر البول عبر قناتين رفيعتين. أين يُخزَّن مؤقتًا؟`), 'think');
  sc.hi = 'urtube'; sc.names.push('urtube'); g.paint();
  await g.tween(900, k => { sc.drop = [+(-16 + k * 4).toFixed(1), +(214 + k * 36).toFixed(1)]; });
  await g.choice({
    options: [T('In the bladder', `في المثانة`), T('In the heart', `في القلب`), T('In the stomach', `في المعدة`)], correct: T('In the bladder', `في المثانة`),
    hint: T('It is a small bag at the bottom.', `هي كيس صغير في الأسفل.`),
    ok: T(`The urine is temporarily stored in the ${kw('bladder')}.`, `يُخزَّن البول مؤقتًا في ${kw('المثانة')}.`),
    reveal: () => { sc.hi = 'bladder'; sc.names.push('bladder'); sc.drop = [0, 276]; g.paint(); } });
  g.say(T('And then? What happens to the urine after the bladder?', `وبعد ذلك؟ ماذا يحدث للبول بعد المثانة؟`), 'think');
  await g.choice({
    options: [T('It is discharged out of the body', `يُطرد خارج الجسم`), T('It returns to the blood', `يعود إلى الدم`), T('It goes to the lungs', `ينتقل إلى الرئتين`)], correct: T('It is discharged out of the body', `يُطرد خارج الجسم`),
    hint: T('That is how the inside of the body is kept clean.', `بالطريقة دي يفضل داخل الجسم نظيف.`),
    ok: T(`The urine is ${kw('discharged out of the body')}. The inside of the body is kept clean by discharging urine.`, `يُطرد البول ${kw('خارج الجسم')}. يبقى داخل الجسم نظيفًا من خلال طرد (إخراج) البول خارج الجسم.`),
    reveal: async () => { await g.tween(700, k => { sc.drop = [0, +(276 + k * 24).toFixed(1)]; }); sc.drop = null; g.paint(); } });
}
async function mission3() {
  await g.banner(T('Mission 3', `المهمة ٣`), T('Where are the organs?', `أين تقع الأعضاء؟`));
  Object.assign(sc, { mode: 'organs', hi: null, names: [] }); g.paint();
  g.say(T('Many organs are lined up closely without gaps. Which two organs are in the chest, protected by the ribs? <b>Tap the right answer.</b>', `تصطف أعضاء كثيرة متقاربة دون فراغات. أي عضوين يقعان في الصدر وتحميهما الأضلاع؟ <b>${P('اختر','اختاري')} الإجابة الصحيحة.</b>`), 'think');
  await g.choice({
    options: [T('Heart and lungs', `القلب والرئتان`), T('Stomach and small intestine', `المعدة والأمعاء الدقيقة`), T('Kidneys and bladder', `الكليتان والمثانة`)], correct: T('Heart and lungs', `القلب والرئتان`),
    hint: T('The lungs are on the left and right, and the other organ is sandwiched between them.', `الرئتان على اليمين واليسار، والعضو الآخر بينهما.`),
    ok: T(`The ${kw('lungs')} are on the left and right, and the ${kw('heart')} is sandwiched between them.`, `توجد ${kw('الرئتان')} (اليمنى واليسرى)، ويقع ${kw('القلب')} بينهما.`),
    reveal: () => { sc.hi = 'heart'; sc.names.push('lungs', 'heart'); g.paint(); } });
  g.say(T('Which organ is at the top of the abdomen?', `أي عضو يقع في الجزء العلوي من البطن؟`), 'think');
  await g.choice({
    options: [T('The stomach', `المعدة`), T('The small intestine', `الأمعاء الدقيقة`), T('The large intestine', `الأمعاء الغليظة`)], correct: T('The stomach', `المعدة`),
    hint: T('It is the bag at the end of the food pipe.', `هي الكيس اللي في آخر المريء.`),
    ok: T(`The ${kw('stomach')} is at the top of the abdomen.`, `تقع ${kw('المعدة')} في الجزء العلوي من البطن.`),
    reveal: () => { sc.hi = 'stomach'; sc.names.push('stomach'); g.paint(); } });
  g.say(T('The long organ below the stomach is the small intestine. Which organ is <b>around</b> it?', `العضو الطويل أسفل المعدة هو الأمعاء الدقيقة. أي عضو <b>يحيط</b> بها؟`), 'think');
  await g.choice({
    options: [T('The large intestine', `الأمعاء الغليظة`), T('The heart', `القلب`), T('The kidney', `الكلية`)], correct: T('The large intestine', `الأمعاء الغليظة`),
    hint: T('It is the wide tube.', `هي الأنبوبة العريضة.`),
    ok: T(`The ${kw('large intestine')} is around the small intestine.`, `تحيط ${kw('الأمعاء الغليظة')} بالأمعاء الدقيقة.`),
    reveal: () => { sc.hi = 'large'; sc.names.push('small', 'large'); g.paint(); } });
  g.say(T('What connects all the organs, so that the whole body works together?', `ما الذي يربط جميع الأعضاء ببعضها ليعمل الجسم بأكمله معًا؟`), 'think');
  await g.choice({
    options: [T('Blood vessels', `الأوعية الدموية`), T('The ribs', `الأضلاع`), T('The backbone', `العمود الفقري`)], correct: T('Blood vessels', `الأوعية الدموية`),
    hint: T('The blood flows through them.', `الدم بيجري جواها.`),
    ok: T(`All organs are connected by ${kw('blood vessels')}. The blood carries nutrients and oxygen and collects waste products.`, `تتصل جميع الأعضاء بعضها ببعض عن طريق ${kw('الأوعية الدموية')}. يحمل الدم العناصر الغذائية والأكسجين ويجمع الفضلات.`),
    reveal: () => { sc.hi = null; g.paint(); } });
}
async function stage2() { await mission1(); await mission2(); await mission3(); }

/* ---------- Stage 3 · Speed Round: which organ? ---------- */
const NAME = { heart: T('Heart', `القلب`), lungs: T('Lungs', `الرئتين`), kidneys: T('Kidneys', `الكليتين`), bladder: T('Bladder', `المثانة`) };
const SPEED = [
  { t: T('It works like a pump', `يعمل كمضخة`), ans: 'heart' },
  { t: T('It is constantly beating', `ينبض باستمرار`), ans: 'heart' },
  { t: T('It is sandwiched between the left and right lungs', `يقع بين الرئتين اليمنى واليسرى`), ans: 'heart' },
  { t: T('The blood lets out carbon dioxide and takes in oxygen here', `يتخلص الدم هنا من ثاني أكسيد الكربون ويتزوَّد بالأكسجين`), ans: 'lungs' },
  { t: T('There is a left one and a right one in the chest', `توجد منهما واحدة يمنى وواحدة يسرى في الصدر`), ans: 'lungs' },
  { t: T('They filter waste products out of the blood', `ترشِّحان الفضلات من الدم`), ans: 'kidneys' },
  { t: T('There are two, one on each side of the backbone', `عددهما اثنان، واحدة على كل جانب من العمود الفقري`), ans: 'kidneys' },
  { t: T('They make urine', `تنتجان البول`), ans: 'kidneys' },
  { t: T('Urine is temporarily stored here', `يُخزَّن البول هنا مؤقتًا`), ans: 'bladder' },
  { t: T('The urine is discharged out of the body after being stored here', `يُطرد البول خارج الجسم بعد تخزينه هنا`), ans: 'bladder' }
];
async function stage3() {
  Object.assign(sc, { mode: 'organs', hi: null, names: [] }); g.paint();
  const some = (k, n) => g.shuffle(SPEED.filter(s => s.ans === k)).slice(0, n);
  const show = it => { sc.hi = null; if (it && (it.ans === 'kidneys' || it.ans === 'bladder')) { sc.mode = 'kidney'; sc.names = []; } else { sc.mode = 'organs'; sc.names = []; } g.paint(); };
  await g.speedRound({
    items: some('heart', 2).concat(some('lungs', 2), some('kidneys', 2), some('bladder', 2)), rounds: 8,
    buttons: [{ label: NAME.heart, value: 'heart', c: 0 }, { label: NAME.lungs, value: 'lungs', c: 1 }, { label: NAME.kidneys, value: 'kidneys', c: 3 }, { label: NAME.bladder, value: 'bladder', c: 2 }],
    ask: T('Which organ is it?', `أي عضو هذا؟`),
    intro: T('Speed Round! I will say something about one organ. Is it the <b>heart</b>, the <b>lungs</b>, the <b>kidneys</b> or the <b>bladder</b>? Press the right button before time runs out. 8 rounds!', `جولة السرعة! هقول معلومة عن عضو. هل هو <b>القلب</b> ولا <b>الرئتان</b> ولا <b>الكليتان</b> ولا <b>المثانة</b>؟ ${P('اضغط','اضغطي')} على الزرار الصح قبل ما الوقت يخلص. ٨ جولات!`),
    think: T('Heart, lungs, kidneys or bladder?', `القلب، الرئتان، الكليتان، أم المثانة؟`),
    show: it => show(it), reveal: it => { show(it); sc.hi = it.ans === 'kidneys' ? 'kidneys' : it.ans === 'bladder' ? 'bladder' : it.ans; g.paint(); }
  });
}

g.run({
  intro: T(`Hi, <b>${g.name()}</b>! Today we follow the <b>blood</b> on its way around the body, find out how the kidneys clean it, and see where the organs are.`, `أهلًا يا <b>${g.name()}</b>! النهارده هنتتبَّع <b>الدم</b> في رحلته حول الجسم، ونعرف إزاي بتنظّفه الكليتان، ونشوف أماكن الأعضاء.`),
  stages: [{ name: T('Warm Up', `التسخين`), fn: stage1 }, { name: T('Missions', `المهمات`), fn: stage2 }, { name: T('Speed Round', `جولة السرعة`), fn: stage3 }],
  done: { title: T('Blood expert!', `${P('بقيت خبير الدم!','بقيتي خبيرة الدم!')}`),
    text: T('The heart pumps the blood to the whole body. The blood carries <b>oxygen</b> and <b>nutrients</b>, collects <b>carbon dioxide</b> and waste, and goes to the lungs. The <b>kidneys</b> filter waste products out of the blood to make <b>urine</b>, which is stored in the <b>bladder</b>. All the organs are connected by blood vessels.', `يضخ القلب الدم إلى جميع أنحاء الجسم. يحمل الدم <b>الأكسجين</b> و<b>العناصر الغذائية</b>، ويجمع <b>ثاني أكسيد الكربون</b> والفضلات، ثم يذهب إلى الرئتين. تُرشِّح <b>الكليتان</b> الفضلات من الدم لتكوين <b>البول</b> الذي يُخزَّن في <b>المثانة</b>. وتتصل جميع الأعضاء بالأوعية الدموية.`) }
}).catch(err => console.error(err));
window.__bloodtrip = { sc, render };
})();
</script>
