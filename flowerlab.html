<script>
(() => {
'use strict';
/* Flower Lab · the game of Chapter 5 "From Flower to Fruit" (Grade 5). Built on the shared game kit (game_kit.js).
   Stage 1 (Warm Up): the luffa plant: male flower (stamen, pollen) and female flower (pistil, swelling) (book pages 52-54)
   Stage 2 (Missions): 1) use a microscope (pages 55-59); 2) pollination, bees and the fruit (pages 60-62); 3) what happens after pollination
   Stage 3 (Speed Round): male flower or female flower?
   Every T('English', 'عربي') has both languages. The Arabic wording is a first draft written from the English book: it needs the owner’s review against the Arabic book. */
const T = SI.T, G = SI.G;
const P = (m, f) => G(m, f || m);   // Arabic for a boy / for a girl
const A = window.CH5ART, lerp = (a, b, t) => a + (b - a) * t;
const VW = 420, VH = 280;
const sc = { mode: 'plant', dots: true, bee: null, mag: null, dx: 0, slide: false, light: false, fruit: 0, hi: null };
const ring = (cx, cy, rx, ry) => `<ellipse class="ring" cx="${cx}" cy="${cy}" rx="${rx}" ry="${ry}"/>`;
const rrect = (x, y, w, h) => `<rect class="ring" x="${x}" y="${y}" width="${w}" height="${h}" rx="14"/>`;

const FX = 120, MX = 300, FK = 1.45, FY = 256;   // the two flowers in the plant scene
const leafBlob = (x, y, rx, ry, rot, c = '#8fd07f') => `<ellipse cx="${x}" cy="${y}" rx="${rx}" ry="${ry}" transform="rotate(${rot} ${x} ${y})" fill="${c}" stroke="#4f9f52" stroke-width="2.4"/>`;
const garden = () => `<rect width="${VW}" height="${VH}" fill="#e3f4f8"/><rect y="250" width="${VW}" height="30" fill="#cfeaa6"/>
  ${leafBlob(40, 214, 34, 18, -30)}${leafBlob(380, 210, 34, 18, 30)}`;
const hl = (x, y, rx, ry) => `<ellipse cx="${x}" cy="${y}" rx="${rx}" ry="${ry}" fill="rgba(46,158,107,.18)" stroke="#2e9e6b" stroke-width="4"/>`;

function plantScene() {
  return garden() + `<g transform="translate(${FX} ${FY}) scale(${FK})">${A.flower({ sex: 'female' })}</g><g transform="translate(${MX} ${FY}) scale(${FK})">${A.flower({ sex: 'male', dots: sc.dots })}</g>
    ${sc.bee ? `<g transform="translate(${sc.bee.x} ${sc.bee.y}) scale(1.25)">${A.bee()}</g>` : ''}${sc.hi === 'swelling' ? hl(FX, 196, 30, 50) : ''}${sc.hi === 'stamen' ? hl(MX, 126, 22, 42) : ''}`;
}
const MX0 = 120, MY0 = 264, MK = .95;
function microScene() {
  const field = sc.mag ? `<g transform="translate(325 108) scale(1.35)">${A.field({ mag: sc.mag, dx: sc.dx })}</g>` : '';
  return `<rect width="${VW}" height="${VH}" fill="#e9f1f5"/><rect y="262" width="${VW}" height="18" fill="#e4c394"/>
    <g transform="translate(${MX0} ${MY0}) scale(${MK})">${A.microscope({ light: sc.light })}</g>
    ${sc.slide ? `<g transform="translate(${MX0} ${MY0 - 68 * MK}) scale(.62)">${A.slideKit({ drop: true, pollen: true, cover: true })}</g>` : ''}${field}
    <text x="325" y="216" text-anchor="middle" font-family="Nunito,sans-serif" font-size="15" font-weight="800" fill="#1f3d57">${sc.mag === 'high' ? T('High magnification', 'تكبير عالٍ') : sc.mag === 'low' ? T('Low magnification', 'تكبير منخفض') : ''}</text>`;
}
function fruitScene() {
  return garden() + `<g transform="translate(125 178) scale(1.15)">${A.flower({ sex: 'female', wither: true, fruit: sc.fruit })}</g>
    <g transform="translate(295 236) scale(1.15)">${A.flower({ sex: 'female', wither: true, fruit: 0 })}</g>
    <circle cx="125" cy="28" r="15" fill="#fff8ea" stroke="#cdb98f" stroke-width="2"/><text x="125" y="34" text-anchor="middle" font-family="Nunito,sans-serif" font-size="18" font-weight="900" fill="#1f3d57" direction="ltr">${T('A', 'أ')}</text>
    <circle cx="295" cy="28" r="15" fill="#fff8ea" stroke="#cdb98f" stroke-width="2"/><text x="295" y="34" text-anchor="middle" font-family="Nunito,sans-serif" font-size="18" font-weight="900" fill="#1f3d57" direction="ltr">${T('B', 'ب')}</text>`;
}
const render = () => ({ plant: plantScene, micro: microScene, fruit: fruitScene })[sc.mode]();

const g = G4Game({ ch: 'ch5', logo: '🌼', title: ['Flower Lab', 'معمل الزهور'], sub: ['Chapter 5 · From Flower to Fruit', 'الفصل ٥ · من الزهرة إلى الثمرة'],
  bg: 'science/assets/bg_ch5.svg', bgc: '#fdf3c9', label: ['A luffa plant with a female flower and a male flower', 'نبات لوف عليه زهرة مؤنثة وزهرة مذكرة'], render });
const kw = g.kw;
const mring = (cx, cy, rx, ry) => ring(MX0 + cx * MK, MY0 + cy * MK, rx * MK, ry * MK);

/* ---------- Stage 1 · Warm Up: the luffa flowers ---------- */
async function stage1() {
  Object.assign(sc, { mode: 'plant', dots: true, bee: null, hi: null }); g.paint();
  g.veil(`<small>${T('Key Vocabulary', 'كلمات مهمة')}</small><strong>${T('stamen · pistil · pollen · pollination · microscope', 'السداة · الكربلة · حبوب اللقاح · التلقيح · المجهر')}</strong><span>${T('We will use these words today.', 'هنستخدم الكلمات دي النهارده.')}</span>`);
  g.say(T(`Luffa and pumpkin plants have ${kw('two types of flowers')} on one plant. Let’s find out how they are different!`, `نباتات اللوف والقرع لها ${kw('نوعان من الزهور')} على النبات الواحد. يلّا نعرف إيه الفرق بينهما!`), 'wave');
  await g.next(T('Let’s look ▸', 'يلّا نشوف ◂'));
  g.veil(null);
  g.say(T('Tap the <b>female</b> flower: it has a small swelling at its base that will become a fruit.', P('اضغط على الزهرة <b>المؤنثة</b>: لها انتفاخ صغير عند قاعدتها سيصبح ثمرة.', 'اضغطي على الزهرة <b>المؤنثة</b>: لها انتفاخ صغير عند قاعدتها سيصبح ثمرة.')), 'think');
  await g.spot([{ id: 'female', name: T('The flower on the left', 'الزهرة التي على اليسار'), ring: rrect(FX - 70, 70, 140, 190) }, { id: 'male', name: T('The flower on the right', 'الزهرة التي على اليمين'), ring: rrect(MX - 70, 40, 140, 220) }], 'female', {
    hint: T('Look for the swelling just below the petals.', 'دوّر على الانتفاخ أسفل البتلات مباشرة.'),
    ok: T(`The ${kw('female flower')} has a pistil in the center and a ${kw('swelling')} at its base that will become a fruit.`, `الزهرة ${kw('المؤنثة')} لها ${kw('كربلة')} في الوسط و${kw('انتفاخ')} عند القاعدة سيصبح ثمرة.`),
    reveal: () => { sc.hi = 'swelling'; g.paint(); } });
  sc.hi = null; g.paint();
  g.say(T('Now the male flower. Tap the part in its center that makes yellow powder.', P('دلوقتي الزهرة المذكرة. اضغط على الجزء الذي في وسطها ويصنع المسحوق الأصفر.', 'دلوقتي الزهرة المذكرة. اضغطي على الجزء الذي في وسطها ويصنع المسحوق الأصفر.')), 'think');
  await g.spot([{ id: 'stamen', name: T('The part in the middle of the right flower', 'الجزء الذي في وسط الزهرة اليمنى'), ring: ring(MX, 126, 22, 40) }, { id: 'pistil', name: T('The green part in the middle of the left flower', 'الجزء الأخضر في وسط الزهرة اليسرى'), ring: ring(FX, 128, 22, 40) }], 'stamen', {
    hint: T('The male flower is the one without a swelling.', 'الزهرة المذكرة هي التي ليس لها انتفاخ.'),
    ok: T(`The ${kw('stamen')} is in the center of the male flower. It makes yellow ${kw('pollen')}.`, `${kw('السداة')} في وسط الزهرة المذكرة، وتصنع ${kw('حبوب اللقاح')} الصفراء.`),
    reveal: () => { sc.hi = 'stamen'; g.paint(); } });
  sc.hi = null; g.paint();
  g.say(T('What do we call the yellow powder?', 'ماذا نُسمّي المسحوق الأصفر؟'), 'think');
  await g.choice({
    options: [T('Pollen', 'حبوب اللقاح'), T('Pistil', 'الكربلة'), T('Sepal', 'السبلة')], correct: T('Pollen', 'حبوب اللقاح'),
    hint: T('It is made by the stamen.', 'بتتصنع في السداة.'),
    ok: T(`The yellow powder is called ${kw('pollen')}.`, `المسحوق الأصفر اسمه ${kw('حبوب اللقاح')}.`) });
  g.say(T('What will the swelling at the base of the female flower become in the future?', 'ماذا سيصبح الانتفاخ الذي عند قاعدة الزهرة المؤنثة في المستقبل؟'), 'think');
  await g.choice({
    options: [T('A fruit', 'ثمرة'), T('A stamen', 'سداة'), T('Pollen', 'حبوب لقاح')], correct: T('A fruit', 'ثمرة'),
    hint: T('Think about what grows where the swelling is.', 'فكّر في اللي بيكبر مكان الانتفاخ.'),
    ok: T(`The swelling will become a ${kw('fruit')}.`, `الانتفاخ سيصبح ${kw('ثمرة')}.`) });
}

/* ---------- Stage 2 · Missions ---------- */
async function mission1() {
  await g.banner(T('Mission 1', 'المهمة ١'), T('Use the microscope', 'استخدام المجهر'));
  Object.assign(sc, { mode: 'micro', mag: null, slide: false, light: false, dx: 0 }); g.paint();
  g.say(T('Pollen is tiny! A <b>microscope</b> makes it look bigger. First, put the microscope in a flat, bright place away from direct sunlight. Then tap the part you adjust to make the view bright.', P('حبوب اللقاح صغيرة جدًّا! <b>المجهر</b> يجعلها تبدو أكبر. أولًا، ضع المجهر في مكان مستوٍ ومضيء بعيدًا عن أشعة الشمس المباشرة. بعدين اضغط على الجزء الذي تضبطه ليصبح المجال مضيئًا.', 'حبوب اللقاح صغيرة جدًّا! <b>المجهر</b> يجعلها تبدو أكبر. أولًا، ضعي المجهر في مكان مستوٍ ومضيء بعيدًا عن أشعة الشمس المباشرة. بعدين اضغطي على الجزء الذي تضبطينه ليصبح المجال مضيئًا.')), 'think');
  await g.spot([{ id: 'reflector', name: T('The mirror at the bottom', 'المرآة في الأسفل'), ring: mring(-14, -40, 32, 13) }, { id: 'stage', name: T('The platform', 'المنضدة'), ring: mring(0, -57, 64, 10) }, { id: 'eyepiece', name: T('The lens at the top', 'العدسة العلوية'), ring: mring(0, -218, 20, 20) }], 'reflector', {
    hint: T('Light comes from below.', 'الضوء بييجي من تحت.'),
    ok: T(`You adjust the angle of the ${kw('reflector')} to make the view bright.`, `تضبط زاوية ${kw('العاكس')} ليصبح المجال مضيئًا.`),
    reveal: () => { sc.light = true; g.paint(); } });
  g.say(T('Now put the prepared slide with the pollen on a part of the microscope. Tap it.', P('دلوقتي ضع الشريحة المحضَّرة وعليها حبوب اللقاح على جزء من المجهر. اضغط عليه.', 'دلوقتي ضعي الشريحة المحضَّرة وعليها حبوب اللقاح على جزء من المجهر. اضغطي عليه.')), 'think');
  await g.spot([{ id: 'stage', name: T('The platform', 'المنضدة'), ring: mring(0, -57, 64, 10) }, { id: 'nosepiece', name: T('The disc that holds the lenses', 'القرص الذي يحمل العدسات'), ring: mring(0, -118, 34, 12) }, { id: 'arm', name: T('The curved handle', 'المقبض المنحني'), ring: mring(40, -170, 22, 30) }], 'stage', {
    hint: T('It is the flat platform.', 'هي المنضدة المسطحة.'),
    ok: T(`The prepared slide goes on the ${kw('stage')}.`, `توضع الشريحة المحضَّرة على ${kw('المنضدة')}.`),
    reveal: () => { sc.slide = true; g.paint(); } });
  g.say(T('Which objective lens do we set first?', 'أي عدسة شيئية نضبطها أولًا؟'), 'think');
  await g.choice({
    options: [T('The lowest magnification', 'أقل تكبير'), T('The highest magnification', 'أعلى تكبير')], correct: T('The lowest magnification', 'أقل تكبير'),
    hint: T('At low magnification the view is wider.', 'مع التكبير المنخفض يكون المجال أوسع.'),
    ok: T(`Start with ${kw('low magnification')}: the view is wide and bright, so it is easier to find what you want to observe.`, `ابدأ بـ${kw('تكبير منخفض')}: المجال واسع ومضيء، فيسهل العثور على ما تريد ملاحظته.`),
    reveal: () => { sc.mag = 'low'; g.paint(); } });
  g.say(T('Now turn the adjustment knob to bring the slide and the objective lens close together. Why do we look from the <b>side</b> while doing this?', 'دلوقتي لفّ قرص الضبط لتقريب الشريحة من العدسة الشيئية. ليه ننظر من <b>الجانب</b> أثناء ذلك؟'), 'think');
  await g.choice({
    options: [T('So the lens does not hit the slide and break it', 'حتى لا تصطدم العدسة بالشريحة فتنكسر'), T('To make the view brighter', 'لتصبح الصورة أكثر إضاءة'), T('To keep air bubbles out', 'لمنع دخول فقاعات الهواء')],
    correct: T('So the lens does not hit the slide and break it', 'حتى لا تصطدم العدسة بالشريحة فتنكسر'),
    hint: T('Think about two things that could touch each other.', 'فكّر في شيئين ممكن يلمسوا بعض.'),
    ok: T('To prevent the objective lens from hitting the prepared slide and breaking it.', 'لمنع العدسة الشيئية من الاصطدام بالشريحة المحضَّرة وكسرها.') });
  g.say(T('Then look through the eyepiece and adjust the focus while moving the lens <b>away</b> from the slide. The eyepiece lens is 10× and the objective lens is 40×. What is the magnification?', 'بعدين انظر من العدسة العينية واضبط الوضوح أثناء إبعاد العدسة <b>عن</b> الشريحة. العدسة العينية 10× والعدسة الشيئية 40×. كم تكبير المجهر؟'), 'think');
  await g.choice({
    options: ['400×', '50×', '30×'], correct: '400×',
    hint: T('Magnification = eyepiece × objective.', 'التكبير = العدسة العينية × العدسة الشيئية.'),
    ok: T(`${kw('10 × 40 = 400')}: the microscope magnifies 400 times.`, `${kw('١٠ × ٤٠ = ٤٠٠')}: يكبّر المجهر ٤٠٠ مرة.`) });
  sc.mag = 'high'; g.paint();
  g.say(T('Now we changed to high magnification. How does the view look?', 'دلوقتي غيّرنا إلى تكبير عالٍ. كيف يبدو المجال؟'), 'think');
  await g.choice({
    options: [T('Narrow and dark', 'ضيق ومظلم'), T('Wide and bright', 'واسع ومضيء')], correct: T('Narrow and dark', 'ضيق ومظلم'),
    hint: T('Compare it with the low magnification picture.', 'قارنه بصورة التكبير المنخفض.'),
    ok: T(`High magnification: the view is ${kw('narrow')} and ${kw('dark')}. Low magnification: wide and bright.`, `التكبير العالي: المجال ${kw('ضيق')} و${kw('مظلم')}. التكبير المنخفض: واسع ومضيء.`) });
  g.say(T('In a microscope, things look upside down and reversed left to right. You want the pollen to move to the right in the view. Which way do you move the slide?', 'في المجهر تظهر الأشياء مقلوبة ومعكوسة يمينًا ويسارًا. عايز حبوب اللقاح تتحرك لليمين في المجال. ناحية أنهي اتجاه تحرّك الشريحة؟'), 'think');
  await g.choice({
    options: [T('To the left: the opposite direction', 'لليسار: الاتجاه المعاكس'), T('To the right: the same direction', 'لليمين: نفس الاتجاه')], correct: T('To the left: the opposite direction', 'لليسار: الاتجاه المعاكس'),
    hint: T('The picture is reversed.', 'الصورة معكوسة.'),
    ok: T(`You move the object in the ${kw('opposite direction')} you want it to go.`, `تحرّك الجسم في ${kw('الاتجاه المعاكس')} للاتجاه الذي تريده.`),
    reveal: () => { g.tween(900, k => { sc.dx = 22 * k; }); } });
}
async function mission2() {
  await g.banner(T('Mission 2', 'المهمة ٢'), T('From flower to fruit', 'من الزهرة إلى الثمرة'));
  Object.assign(sc, { mode: 'plant', dots: false, hi: null, bee: { x: MX + 14, y: 112 } }); g.paint();
  g.say(T('A bee visits the male flower and picks up pollen. What carries pollen from flower to flower for luffa plants?', 'نحلة تزور الزهرة المذكرة وتحمل حبوب اللقاح. ما الذي ينقل حبوب اللقاح من زهرة إلى أخرى في نبات اللوف؟'), 'think');
  await g.choice({
    options: [T('Bugs like bees', 'حشرات مثل النحل'), T('The soil', 'التربة'), T('The seeds', 'البذور')], correct: T('Bugs like bees', 'حشرات مثل النحل'),
    hint: T('Look at who is flying!', 'بصّ مين اللي بيطير!'),
    ok: T(`Bugs like ${kw('bees')} carry pollen to pollinate luffa flowers.`, `تحمل حشرات مثل ${kw('النحل')} حبوب اللقاح لتلقيح أزهار اللوف.`),
    reveal: async () => { await g.tween(1400, k => { sc.bee = { x: lerp(MX + 14, FX + 8, k), y: 112 - Math.sin(k * Math.PI) * 26 }; }); } });
  g.say(T('The pollen from the male flower attached to the tip of the pistil in the female flower. What is this called?', 'حبوب اللقاح من الزهرة المذكرة التصقت بقمة الكربلة في الزهرة المؤنثة. ماذا يُسمّى هذا؟'), 'think');
  await g.choice({
    options: [T('Pollination', 'التلقيح'), T('Germination', 'الإنبات'), T('Magnification', 'التكبير')], correct: T('Pollination', 'التلقيح'),
    hint: T('It starts with the same letters as pollen.', 'بتبدأ بنفس حروف حبوب اللقاح.'),
    ok: T(`When pollen from a male flower attaches to the tip of a pistil in a female flower, it is called ${kw('pollination')}.`, `عندما تلتصق حبوب اللقاح من زهرة مذكرة بقمة الكربلة في زهرة مؤنثة، يُسمّى ذلك ${kw('التلقيح')}.`) });
  Object.assign(sc, { mode: 'fruit', fruit: 0 }); g.paint();
  g.say(T('Two female flowers had paper bags on them. Flower A got pollen from a male flower on its pistil. Flower B did not. After a few days, tap the flower that grew a <b>fruit</b>.', P('زهرتان مؤنثتان كان عليهما أكياس ورقية. الزهرة (أ) وضعنا على مدقتها حبوب لقاح من زهرة مذكرة. الزهرة (ب) لا. بعد أيام اضغط على الزهرة التي نمت لها <b>ثمرة</b>.', 'زهرتان مؤنثتان كان عليهما أكياس ورقية. الزهرة (أ) وضعنا على مدقتها حبوب لقاح من زهرة مذكرة. الزهرة (ب) لا. بعد أيام اضغطي على الزهرة التي نمت لها <b>ثمرة</b>.')), 'think');
  g.tween(1600, k => { sc.fruit = k; });
  await g.spot([{ id: 'A', name: T('Flower A', 'الزهرة (أ)'), ring: rrect(55, 40, 140, 220) }, { id: 'B', name: T('Flower B', 'الزهرة (ب)'), ring: rrect(225, 60, 140, 200) }], 'A', {
    hint: T('Which flower was pollinated?', 'أنهي زهرة اتلقّحت؟'),
    ok: T(`To become a fruit, ${kw('pollination')} is necessary. Flower A was pollinated, so its swelling grew into a fruit.`, `لكي تصبح الزهرة ثمرة، ${kw('التلقيح')} ضروري. الزهرة (أ) تلقّحت، فنما انتفاخها وصار ثمرة.`) });
  g.say(T('What happens to a female flower that is not pollinated, like flower B?', 'ماذا يحدث للزهرة المؤنثة التي لا تُلقَّح مثل الزهرة (ب)؟'), 'think');
  await g.choice({
    options: [T('It turns yellow, and the fruit falls off without growing', 'تصفرّ، وتسقط الثمرة دون أن تنمو'), T('The fruit slowly grows bigger', 'تنمو الثمرة ببطء وتكبر'), T('It just becomes a seed as it is', 'تصبح بذرة كما هي')],
    correct: T('It turns yellow, and the fruit falls off without growing', 'تصفرّ، وتسقط الثمرة دون أن تنمو'),
    hint: T('Look at flower B.', 'بصّ على الزهرة (ب).'),
    ok: T('A flower that is not pollinated turns yellow, and the fruit falls off without growing.', 'الزهرة التي لا تُلقَّح تصفرّ، وتسقط الثمرة دون أن تنمو.') });
}
async function mission3() {
  await g.banner(T('Mission 3', 'المهمة ٣'), T('What happens after pollination?', 'ماذا يحدث بعد التلقيح؟'));
  Object.assign(sc, { mode: 'fruit', fruit: 1 }); g.paint();
  g.say(T('Choose the correct order of the changes after pollination.', 'اختر الترتيب الصحيح للتغيرات بعد التلقيح.'), 'think');
  const o1 = T('Pollination → the swelling at the base grows → seeds are made inside the fruit', 'التلقيح ← ينمو الانتفاخ الذي عند القاعدة ← تتكوّن البذور داخل الثمرة');
  await g.choice({
    options: [o1, T('Seeds are made inside the fruit → pollination → the swelling at the base grows', 'تتكوّن البذور داخل الثمرة ← التلقيح ← ينمو الانتفاخ الذي عند القاعدة'), T('The swelling at the base grows → seeds are made inside the fruit → pollination', 'ينمو الانتفاخ الذي عند القاعدة ← تتكوّن البذور داخل الثمرة ← التلقيح')], correct: o1, mix: true,
    hint: T('Pollination must come first.', 'لازم التلقيح يجي الأول.'),
    ok: T(`After pollination, the base of the pistil becomes a ${kw('fruit')}, and ${kw('seeds')} are made inside. Then the seeds sprout and grow, passing on the plant’s life.`, `بعد التلقيح تصبح قاعدة الكربلة ${kw('ثمرة')}، وتتكوّن ${kw('بذور')} بداخلها. بعد ذلك تنبت البذور وتنمو، فتنتقل حياة النبات إلى جيل جديد.`) });
}
async function stage2() { await mission1(); await mission2(); await mission3(); }

/* ---------- Stage 3 · Speed Round: male flower or female flower? ---------- */
const SPEED = [
  { t: T('It has a stamen in the center', 'له سداة في الوسط'), ans: 'male' },
  { t: T('It makes yellow pollen', 'يصنع حبوب اللقاح الصفراء'), ans: 'male' },
  { t: T('It has no swelling at its base', 'ليس له انتفاخ عند القاعدة'), ans: 'male' },
  { t: T('A bee takes pollen from it', 'تأخذ النحلة حبوب اللقاح منه'), ans: 'male' },
  { t: T('It has a pistil in the center', 'لها كربلة في الوسط'), ans: 'female' },
  { t: T('It has a swelling at its base', 'لها انتفاخ عند القاعدة'), ans: 'female' },
  { t: T('The swelling will become a fruit', 'الانتفاخ سيصبح ثمرة'), ans: 'female' },
  { t: T('Pollen attaches to the tip of its pistil', 'تلتصق حبوب اللقاح بقمة مدقتها'), ans: 'female' }
];
async function stage3() {
  Object.assign(sc, { mode: 'plant', dots: true, bee: null, hi: null }); g.paint();
  await g.speedRound({
    items: SPEED, rounds: 8,
    buttons: [{ label: T('Male flower', 'زهرة مذكرة'), value: 'male', c: 1 }, { label: T('Female flower', 'زهرة مؤنثة'), value: 'female', c: 2 }],
    ask: T('Male flower or female flower?', 'زهرة مذكرة أم مؤنثة؟'),
    intro: T('Speed Round! I will describe a luffa flower. Is it the <b>male</b> flower or the <b>female</b> flower? Press the right button before time runs out. 8 rounds!', P('جولة السرعة! هوصف زهرة لوف. هي الزهرة <b>المذكرة</b> ولا <b>المؤنثة</b>؟ اضغط الزر الصح قبل ما الوقت يخلص. ٨ جولات!', 'جولة السرعة! هوصف زهرة لوف. هي الزهرة <b>المذكرة</b> ولا <b>المؤنثة</b>؟ اضغطي الزر الصح قبل ما الوقت يخلص. ٨ جولات!')),
    think: T('Which flower is it?', 'أي زهرة هي؟')
  });
}

g.run({
  intro: T(`Hi, <b>${g.name()}</b>! Welcome to my Flower Lab. First we meet the <b>male</b> and <b>female</b> flowers of a luffa plant. Then we use a <b>microscope</b> to look at pollen, and find out how a flower becomes a <b>fruit</b>.`, P(`أهلًا يا <b>${g.name()}</b>! أهلًا بيك في معمل الزهور. أولًا نتعرّف على الزهرة <b>المذكرة</b> والزهرة <b>المؤنثة</b> في نبات اللوف. بعدين نستخدم <b>المجهر</b> لنشوف حبوب اللقاح، ونعرف إزاي الزهرة بتتحوّل لـ<b>ثمرة</b>.`, `أهلًا يا <b>${g.name()}</b>! أهلًا بيكي في معمل الزهور. أولًا نتعرّف على الزهرة <b>المذكرة</b> والزهرة <b>المؤنثة</b> في نبات اللوف. بعدين نستخدم <b>المجهر</b> لنشوف حبوب اللقاح، ونعرف إزاي الزهرة بتتحوّل لـ<b>ثمرة</b>.`)),
  stages: [{ name: T('Warm Up', 'التسخين'), fn: stage1 }, { name: T('Missions', 'المهمات'), fn: stage2 }, { name: T('Speed Round', 'جولة السرعة'), fn: stage3 }],
  done: { title: T('Great job!', P('برافو عليك!', 'برافو عليكي!')), text: T('The male flower has a <b>stamen</b> that makes yellow <b>pollen</b>. The female flower has a <b>pistil</b> and a swelling. When pollen attaches to the pistil, that is <b>pollination</b>, and the swelling becomes a <b>fruit</b>.', 'الزهرة المذكرة لها <b>سداة</b> تصنع <b>حبوب اللقاح</b> الصفراء. الزهرة المؤنثة لها <b>كربلة</b> وانتفاخ. وعندما تلتصق حبوب اللقاح بالكربلة يحدث <b>التلقيح</b>، ويصبح الانتفاخ <b>ثمرة</b>.') }
}).catch(err => console.error(err));
window.__flowerlab = { sc, render };
})();
</script>
