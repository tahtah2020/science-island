<!-- Math Grade 4 · Unit 1 (mg4u1) adventure «تلّ التقريب / Rounding Hill», lesson 8 (rounding with the midpoint on the number line; the rounding
     rule: circle the digit to the right of the rounding place, 5 or more → add one, 4 or less → keep, then zeros; rounding up to the milliards;
     estimating a sum by rounding versus the «first digit from the left» strategy: the book's 47 + 31 → 50 + 30 = 80 vs 40 + 30 = 70, exact 78).
     A BOULDER (the fox rolls it from the mountain): 1) tap the digit to circle (the one right of the rounding place); 2) the hill is the number
     line: valleys = the two round numbers, the top = the midpoint, the boulder sits at its number; set the wheels of the rounded number and
     throw the net. The boulder rolls by the rule (exactly 5 rolls forward); the net catches it only in the right valley, else it smashes a house.
     THE GIANT BOULDER (last of each round): a + b; round each number to its leading place, set the estimate; then the exact sum, your estimate
     and the fox's «first digit from the left» estimate are compared on a ruler.
     Excitement: 5 village houses; a house falls on each missed boulder (all 5 = lost); the boulder shakes harder as its timer runs and rolls
     by itself at 0; 3 catches in a row = Reesho builds a stone wall and repairs a house. Clouds and birds move, the boulder spins as it rolls,
     dust and a screen shake on a crash, sun rays when you win.
     Pictures: the owner's Gemini sheet (28 Oct 2026) cut out into math/assets/: bg_mountain.jpg, hill.webp (the hill's top is approximated
     by a smooth curve: valleys x 46 / 392, top x 243 in the 440-wide scene), boulder, boulder_gold, fox_push (cliff cut off), reesho_net,
     reesho_catch, hut_ok, hut_broken, stone_wall; fox_laugh reused. Progress: SI.chProf('mg4u1').hill = { lvl, best, stars[] }.
     Test hooks window.__hill, window.__hillApi. -->
<style>

<script>
(() => {
'use strict';
const me = SI.requirePlayer(); if (!me) return;
const CH = SI.requireChapter('mg4u1'); if (!CH) return;
const T = SI.T, GAME = 'math-hill.html';
const $ = s => document.querySelector(s);
const sleep = ms => new Promise(r => setTimeout(r, ms));
const n = s => `<bdi dir="ltr">${s}</bdi>`;
const rnd = k => Math.floor(Math.random() * k);
const pick = a => a[rnd(a.length)];
const fmt = x => Number(x).toLocaleString('en-US');
const P10 = e => 10 ** e;
document.title = T('Rounding Hill · Rounding Numbers', 'تلّ التقريب · تقريب الأعداد');
$('#rules').innerHTML = [
  T('Each boulder has a number. First tap the digit to <b>circle</b>: the one right of the rounding place.', 'كل صخرة عليها عدد. الأول اضغط على الرقم اللي <b>هتحوّطه</b>: اللي على يمين خانة التقريب.'),
  T('The hill is a number line: two valleys and the midpoint on top. Set the rounded number and throw the net 🥅.', 'التل خط أعداد: واديين والمنتصف فوق. اضبط العدد المقرّب وارمِ الشبكة 🥅.'),
  T('Wrong valley or too slow = the boulder smashes a house 🏚️. <b>5 houses</b> and the village is lost!', 'وادي غلط أو اتأخرت = الصخرة تهد بيت 🏚️. <b>5 بيوت</b> والقرية تضيع!'),
  T('The giant boulder at the end: estimate a sum by rounding and beat the fox’s estimate!', 'الصخرة العملاقة في الآخر: قدّر ناتج الجمع بالتقريب واغلب تقدير الثعلب!')].map(x => `<li>${x}</li>`).join('');
$('#start').textContent = T('Save the village! 🥅', 'يلا ننقذ القرية 🥅');

/* ---------- places ---------- */
const NEAR = { 1: ['ten', 'عشرة'], 2: ['hundred', 'مائة'], 3: ['thousand', 'ألف'], 4: ['ten thousand', 'عشرات الألوف'], 5: ['hundred thousand', 'مئات الألوف'],
  6: ['million', 'مليون'], 7: ['ten million', 'عشرات الملايين'], 8: ['hundred million', 'مئات الملايين'], 9: ['milliard', 'مليار'] };
const PLACE = { 0: ['ones', 'الآحاد'], 1: ['tens', 'العشرات'], 2: ['hundreds', 'المئات'], 3: ['thousands', 'آحاد الألوف'], 4: ['ten thousands', 'عشرات الألوف'], 5: ['hundred thousands', 'مئات الألوف'],
  6: ['millions', 'آحاد الملايين'], 7: ['ten millions', 'عشرات الملايين'], 8: ['hundred millions', 'مئات الملايين'], 9: ['milliards', 'المليارات'] };
const nearTxt = e => T(`to the nearest ${NEAR[e][0]}`, `لأقرب ${NEAR[e][1]}`);
const pname = e => T(PLACE[e][0], PLACE[e][1]);
const roundTo = (x, e) => { const u = P10(e), lo = Math.floor(x / u) * u; return x - lo >= u / 2 ? lo + u : lo; };

/* six rounds: places = rounding places (powers of ten); dg = digits; five = share exactly on the midpoint; carry = share where rounding up
   changes the place above (49,682 → 50,000); est = digits of the giant boulder's two numbers; sec = seconds per boulder */
const LEVELS = [
  { places: [1, 2], dg: [3, 4], five: .15, carry: 0, boulders: 5, est: 2, sec: 25 },
  { places: [3], dg: [4, 5], five: .15, carry: .1, boulders: 5, est: 3, sec: 24 },
  { places: [3, 4, 5], dg: [5, 6], five: .1, carry: .2, boulders: 5, est: 4, sec: 22 },
  { places: [2, 3, 4, 5], dg: [5, 7], five: .25, carry: .3, boulders: 5, est: 4, sec: 20 },
  { places: [5, 6], dg: [7, 9], five: .1, carry: .2, boulders: 5, est: 4, sec: 18 },
  { places: [3, 5, 6, 9], dg: [7, 10], five: .15, carry: .2, boulders: 6, est: 5, sec: 15, boss: true }];
const S = { t0: Date.now(), lvl: Math.min(5, ((SI.chProf(CH.id).hill || {}).lvl) || 0), score: 0, huts: [1, 1, 1, 1, 1], misses: 0, streak: 0, bi: 0, busy: true, started: false,
  task: null, phase: 'circle', wheels: [], deadline: 0, hintN: 0 };
const L = () => LEVELS[S.lvl];

function makeBoulder() {
  const lv = L();
  for (let guard = 0; guard < 400; guard++) {
    const e = pick(lv.places), d = Math.max(e + 1, lv.dg[0] + rnd(lv.dg[1] - lv.dg[0] + 1));
    const s = [String(1 + rnd(9))]; for (let i = 1; i < d; i++) s.push(String(rnd(10)));
    const at = p => d - 1 - p;                                            // index of place p in the digit string
    if (Math.random() < lv.five && e >= 1) { s[at(e - 1)] = '5'; for (let p = e - 2; p >= 0; p--) s[at(p)] = '0'; }
    else if (Math.random() < lv.carry && e + 1 <= d - 1) { s[at(e)] = '9'; s[at(e - 1)] = String(5 + rnd(5)); }
    const x = +s.join(''), u = P10(e);
    if (x % u === 0) continue;                                             // already round: no boulder on a valley
    const r = roundTo(x, e);
    if (String(r).length > d) continue;                                    // no new digit (96,000 → 100,000)
    const top = Math.min(d - 1, e + 2);                                    // the wheels: the rounding place and up to two above it
    if (Math.floor(r / P10(top + 1)) !== Math.floor(x / P10(top + 1))) continue;
    const lo = Math.floor(x / u) * u;
    return { t: 'R', x, e, d, top, lo, hi: lo + u, mid: lo + u / 2, ans: r };
  }
  return makeBoulder();
}
function makeGiant() {
  const d = L().est, e = d - 1;
  for (let guard = 0; guard < 400; guard++) {
    const mk = () => { const s = [String(1 + rnd(8))]; for (let i = 1; i < d; i++) s.push(String(rnd(10))); return +s.join(''); };
    const a = mk(), b = mk(), A = roundTo(a, e), B = roundTo(b, e);
    if (String(A).length > d || String(B).length > d) continue;
    const F = Math.floor(a / P10(e)) * P10(e) + Math.floor(b / P10(e)) * P10(e), E = A + B, X = a + b;
    if (a % P10(e) === 0 || b % P10(e) === 0) continue;
    const better = Math.abs(E - X) < Math.abs(F - X);
    if (!better && Math.random() < .8) continue;                            // the book's point: rounding is usually closer
    return { t: 'G', a, b, e, d, A, B, E, F, X };
  }
}

/* ---------- panel ---------- */
function drawOrder() {
  const k = S.task;
  $('#order').className = 'order' + (k.t === 'G' ? ' giant' : '');
  $('#order').innerHTML = k.t === 'R'
    ? `${T('Round', 'قرّب')} ${nearTxt(k.e)}<small>${T(`Boulder ${S.bi + 1} of ${L().boulders}`, `صخرة ${S.bi + 1} من ${L().boulders}`)}</small><div class="timer" id="timer"><i></i></div>`
    : `${T('🪨 The giant boulder: estimate the sum', '🪨 الصخرة العملاقة: قدّر ناتج الجمع')}<small>${T(`Round each number ${nearTxt(k.e)}, then add`, `قرّب كل عدد ${nearTxt(k.e)}، وبعدين اجمع`)}</small><div class="timer" id="timer"><i></i></div>`;
}
function digitsHTML(x, ringAt, underlineAt, clickable) {
  const s = String(x), d = s.length; let h = '';
  s.split('').forEach((c, i) => { const p = d - 1 - i;
    h += `<button type="button" class="dg${p === ringAt ? ' ring' : ''}${p === underlineAt ? ' place' : ''}" data-p="${p}" ${clickable ? '' : 'disabled'} aria-label="${c}">${c}</button>`;
    if (p && p % 3 === 0) h += '<span class="comma">,</span>'; });
  return `<div class="digits">${h}</div>`;
}
/* wheels: one per digit; editable places from..to keep their own value, the others are fixed (a digit from the number, or 0) */
function wheelsHTML(id, digits, from, to, lead0 = false) {
  const d = digits.length; let h = '';
  digits.forEach((v, i) => { const p = d - 1 - i, ed = p >= from && p <= to;
    h += `<div class="wh ${ed ? 'edit' : 'fixed'}${lead0 && i === 0 && v === 0 ? ' lead0' : ''}">${ed ? `<button type="button" data-w="${id}" data-i="${i}" data-d="1" aria-label="${T('up', 'زوّد')}">▲</button>` : '<span class="sp"></span>'}<b id="${id}${i}">${v}</b>${ed ? `<button type="button" data-w="${id}" data-i="${i}" data-d="-1" aria-label="${T('down', 'قلّل')}">▼</button>` : '<span class="sp"></span>'}</div>`;
    if (p && p % 3 === 0) h += '<span class="wcomma">,</span>'; });
  return `<div class="wheels">${h}</div>`;
}
function bindWheels() {
  $('#work').querySelectorAll('.wh button').forEach(b => b.onclick = () => {
    if (S.busy) return; const w = S.wheels[b.dataset.w], i = +b.dataset.i;
    w[i] = (w[i] + +b.dataset.d + 10) % 10; SFX.click();
    const el = $('#' + b.dataset.w + i); el.textContent = w[i]; el.parentElement.classList.toggle('lead0', i === 0 && w[i] === 0 && b.dataset.w === 's');
    if (S.task.t === 'R') drawScene();
  });
}
const wval = w => +w.join('');
function drawWork() {
  const k = S.task;
  $('#ruler').hidden = true;
  if (k.t === 'R') {
    const circled = S.phase !== 'circle';

  if (k.t === 'G') h = S.hintN === 1 ? T('Round each number by its second digit: 5 or more → add one to the first digit; 4 or less → keep it.', 'قرّب كل عدد حسب تاني رقم فيه: 5 أو أكبر → زوّد الرقم الأول واحد؛ 4 أو أقل → سيبه.') : T('Then add the two rounded numbers: only the first digits change.', 'وبعدين اجمع العددين المقرّبين: الأرقام الأولى بس هي اللي بتتجمع.');
  else if (S.phase === 'circle') h = T(`Find the ${pname(k.e)} place first, then look one place to its right.`, `دوّر على خانة ${pname(k.e)} الأول، وبعدين بُص خانة واحدة على يمينها.`);
  else h = S.hintN === 1 ? T('Circled digit 5 or more → add one to the rounding place. 4 or less → keep it. The places after it become zeros.', 'الرقم المحوّط 5 أو أكبر → زوّد خانة التقريب واحد. 4 أو أقل → سيبها. والخانات اللي بعدها أصفار.') : T('Look at the hill: before the midpoint it rolls back, after it (or exactly on it) it rolls forward.', 'بُص على التل: قبل المنتصف بتتدحرج لورا، وبعده (أو عليه بالظبط) بتتدحرج لقدّام.');
  $('#say').innerHTML = '🦜 ' + h;
}

/* ---------- rounds ---------- */
function startLevel() {
  S.t0 = Date.now(); S.huts = [1, 1, 1, 1, 1]; S.misses = 0; S.streak = 0; S.bi = 0; S.task = null;
  $('#lvl').textContent = S.lvl + 1;
  if (L().boss) banner(T('⛰️ The big avalanche!', '⛰️ الانهيار الكبير!'));
  if (A.ctx && A.mode !== 'run') music('run');
  S.busy = true; next();
}
async function win_() {
  S.busy = true; const stars = S.misses === 0 ? 3 : S.misses <= 2 ? 2 : 1, pts = 20 + stars * 10;
  S.score += pts; $('#score').textContent = S.score; music('off'); SFX.win(); drawScene({ rx: 220, caught: true, msg: T('The village is safe!', 'القرية في أمان!') });
  saveWin(stars, pts); await sleep(1500); showEnd(S.lvl === LEVELS.length - 1 ? 'all' : 'win', stars);
}
async function lose() {
  S.busy = true; music('off'); SFX.lose(); drawScene({ foxLaugh: true, msg: T('The fox flattened the village!', 'الثعلب هدّ القرية!') });
  SI.ga('game_complete', { game: GAME, chapter: CH.id, stage: S.lvl + 1, score: 0, mistakes: S.misses, seconds: Math.round((Date.now() - S.t0) / 1000), won: 0 });
  await sleep(1500); showEnd('lose');
}
function showEnd(kind, stars = 0) {
  $('#end').hidden = false;
  const cfg = {
    win: ['catch', T('The village is safe!', 'القرية في أمان!'), '⭐'.repeat(stars) + '☆'.repeat(3 - stars), T('The fox is climbing a higher mountain… ready?', 'الثعلب طالع جبل أعلى… جاهز؟'), T('Next round ➜', 'الجولة اللي بعدها ⬅')],
    all: ['catch', T('Guardian of the valley!', 'حارس الوادي!'), '⭐'.repeat(stars) + '☆'.repeat(3 - stars), T(`You scored ${n(S.score)} points. You round and estimate like a pro!`, `مجموع نقطك ${n(S.score)}. بقيت بتقرّب وتقدّر زي المحترفين!`), T('Play again', 'العب من الأول')],
    lose: ['laugh', T('The village fell', 'القرية اتهدّت'), '', T('Circle the digit right of the rounding place: 5 or more goes up, 4 or less stays. Try again!', 'حوّط الرقم اللي على يمين خانة التقريب: 5 أو أكبر لفوق، 4 أو أقل يفضل زي ما هو. جرّب تاني!'), T('Try again', 'جرّب تاني')]
  }[kind];
  $('#endArt').innerHTML = (kind === 'lose' ? '' : '<div class="rays"></div>') + `<img src="${src(cfg[0])}" alt="">`;
  $('#endTitle').textContent = cfg[1]; $('#endStars').textContent = cfg[2]; $('#endText').innerHTML = cfg[3]; $('#endBtn').textContent = cfg[4];
  $('#endBtn').onclick = () => { $('#end').hidden = true; if (kind === 'win') S.lvl++; if (kind === 'all') { S.lvl = 0; S.score = 0; $('#score').textContent = 0; } startLevel(); };
}
/* progress: SI.chProf('mg4u1').hill = { lvl: next round, best: highest round won (1-6), stars: [per round] } */
function saveWin(stars, pts) {
  const done = S.lvl + 1;
  SI.updateChProf(c => { const o = c.hill = c.hill || {}; o.best = Math.max(o.best || 0, done); o.stars = o.stars || []; o.stars[S.lvl] = Math.max(o.stars[S.lvl] || 0, stars); o.lvl = done >= LEVELS.length ? 0 : done; }, CH.id);
  SI.addXP(pts);
  SI.ga('game_complete', { game: GAME, chapter: CH.id, stage: done, score: pts, mistakes: S.misses, seconds: Math.round((Date.now() - S.t0) / 1000), won: 1 });
}

/* ---------- music and sound (Web Audio, no files): a bold mountain march; faster as houses fall ---------- */
const A = { ctx: null, on: !SI.isMuted(), timer: null, beat: 0, next: 0, mode: 'off' };
const hz = m => 440 * 2 ** ((m - 69) / 12);
function ac() { if (!A.ctx) { const C = window.AudioContext || window.webkitAudioContext; if (!C) return null; A.ctx = new C(); A.master = A.ctx.createGain(); A.master.gain.value = A.on ? .55 : 0; A.master.connect(A.ctx.destination); } if (A.ctx.state === 'suspended') A.ctx.resume(); return A.ctx; }
function tone(m, t, dur, { type = 'triangle', vol = .2, cut = 2400, glide = 0 } = {}) {
  const c = A.ctx, o = c.createOscillator(), g = c.createGain(), f = c.createBiquadFilter();
  o.type = type; o.frequency.setValueAtTime(hz(m), t); if (glide) o.frequency.exponentialRampToValueAtTime(hz(m + glide), t + dur);
  f.type = 'lowpass'; f.frequency.value = cut;
  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + .012); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(f); f.connect(g); g.connect(A.master); o.start(t); o.stop(t + dur + .05);
}
function noise(t, dur, vol, from, to) { const c = A.ctx, b = c.createBuffer(1, Math.max(1, c.sampleRate * dur), c.sampleRate), d = b.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1; const s = c.createBufferSource(), f = c.createBiquadFilter(), g = c.createGain(); s.buffer = b; f.type = 'bandpass'; f.frequency.setValueAtTime(from, t); f.frequency.exponentialRampToValueAtTime(to, t + dur); g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur); s.connect(f); f.connect(g); g.connect(A.master); s.start(t); }
const TUNE = [62, 0, 69, 0, 67, 65, 64, 0, 62, 0, 65, 69, 74, 0, 72, 69];
function musicTick() {
  const c = A.ctx; if (!c) return;
  const lostH = 5 - S.huts.filter(Boolean).length, bpm = 100 + lostH * 10 + (L().boss ? 10 : 0), spb = 60 / bpm / 2;
  while (A.next < c.currentTime + .12) {
    const i = A.beat % 16, t = A.next;
    if (i % 4 === 0) { tone(38, t, spb * 1.8, { type: 'triangle', vol: .15, cut: 420 }); noise(t, .12, .12, 300, 120); }
    if (i % 4 === 2) noise(t, .05, .06, 5000, 2500);
    if (TUNE[i]) tone(TUNE[i], t, spb * .8, { type: 'square', vol: .035, cut: 1700 });
    if (i % 8 === 0) tone(TUNE[i] ? TUNE[i] - 12 : 50, t, spb * 3, { type: 'sine', vol: .05, cut: 900 });
    A.beat++; A.next += spb;
  }
}
function music(mode) { if (!ac()) return; A.mode = mode; clearInterval(A.timer); A.timer = null; if (mode === 'run') { A.beat = 0; A.next = A.ctx.currentTime + .1; A.timer = setInterval(musicTick, 30); } }
const SFX = {
  rumble() { if (!ac()) return; noise(A.ctx.currentTime, .9, .3, 180, 60); },
  thud() { if (!ac()) return; const t = A.ctx.currentTime; tone(36, t, .3, { type: 'sine', vol: .35 }); noise(t, .15, .2, 400, 100); },
  circle() { if (!ac()) return; const t = A.ctx.currentTime; [76, 79, 84].forEach((m, i) => tone(m, t + i * .05, .2, { type: 'sine', vol: .1 })); },
  click() { if (!ac()) return; tone(84, A.ctx.currentTime, .05, { type: 'square', vol: .04, cut: 4000 }); },
  whoosh() { if (!ac()) return; noise(A.ctx.currentTime, .35, .25, 800, 4000); },
  catch() { if (!ac()) return; const t = A.ctx.currentTime; noise(t, .12, .2, 600, 300); [72, 76, 79, 84].forEach((m, i) => tone(m, t + .08 + i * .07, .3, { type: 'triangle', vol: .13 })); },
  crash() { if (!ac()) return; const t = A.ctx.currentTime; noise(t, .9, .5, 1200, 80); tone(33, t, .5, { type: 'sine', vol: .35 }); },
  build() { if (!ac()) return; const t = A.ctx.currentTime; [0, .1, .2, .3].forEach(d => { noise(t + d, .06, .2, 900, 400); }); },
  sparkle() { if (!ac()) return; const t = A.ctx.currentTime; [84, 88, 91, 96, 100].forEach((m, i) => tone(m, t + i * .06, .3, { type: 'sine', vol: .08 })); },
  wrong() { if (!ac()) return; const t = A.ctx.currentTime; tone(52, t, .35, { type: 'sawtooth', vol: .12, cut: 900, glide: -5 }); },
  tick() { if (!ac()) return; tone(93, A.ctx.currentTime, .04, { type: 'square', vol: .05, cut: 5000 }); },
  win() { if (!ac()) return; const t = A.ctx.currentTime; [62, 66, 69, 74, 78, 81, 86].forEach((m, i) => tone(m, t + i * .09, .55, { type: 'triangle', vol: .16 })); },
  lose() { if (!ac()) return; const t = A.ctx.currentTime; [62, 61, 60, 55].forEach((m, i) => tone(m, t + i * .28, .5, { type: 'triangle', vol: .15, cut: 1200 })); }
};
function setSound(on) { A.on = on; SI.setMuted(!on); $('#snd').textContent = on ? '🔊' : '🔇'; if (A.master) A.master.gain.setTargetAtTime(on ? .55 : 0, A.ctx.currentTime, .05); }
$('#snd').onclick = () => { ac(); setSound(!A.on); };
$('#snd').textContent = A.on ? '🔊' : '🔇';

$('#throw').onclick = throwNet; $('#hint').onclick = hint;
$('#start').onclick = () => { $('#intro').hidden = true; S.started = true; music('run'); startTimer(); SI.ga('game_start', { game: GAME, chapter: CH.id }); };
window.__hill = S; window.__hillApi = { startLevel, makeBoulder, makeGiant, LEVELS, roundTo, xOf, hillY,
  solve: () => { const k = S.task;
    if (k.t === 'R') { if (S.phase === 'circle') { document.querySelector(`.dg[data-p="${k.e - 1}"]`).click(); } S.wheels.r = String(k.ans).padStart(k.d, '0').split('').map(Number); drawWork(); return; }
    S.wheels.a = String(k.A).split('').map(Number); S.wheels.b = String(k.B).split('').map(Number); S.wheels.s = String(k.E).padStart(k.d + 1, '0').split('').map(Number); drawWork(); } };
drawScene(); startLevel();
})();
</script>
